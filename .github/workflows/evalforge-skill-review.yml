name: EvalForge Skill Review
# `/review` finds this run by the head SHA in its title (evalforge-re-eval.yml).
run-name: EvalForge Skill Review · PR #${{ github.event.pull_request.number }} · ${{ github.event.pull_request.head.sha }}

# Reviews the *content* of wix-manage skills and their eval scenarios, against the guide sections
# named in .github/prompts/skill-review.md. The eval gates check wiring; nothing else reads the prose.
#
# Automatic on PR creation, manual thereafter: a push does not spend. `/review` re-runs it, via the
# COMMANDS map in evalforge-re-eval.yml.
#
# The `evalforge-` prefix is load-bearing: ci.yml's detect step matches it to decide whether to run
# the tests covering this wiring, so a differently named file would silently skip them.

# pull_request_target, not pull_request: this job holds secrets, and under pull_request the
# workflow file and the action both come from the PR, so any branch could rewrite them. Here
# both come from main. The PR is checked out as data only: nothing from it is executed.
#
# The reviewer's own definition (.claude/agents/skill-review.md) is read from .action-src too,
# so a PR cannot rewrite the instructions it is reviewed by.
on:
  pull_request_target:
    branches: [main]
    # No `paths:` filter, for the reason ci.yml gives at length: a required check whose workflow is
    # path-scoped is never reported on PRs outside those paths, and GitHub leaves it "Expected —
    # waiting for status to be reported" forever. The action decides scope from the changed files.
    #
    # `synchronize` is here even though a push must not spend: the check has to be reported on every
    # head commit, and `/review` re-runs the run for the current head, so there has to be one.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: evalforge-skill-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # The job name *is* the required-status-check name. Left implicit it would be `review`, and
    # generic names collide in the picker — both eval gates already expose a job called `gate`.
    name: skill-review
    runs-on: ubuntu-latest
    # Comfortably over the reviewer's own 900-second ceiling, leaving room for checkout and install.
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      # A pull_request_target run is attached to main's commit, not the PR's, so it does not show on
      # the PR by itself. These two status steps put it there, under the workflow's name.
      - name: Report pending on the PR head
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'pending',
              context: process.env.GITHUB_WORKFLOW,
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

      # The PR merge ref, `refs/pull/N/merge` — the tree as it will land, which is what's worth
      # reviewing. Read as data only. Its first parent is the base, so the reviewer diffs `HEAD^1 HEAD`.
      # fetch-depth: 0 because `HEAD^1` is not in a depth-1 clone.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      # The action source and the reviewer definition, from the PR's base on main.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .action-src
          persist-credentials: false

      # Pinned exactly: this action parses the CLI's JSON envelope and depends on its flag surface,
      # and both move between releases. Installed from the runner's temp dir so an `.npmrc` in the
      # PR checkout cannot redirect the registry.
      - run: npm install -g @anthropic-ai/claude-code@2.1.263
        working-directory: ${{ runner.temp }}

      - uses: ./.action-src/.github/actions/evalforge-yaml-gate
        with:
          mode: review
          github-token: ${{ secrets.GITHUB_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          anthropic-base-url: ${{ vars.ANTHROPIC_BASE_URL }}
          review-model: ${{ vars.SKILL_REVIEW_MODEL }}
          review-effort: ${{ vars.SKILL_REVIEW_EFFORT }}
          review-timeout-seconds: ${{ vars.SKILL_REVIEW_TIMEOUT_SECONDS }}
          blocking: ${{ vars.SKILL_REVIEW_BLOCK_MERGE || 'false' }}
          triggered-by: ${{ github.triggering_actor }}

      - name: Report the verdict on the PR head
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = { success: 'success', failure: 'failure' }[process.env.JOB_STATUS] ?? 'error';
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.payload.pull_request.head.sha,
              state,
              context: process.env.GITHUB_WORKFLOW,
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });
