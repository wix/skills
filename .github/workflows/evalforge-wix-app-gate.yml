name: EvalForge wix-app Gate

# pull_request_target, not pull_request: this job holds secrets, and under pull_request the
# workflow file and the action both come from the PR, so any branch could rewrite them. Here
# both come from main. The PR is checked out as data only: nothing from it is executed.
on:
  pull_request_target:
    branches: [main]
    # ready_for_review matters because the job is gated on `!draft`: without it, marking a
    # draft PR ready would not fire the gate at all, and the PR would sit unevaluated until
    # its next push.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'skills/wix-app/**'
      - 'yaml/wix-app-evals/**'

# Only the newest commit's verdict is correct, so supersede in-flight runs. Accepted cost:
# a cancelled workflow leaves its EvalForge run executing server-side and its capability
# version orphaned — both are swept by the cleanup job when the PR closes.
concurrency:
  group: evalforge-wix-app-gate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    environment:
      name: evalforge
      deployment: false
    # Longer than the 30-minute eval poll window, with room for setup and the draft sync.
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write
    outputs:
      analyze-run-id: ${{ steps.gate.outputs.analyze-run-id }}
    steps:
      # Two checkouts, as the yaml-gate workflows do:
      # 1) PR merge ref — the skill files and head scenario YAML, read as data only.
      # 2) main's head (github.sha, the commit this workflow file came from) into .action-src —
      #    base scenarios, so the sync plan can tell a PR-only scenario from one that pre-existed
      #    the PR, and the action source. main's head is also the merge ref's first parent.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
      # pull_request_target can start before GitHub rebuilds refs/pull/N/merge for this push. Wait
      # until the merge commit's second parent is this head, so the gate never evaluates the
      # previous push's tree. The rebuild usually takes seconds but can take minutes, so the waits
      # back off to about three minutes in all. On giving up, the PR's `mergeable` tells a conflict,
      # which needs a push, from a slow rebuild, which needs a re-run.
      - name: Wait for the merge ref to include this head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # An `if`, not `[ ] && echo`: under the runner's `bash -e` a false test in a command
          # substitution fails the assignment, and a full-history checkout would exit here.
          depth=$(if [ -f .git/shallow ]; then echo --depth=1; fi)
          for wait in 0 5 10 15 20 30 30 30 40; do
            if [ "$wait" -gt 0 ]; then
              echo "Merge ref is at head ${merged_head:-none}, waiting ${wait}s for $HEAD_SHA"
              sleep "$wait"
              git fetch --no-tags $depth origin "+refs/pull/$PR_NUMBER/merge:refs/remotes/pull/merge" \
                && git checkout -q --detach refs/remotes/pull/merge
            fi
            merged_head=$(git cat-file -p HEAD | awk '/^parent /{print $2}' | sed -n 2p)
            [ "$merged_head" = "$HEAD_SHA" ] && exit 0
          done
          mergeable=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .mergeable || echo unknown)
          if [ "$mergeable" = false ]; then
            echo "::error::This PR has conflicts with main, so GitHub cannot build refs/pull/$PR_NUMBER/merge. Resolve them and push."
          else
            echo "::error::GitHub has not rebuilt refs/pull/$PR_NUMBER/merge for $HEAD_SHA after about three minutes. Re-run this job."
          fi
          exit 1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ github.sha }}
          path: .action-src
          persist-credentials: false
      # The version label is content-addressed, so it must name the commit actually checked out.
      # Under pull_request_target GITHUB_SHA is main's commit, not the merge commit, and the
      # payload's merge commit goes stale on a re-run, which replays the original event while the
      # checkout above resolved refs/pull/N/merge fresh. Only HEAD names what was checked out.
      - name: Resolve the checked-out merge commit
        id: merge
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: gate
        uses: ./.action-src/.github/actions/evalforge-skill-gate
        with:
          mode: gate
          evaluated-sha: ${{ steps.merge.outputs.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          evalforge-url: ${{ vars.EVALFORGE_URL }}
          evalforge-project-id: ${{ vars.STUDIO2_PIPELINE_PROJECT_ID }}
          evalforge-app-id: ${{ secrets.AUTO_SKILLS_PIPELINE_APP_ID }}
          evalforge-app-secret: ${{ secrets.AUTO_SKILLS_PIPELINE_APP_SECRET }}
          evals-glob: 'yaml/wix-app-evals/**/*.{yml,yaml}'
          skill-dir: skills/wix-app
          # Inline rather than repo vars: neither is a secret, and in the workflow file they
          # appear in the diff, get reviewed when they change, and document what the gate
          # evaluates against. As repo vars they could be edited silently.
          capability-id: 6eb9e9b8-6fd7-4b6d-b846-cde489899ff2
          agent-id: 3b9754c0-d603-4a7f-b9b2-b4f17cff7a95
          # These repo variables are what this repo runs; the action's own defaults are what other
          # consumers get, since the README documents using this action from other repos and they
          # never set these variables.
          max-scenarios: ${{ vars.WIX_APP_EVAL_MAX_SCENARIOS }}
          blocking: ${{ vars.WIX_APP_EVAL_BLOCK_MERGE || 'false' }}
          runs-per-scenario: ${{ vars.WIX_APP_EVAL_RUNS_PER_SCENARIO }}
          base-arm-grace-seconds: ${{ vars.WIX_APP_EVAL_BASE_GRACE_SECONDS }}

  # The investigation runs here rather than in the gate job because a check finalises when its job
  # ends, not when a comment posts — sharing the job would hold the required check open for the
  # analysis's 57-second budget. Its own job also means an analysis failure cannot reach the gate's
  # check at all.
  analyze:
    needs: gate
    runs-on: ubuntu-latest
    environment:
      name: evalforge
      deployment: false
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    # `!cancelled()` rather than the default success-only behaviour: once `blocking` is true a
    # failing verdict makes the gate job red, and a plain `needs` would then skip precisely the
    # analysis that failure warrants. The empty-output check is the rest of the condition — the gate
    # emits a run id only when there is something to investigate.
    if: >-
      ${{ !cancelled()
          && vars.WIX_APP_EVAL_ANALYZE != 'false'
          && needs.gate.outputs.analyze-run-id != '' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      # One checkout, for the action source, from main's head (the commit this workflow came from).
      # Analyze mode reads no scenarios, so the PR itself is not checked out.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/evalforge-skill-gate
        with:
          mode: analyze
          eval-run-id: ${{ needs.gate.outputs.analyze-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          evalforge-url: ${{ vars.EVALFORGE_URL }}
          evalforge-project-id: ${{ vars.STUDIO2_PIPELINE_PROJECT_ID }}
          evalforge-app-id: ${{ secrets.AUTO_SKILLS_PIPELINE_APP_ID }}
          evalforge-app-secret: ${{ secrets.AUTO_SKILLS_PIPELINE_APP_SECRET }}
