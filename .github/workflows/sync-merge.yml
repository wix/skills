name: Merge the ax-skills snapshot

# wix/skills is a read-only mirror of wix-private/ax-skills. After every merge there, a job
# pushes a one-commit snapshot of the public-facing paths to the branch `sync/main` here.
# This workflow turns that push into a merged PR with no human on this side:
#   1. open (or reuse) the PR sync/main -> main with the workflow's own token,
#   2. approve it as skill-builder-bot, a second identity, which the org's PR Flow ruleset
#      requires (one approval, not by the last pusher),
#   3. enable auto-merge, so it lands as soon as the required checks report.
# Review and CI happened in ax-skills before the snapshot was built; nothing is re-judged here.
# Same two-identity shape as release-bump, which has merged every release PR this way.
#
# A new snapshot force-pushes sync/main; that dismisses the earlier approval and re-runs this
# workflow, which approves again. Only `sync/main` is listened to, so a dry run pushed to any
# other branch opens nothing. Idle until the pusher's push trigger is enabled at cutover.

on:
  push:
    branches: [sync/main]

concurrency:
  group: sync-merge
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    # Holds RELEASE_APP_CLIENT_ID / RELEASE_APP_PRIVATE_KEY (skill-builder-bot). Its deployment
    # branch policy must allow `sync/main`, or this job is refused before it starts.
    environment: codegen
    timeout-minutes: 10
    steps:
      - name: Open the PR, or reuse the open one
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          subject=$(gh api "repos/${REPO}/commits/${HEAD_SHA}" --jq '.commit.message | split("\n")[0]')
          url=$(gh pr list -R "$REPO" --head sync/main --base main --state open --json url --jq '.[0].url // empty')
          if [ -z "$url" ]; then
            body=$(printf '%s\n' \
              'Snapshot of the public-facing paths of `wix-private/ax-skills`, pushed by its sync job.' \
              '' \
              'Review and CI ran there before this commit was built. This PR is opened, approved and' \
              'merged by automation; nothing here needs a human. The source commit is named in the' \
              'commit message. If something looks wrong, fix it in ax-skills and let the next sync' \
              'supersede this branch.')
            url=$(gh pr create -R "$REPO" --base main --head sync/main --title "$subject" --body "$body")
            echo "opened $url"
          else
            echo "reusing $url"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # release.yml publishes to npm when a PR carrying the `release` label merges into main. Before
      # the mirror, release-bump opened that PR here and labelled it. Now the bump lands in ax-skills
      # and arrives as part of a snapshot, so the label has to be put on by the snapshot's PR when,
      # and only when, the version it carries differs from main's. Without this step the first bump
      # after cutover would merge and never publish.
      - name: Label `release` when the snapshot changes the package version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_URL: ${{ steps.pr.outputs.url }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version() {
            gh api "repos/${REPO}/contents/package.json?ref=$1" --jq '.content' | base64 -d \
              | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version"
          }
          main_version=$(version main)
          head_version=$(version "$HEAD_SHA")
          echo "main=${main_version} snapshot=${head_version}"
          if [ "$main_version" != "$head_version" ]; then
            gh label list -R "$REPO" --search release --json name --jq '.[].name' | grep -qx release \
              || gh label create release -R "$REPO" --color 0E8A16 --description "Merging publishes to npm"
            gh pr edit "$PR_URL" --add-label release
            echo "labelled: merging publishes v${head_version}"
          else
            gh pr edit "$PR_URL" --remove-label release 2>/dev/null || true
            echo "no version change; not a release"
          fi

      - name: Mint a skill-builder-bot token (a second identity, so it may approve)
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Approve
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh pr review --approve "$PR_URL" --body "Automated approval: snapshot from wix-private/ax-skills, reviewed and gated there."

      # Merge directly as the App, not via auto-merge. main is locked by the ruleset "mirror: main
      # is written only by the sync", whose bypass names this App. GitHub honours that bypass when
      # the App itself calls the merge API, but not for auto-merge, which GitHub performs later on
      # the App's behalf: the first live sync (#1769) sat approved and blocked for exactly that
      # reason. Nothing else gates the merge (no required checks; review already given), so the
      # direct call succeeds at once. If it ever does not, fall back to auto-merge so a transient
      # condition still resolves without a human.
      - name: Merge as skill-builder-bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          # --admin: without it gh refuses client-side as soon as the PR shows "blocked", which the
          # lock makes it show for everyone, and never asks the server, where the App's bypass is
          # evaluated. The flag only tells gh to attempt the merge; the bypass decision stays
          # GitHub's. Seen on #1771: "the base branch policy prohibits the merge" from gh itself.
          if gh pr merge --squash --admin "$PR_URL"; then
            echo "merged"
          else
            echo "::warning::direct merge refused; arming auto-merge as a fallback"
            gh pr merge --auto --squash "$PR_URL"
          fi
