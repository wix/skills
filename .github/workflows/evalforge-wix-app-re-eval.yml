name: EvalForge wix-app Re-eval

on:
  issue_comment:
    # `created` only. Editing a months-old comment to add /re-eval is a confusing way to start a
    # run that costs a live agent build per scenario.
    types: [created]

# Deliberately NOT the gate's concurrency group. Sharing it would let this dispatcher cancel the
# very gate run it is about to re-run.
concurrency:
  group: evalforge-wix-app-re-eval-pr-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  re-eval:
    runs-on: ubuntu-latest
    # It makes four API calls and starts nothing of its own; the re-run it triggers is a separate
    # workflow run with the gate's own 60-minute budget.
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    # A loose pre-filter, so ordinary PR conversation never starts a runner. The strict parse in the
    # action decides whether anything is actually spent — `contains` would also match a comment that
    # merely mentions the command.
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/re-eval') }}
    permissions:
      # To POST actions/runs/{run_id}/rerun.
      actions: write
      # To upsert the refusal comment.
      pull-requests: write
      contents: read
    steps:
      # The action source only. On issue_comment this workflow runs from the default branch with
      # secrets available, so checking out PR content and executing it would be a pwn-request. The
      # dispatcher needs no PR content: it re-runs the gate, which does its own checkout.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: ./.github/actions/evalforge-skill-gate
        with:
          mode: re-eval
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gate-workflow-file: evalforge-wix-app-gate.yml
