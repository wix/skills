name: Typecheck

# The single producer of the `typecheck` status check, which main's branch protection
# requires on EVERY pull request. That is why this workflow has no `paths:` filter: a
# required check whose workflow is path-scoped never reports on PRs outside those paths,
# and GitHub leaves them "Expected — waiting for status to be reported" forever. Docs-only
# PRs (#701), yaml-only PRs and root-config PRs were all unmergeable for that reason,
# passing only when an admin bypassed required checks.
#
# So the workflow always runs, and decides *inside* the job what is worth typechecking.
# A PR that touches none of the typecheckable areas reports success with no work done —
# that is the correct signal, not a skipped check.
#
# Both typecheckable areas are dispatched from here so there is exactly one `typecheck`
# context. Two workflows defining a job with the same name would create two check-runs
# sharing one context name, which branch protection resolves ambiguously.

on:
  pull_request:
    branches: [main]

concurrency:
  group: typecheck-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0  # need the base commit to diff against

      - name: Detect which areas changed
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'

          match() { echo "$changed" | grep -qE "$1"; }

          # The wix-app harness itself is included: a change to extract.mjs or its deps can
          # break the typecheck just as a reference-doc change can.
          if match '^skills/wix-app/|^\.github/wix-app-typecheck/'; then
            echo "wix_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "wix_app=false" >> "$GITHUB_OUTPUT"
          fi

          if match '^packages/evalforge-core/|^\.github/actions/evalforge-(yaml|skill)-gate/'; then
            echo "evalforge=true" >> "$GITHUB_OUTPUT"
          else
            echo "evalforge=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        if: ${{ steps.changes.outputs.wix_app == 'true' || steps.changes.outputs.evalforge == 'true' }}
        with:
          node-version: '24'

      # ── wix-app: typecheck the TypeScript embedded in the reference docs ────────────
      # Absorbed from the former wix-app-typecheck.yml, which owned the `typecheck`
      # context but only fired on `skills/wix-app/**`.

      - name: Cache wix-app typecheck node_modules
        if: ${{ steps.changes.outputs.wix_app == 'true' }}
        id: cache-deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: .github/wix-app-typecheck/node_modules
          key: ${{ runner.os }}-node-modules-wix-app-typecheck-${{ hashFiles('.github/wix-app-typecheck/package-lock.json') }}

      - name: wix-app — install dependencies
        if: ${{ steps.changes.outputs.wix_app == 'true' && steps.cache-deps.outputs.cache-hit != 'true' }}
        working-directory: .github/wix-app-typecheck
        run: npm install --legacy-peer-deps

      - name: wix-app — typecheck reference docs
        if: ${{ steps.changes.outputs.wix_app == 'true' }}
        working-directory: .github/wix-app-typecheck
        run: node extract.mjs

      # ── evalforge: typecheck the shared package and both actions ────────────────────
      # `working-directory` rather than `yarn --cwd`: each package vendors yarn 4.10.0 via
      # .yarn/releases + yarnPath, and Corepack resolves the yarn *version* from the real
      # process cwd — the same reason CONTRIBUTING.md requires `(cd DIR && yarn ...)`.
      #
      # Building evalforge-core is setup, not a second check: both actions consume it via
      # `portal:` and its `main`/`types` point at `dist/`, so its declarations must exist
      # before they can be typechecked. `tsc` emitting is itself a typecheck of the package.

      - name: evalforge-core — install and build
        if: ${{ steps.changes.outputs.evalforge == 'true' }}
        working-directory: packages/evalforge-core
        run: |
          yarn install --immutable
          yarn build

      - name: evalforge-yaml-gate — typecheck
        if: ${{ steps.changes.outputs.evalforge == 'true' }}
        working-directory: .github/actions/evalforge-yaml-gate
        run: |
          yarn install --immutable
          yarn typecheck

      - name: evalforge-skill-gate — typecheck
        if: ${{ steps.changes.outputs.evalforge == 'true' }}
        working-directory: .github/actions/evalforge-skill-gate
        run: |
          yarn install --immutable
          yarn typecheck

      - name: Summary
        run: |
          echo "wix-app:   ${{ steps.changes.outputs.wix_app }}"
          echo "evalforge: ${{ steps.changes.outputs.evalforge }}"
          if [ "${{ steps.changes.outputs.wix_app }}" = "false" ] \
          && [ "${{ steps.changes.outputs.evalforge }}" = "false" ]; then
            echo "No typecheckable areas changed — nothing to do."
          fi
