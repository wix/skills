name: EvalForge PR Sweep

# Runs the merge-tag sweep against an open PR on request, so a regression in another area can be
# found before merge rather than after. `evalforge-merge-tag-sweep.yml` runs the same sweep on every
# push to `main`; this one runs it against the PR's own MCP version and reports in a PR comment
# instead of Slack.
#
# Manual, like the skill review: a push does not spend. Every head commit gets a run that only
# records whether the commit is unswept, and `/sweep` re-runs that run via the COMMANDS map in
# evalforge-re-eval.yml. It has to be shaped this way because a required status check must be
# reported on the PR head, and only a PR-triggered run is — a comment-triggered run is attached to
# the default branch commit.
#
# Three repo variables, all off by default and independent: PR_SWEEP_REQUIRED makes an unswept
# commit red, PR_SWEEP_BLOCK_MERGE makes a sweep that found a regression red, and PR_SWEEP_REMIND
# posts a "not swept" comment explaining `/sweep`. With all three off, nothing is posted on a PR
# until someone comments `/sweep`.
#
# The `evalforge-` prefix is load-bearing: ci.yml's detect step matches it to decide whether to run
# the tests covering this wiring.

# pull_request_target, not pull_request: this job holds secrets, and under pull_request the
# workflow file and the action both come from the PR, so any branch could rewrite them. Here
# both come from main. The PR is checked out as data only: nothing from it is executed.
on:
  pull_request_target:
    branches: [main]
    # No `paths:` filter, for the reason ci.yml gives at length: a required check whose workflow is
    # path-scoped is never reported on PRs outside those paths, and GitHub leaves it "Expected —
    # waiting for status to be reported" forever. The action decides scope from the diff, and a PR
    # that touches nothing eval-relevant resolves to "nothing to run" and passes.
    #
    # `synchronize` is here even though a push must not spend: the check has to be reported on every
    # head commit, and `/sweep` re-runs the run for the current head, so there has to be one.
    types: [opened, synchronize, reopened, ready_for_review]

# Only the newest head's verdict matters, so supersede in-flight runs. A cancelled sweep leaves its
# EvalForge run executing server-side; the PR's MCP version is swept by the cleanup job on close.
concurrency:
  group: evalforge-pr-sweep-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-sweep:
    # The job name *is* the required-status-check name.
    name: pr-sweep
    runs-on: ubuntu-latest
    # The EvalForge secrets live in this environment, which only `main` may use, so a workflow
    # pushed on another branch cannot read them.
    environment: evalforge
    # Three sequential eval runs are possible (initial + two retries) and each may poll for up
    # to 30 minutes, so a 60-minute budget could kill the job mid-retry.
    timeout-minutes: 105
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    # Kill switch first: set PR_SWEEP_ENABLED to 'false' to stop the sweep without a code change.
    # A skipped job satisfies a required check, so turning it off never blocks a merge.
    if: >-
      ${{ vars.PR_SWEEP_ENABLED != 'false'
          && !github.event.pull_request.draft
          && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The PR merge ref, `refs/pull/N/merge`, read as data only. Its first parent is the base, so
      # `HEAD^1 HEAD` is this PR's diff. fetch-depth: 0 because `HEAD^1` is not in a depth-1 clone.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      # pull_request_target can start before GitHub rebuilds refs/pull/N/merge for this push. Wait
      # until the merge commit's second parent is this head, so the gate never evaluates the
      # previous push's tree. The rebuild usually takes seconds but can take minutes, so the waits
      # back off to about three minutes in all. On giving up, the PR's `mergeable` tells a conflict,
      # which needs a push, from a slow rebuild, which needs a re-run.
      - name: Wait for the merge ref to include this head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # An `if`, not `[ ] && echo`: under the runner's `bash -e` a false test in a command
          # substitution fails the assignment, and a full-history checkout would exit here.
          depth=$(if [ -f .git/shallow ]; then echo --depth=1; fi)
          for wait in 0 5 10 15 20 30 30 30 40; do
            if [ "$wait" -gt 0 ]; then
              echo "Merge ref is at head ${merged_head:-none}, waiting ${wait}s for $HEAD_SHA"
              sleep "$wait"
              git fetch --no-tags $depth origin "+refs/pull/$PR_NUMBER/merge:refs/remotes/pull/merge" \
                && git checkout -q --detach refs/remotes/pull/merge
            fi
            merged_head=$(git cat-file -p HEAD | awk '/^parent /{print $2}' | sed -n 2p)
            [ "$merged_head" = "$HEAD_SHA" ] && exit 0
          done
          mergeable=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .mergeable || echo unknown)
          if [ "$mergeable" = false ]; then
            echo "::error::This PR has conflicts with main, so GitHub cannot build refs/pull/$PR_NUMBER/merge. Resolve them and push."
          else
            echo "::error::GitHub has not rebuilt refs/pull/$PR_NUMBER/merge for $HEAD_SHA after about three minutes. Re-run this job."
          fi
          exit 1

      # The action source, from main's head (github.sha, the commit this workflow file came from),
      # so the workflow and the action always match.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ github.sha }}
          path: .action-src
          persist-credentials: false

      - name: Diff the PR against its base
        id: diff
        run: |
          {
            echo 'files<<EOF'
            git -c core.quotePath=false diff --name-status HEAD^1 HEAD
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: ./.action-src/.github/actions/evalforge-yaml-gate
        id: sweep
        with:
          mode: pr-sweep
          github-token: ${{ secrets.GITHUB_TOKEN }}
          evalforge-url: ${{ vars.EVALFORGE_URL }}
          evalforge-project-id: ${{ vars.AUTO_SKILLS_PIPELINE_PROJECT_ID }}
          evalforge-agent-id: ${{ vars.AUTO_SKILLS_PIPELINE_AGENT_ID }}
          evalforge-mcp-id: ${{ vars.AUTO_SKILLS_PIPELINE_MCP_ID }}
          evalforge-app-id: ${{ secrets.AUTO_SKILLS_PIPELINE_APP_ID }}
          evalforge-app-secret: ${{ secrets.AUTO_SKILLS_PIPELINE_APP_SECRET }}
          changed-files: ${{ steps.diff.outputs.files }}
          required: ${{ vars.PR_SWEEP_REQUIRED || 'false' }}
          blocking: ${{ vars.PR_SWEEP_BLOCK_MERGE || 'false' }}
          remind: ${{ vars.PR_SWEEP_REMIND || 'false' }}
