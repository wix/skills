name: Release - Bump Version and Open PR

# Two ways in:
#
#   * `workflow_dispatch` — a human picks the strategy (minor for a new skill, major for a
#     breaking rewrite; see README "Versioning").
#   * `push` to main touching shipped skill content — an automatic *patch* bump, so a merged
#     skill change never sits unreleased. Every distribution channel except
#     www.wix.com/skills (npm, and the Claude Code / Codex / Cursor / Gemini plugins) is keyed
#     by the version string in package.json and the plugin manifests: Claude Code in particular
#     caches a plugin under its `version` and keeps users on that copy until the string changes,
#     however many commits land on main. Before this trigger, batches of 25–30 merges shipped
#     under one version because the bump was a manual step someone had to remember.
#
# The push trigger is path-scoped to what ships (`skills/**`, the Claude plugin's `.mcp.json`).
# The release commit itself only touches package.json and the manifests, so it does not
# re-trigger; the `gate` job guards against that anyway, and against piling up: while a release
# PR is still open, a new push is a no-op — that PR squash-merges onto main *after* the push,
# and `release.yml` publishes main as of the merge, so the pending release already carries it.

on:
  workflow_dispatch:
    inputs:
      version_strategy:
        type: choice
        description: Version strategy
        options:
          - patch
          - minor
          - major
          - prerelease
          - premajor
          - preminor
          - prepatch
      dry_run:
        description: 'Dry run (preview only, no branch/commit/PR)'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.mcp.json'

# Serialize bumps: two pushes in quick succession must not both compute the same next version.
concurrency:
  group: release-bump
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    # Belt and braces with the `paths` filter: never bump on the release commit itself.
    if: >
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore: release @wix/agent-skills')
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - name: Decide whether a bump is needed
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Manual dispatch — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OPEN=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --label release --state open --json number --jq 'length')
          if [ "$OPEN" != "0" ]; then
            echo "A release PR is already open; it will carry this push when it merges. Skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "No open release PR — proceeding with an automatic patch bump."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  bump:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    env:
      # Push events carry no inputs: default to a patch bump, never a dry run.
      STRATEGY: ${{ github.event.inputs.version_strategy || 'patch' }}
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}

    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Dry-run preview
        if: env.DRY_RUN == 'true'
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "Would bump @wix/agent-skills from $CURRENT using strategy: $STRATEGY"
          echo "All plugin manifests (.claude-plugin, .codex-plugin, .cursor-plugin, plugin.json, gemini-extension.json) would be synced to the new version."

      - name: Bump version
        if: env.DRY_RUN != 'true'
        id: bump
        run: |
          npm version "$STRATEGY" --no-git-tag-version
          NEW_VERSION="v$(node -p "require('./package.json').version")"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "branch=release/${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create release branch and commit
        if: env.DRY_RUN != 'true'
        run: |
          git checkout -b ${{ steps.bump.outputs.branch }}
          git add package.json
          git commit -m "chore: release @wix/agent-skills ${{ steps.bump.outputs.version }}"
          git push -u origin ${{ steps.bump.outputs.branch }}

      - name: Ensure release label exists
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create release \
            --color "0E8A16" \
            --description "Merging publishes to npm" \
            --force

      - name: Open release PR
        if: env.DRY_RUN != 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          TRIGGER_SHA: ${{ github.sha }}
          TRIGGER_TITLE: ${{ github.event.head_commit.message }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TRIGGER_LINE="Automatic patch bump: skill content changed on \`main\` in ${TRIGGER_SHA:0:7} (${TRIGGER_TITLE%%$'\n'*})."
          else
            TRIGGER_LINE="Opened by a manual \`release-bump\` dispatch (strategy: \`${STRATEGY}\`)."
          fi
          BODY=$(cat <<EOF
          Automated release PR for **${VERSION}**.

          ${TRIGGER_LINE}

          When required checks pass, this PR auto-merges and \`release.yml\` publishes to npm via Trusted Publishing and pushes the \`${VERSION}\` tag.
          EOF
          )
          PR_URL=$(gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "chore: release @wix/agent-skills ${VERSION}" \
            --body "${BODY}" \
            --label release)
          echo "url=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Mint App token (used for approval + auto-merge so events propagate)
        if: env.DRY_RUN != 'true'
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Approve the PR (App identity ≠ PR author)
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: gh pr review --approve "${PR_URL}" --body "Automated approval for release PR."

      - name: Enable auto-merge
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: gh pr merge --auto --squash "${PR_URL}"
