name: Sync Codex Skills

# Not path-filtered: main requires branches to be up to date, so an open sync PR is rebuilt
# from every new main or auto-merge would wait on it forever.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-codex-skills
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: codegen
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '24'

      - name: Test the sync script
        run: node --test .github/scripts/sync-codex-skills.test.mjs

      - name: Sync codex-skills from skills
        run: ./.github/scripts/sync-codex-skills.sh

      - name: Check for changes
        id: sync
        run: |
          if [ -z "$(git status --porcelain -- codex-skills)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Close a sync PR that main already covers
        if: steps.sync.outputs.has_changes == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --head sync/codex-skills --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr close "$pr" --delete-branch --comment "main already matches skills/."
          fi

      - name: Open or update the sync PR
        if: steps.sync.outputs.has_changes == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B sync/codex-skills
          git add codex-skills/
          git commit -m "chore: sync codex-skills from skills"
          git push -f origin sync/codex-skills
          url=$(gh pr list --head sync/codex-skills --state open --json url --jq '.[0].url')
          if [ -z "$url" ]; then
            url=$(gh pr create \
              --base main \
              --head sync/codex-skills \
              --title "chore: sync codex-skills from skills" \
              --body "Automated sync of \`codex-skills/\` from \`skills/\` by \`.github/scripts/sync-codex-skills.sh\`. Merges itself once required checks pass.")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The approval must come from an identity other than the PR author, and is re-given
      # after every force-push because pushes dismiss earlier approvals.
      - name: Mint App token
        if: steps.sync.outputs.has_changes == 'true'
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3  # v3.1.1
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Approve and enable auto-merge
        if: steps.sync.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh pr review --approve "$PR_URL" --body "Automated approval for codex-skills sync."
          gh pr merge --auto --squash "$PR_URL"
