name: Sync Codex Skills

# Not path-filtered: main requires branches to be up to date, so an open sync PR is replaced
# by one from every new main or auto-merge would wait on it forever.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-codex-skills
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: codegen
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '24'

      - name: Test the sync script
        run: node --test .github/scripts/sync-codex-skills.test.mjs

      - name: Sync codex-skills from skills
        run: ./.github/scripts/sync-codex-skills.sh

      - name: Check for changes
        id: sync
        run: |
          if [ -z "$(git status --porcelain -- codex-skills)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Close sync PRs that main already covers
        if: steps.sync.outputs.has_changes == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pr in $(gh pr list --state open --limit 100 --json number,headRefName \
              --jq '.[] | select(.headRefName | startswith("bot/codex-skills-sync-")) | .number'); do
            gh pr close "$pr" --comment "main already matches skills/."
          done

      # A fresh branch per main commit, like release-bump.yml: rulesets forbid sync/**
      # branches, force-pushes and branch deletion.
      - name: Open the sync PR
        if: steps.sync.outputs.has_changes == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="bot/codex-skills-sync-${GITHUB_SHA::8}"
          if ! git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$branch"
            git add codex-skills/
            git commit -m "chore: sync codex-skills from skills"
            git push origin "$branch"
          fi
          url=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')
          if [ -z "$url" ]; then
            url=$(gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: sync codex-skills from skills" \
              --body "Automated sync of \`codex-skills/\` from \`skills/\` by \`.github/scripts/sync-codex-skills.sh\`. Merges itself once required checks pass.")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          for pr in $(gh pr list --state open --limit 100 --json number,headRefName \
              --jq ".[] | select(.headRefName | startswith(\"bot/codex-skills-sync-\")) | select(.headRefName != \"$branch\") | .number"); do
            gh pr close "$pr" --comment "Superseded by $url."
          done

      # The approval must come from an identity other than the PR author.
      - name: Mint App token
        if: steps.sync.outputs.has_changes == 'true'
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3  # v3.1.1
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Approve and enable auto-merge
        if: steps.sync.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh pr review --approve "$PR_URL" --body "Automated approval for codex-skills sync."
          gh pr merge --auto --squash "$PR_URL"
