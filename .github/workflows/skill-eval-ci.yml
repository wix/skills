name: Skill Eval CI

on:
  pull_request:
    paths:
      - '.github/actions/skill-eval/**'
      # This action's committed bundle inlines evalforge-core, so a core-only change makes
      # it stale. ci.yml's staleness check covers only the two evalforge-* gates, so without
      # this path the bundle would drift with nothing reporting it.
      - 'packages/evalforge-core/**'

permissions:
  contents: read

jobs:
  ci:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/actions/skill-eval
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '24'
      # Setup, not a second check: skill-eval consumes evalforge-core via `portal:` and
      # core's `main`/`types` point at `dist/`, which is not committed — so its declarations
      # have to be built before this action can be typechecked or bundled. Mirrors the
      # `evalforge-core — install and build` step in ci.yml.
      - name: evalforge-core — install and build
        working-directory: packages/evalforge-core
        run: |
          node .yarn/releases/yarn-*.cjs install --immutable
          node .yarn/releases/yarn-*.cjs build
      - run: node .yarn/releases/yarn-*.cjs install --immutable
      - run: node .yarn/releases/yarn-*.cjs typecheck
      - run: node .yarn/releases/yarn-*.cjs test
      - name: Check dist is up to date
        run: |
          node .yarn/releases/yarn-*.cjs build
          git diff --exit-code dist/index.js
