name: Publish @wix/agent-skills to npm

# Runs on every push to main that touches package.json (the mirror sync of a release bump lands as
# such a push) and publishes when the version it names is not on npm yet. A push run's OIDC token
# carries ref refs/heads/main, which npm trusted publishing accepts; the pull_request_target runs
# used before were refused with a PUT 404 (2026-10-07, 2026-10-25) and needed a manual dispatch.
on:
  push:
    branches: [main]
    paths: [package.json]
  # Manual fallback: publishes whatever version main's package.json names, if not published yet.
  workflow_dispatch:

permissions:
  id-token: write # REQUIRED for npm Trusted Publishing
  contents: write # to push the release tag

concurrency:
  group: publish-agent-skills
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node with trusted publishing
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Resolve version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          if npm view "@wix/agent-skills@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> $GITHUB_OUTPUT
            echo "@wix/agent-skills@${VERSION} is already on npm; nothing to publish."
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm (trusted publishing)
        if: steps.version.outputs.published == 'false'
        run: npm publish --provenance --access=public

      - name: Tag the release commit
        if: steps.version.outputs.published == 'false'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists; nothing to do."
            exit 0
          fi
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
