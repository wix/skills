name: Publish @wix/agent-skills to npm

# Runs on the push that lands a release commit on main, so it always runs main's copy of this file
# with main's secrets, and the OIDC token it mints is one npm trusted publishing accepts: a push on
# refs/heads/main. (pull_request_target also ran main's copy, but npm refused the token that event
# produces — v1.30.0's merge-triggered publish failed with PUT 404 on 2026-10-07; pull_request ran the
# PR's own copy of the file on an unmerged close.) The release-bump workflow's PR merges as a squash
# whose message is its title, "chore: release @wix/agent-skills vX.Y.Z"; that message is the guard.
on:
  push:
    branches: [main]
  # Manual fallback: publishes whatever version main's package.json names.
  workflow_dispatch:

permissions:
  id-token: write # REQUIRED for npm Trusted Publishing
  contents: write # to push the release tag

jobs:
  publish:
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'chore: release @wix/agent-skills v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main (post-merge)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node with trusted publishing
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Resolve version
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Publish to npm (trusted publishing)
        run: npm publish --provenance --access=public

      - name: Tag the release commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists; nothing to do."
            exit 0
          fi
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
