name: 'EvalForge Skill Gate'
description: 'EvalForge flows for file-based skills: per-PR eval gate, PR-close cleanup, and merge-time scenario sync'
inputs:
  mode:
    description: 'Action mode: "gate" (per-PR eval run), "cleanup" (PR close), or "sync" (merge-time reconcile, the default)'
    required: false
    default: 'sync'
  evaluated-sha:
    description: 'Commit the skill version is labelled for, normally `git rev-parse HEAD` after checkout. Falls back to GITHUB_SHA, which is the original merge commit on a re-run and so can be stale (gate mode)'
    required: false
  github-token:
    description: 'GitHub token — resolves the PR author for the Wix-author gate, reads the changed-file list, and upserts the PR comment'
    required: true
  evalforge-url:
    description: 'EvalForge API base URL'
    required: true
  evalforge-project-id:
    description: 'EvalForge project ID'
    required: true
  evalforge-app-id:
    description: 'Wix app def ID (OAuth client_id)'
    required: true
  evalforge-app-secret:
    description: 'Wix app secret (OAuth client_secret)'
    required: true
  evals-glob:
    description: 'Glob for scenario YAML files, relative to the workspace root'
    required: true
  capability-id:
    description: 'EvalForge capability ID the PR skill version is created under (gate and cleanup modes)'
    required: false
  agent-id:
    description: 'EvalForge preset agent ID the eval run uses (gate mode)'
    required: false
  skill-dir:
    description: 'Repo-relative skill root whose files become the PR capability version, e.g. skills/wix-app (gate mode)'
    required: false
  reference-dir:
    description: 'Reference directory relative to skill-dir. Each file there derives a tag from its name: DASHBOARD_PAGE.md -> dashboard-page'
    required: false
    default: 'references'
  ignore-globs:
    description: 'Newline-separated globs, relative to skill-dir, whose changes trigger nothing at all'
    required: false
    default: |
      scripts/**
  broad-impact-globs:
    description: 'Newline-separated globs, relative to skill-dir, whose changes put the whole suite in play. These derive no tag of their own and are never coverage-checked'
    required: false
    default: |
      SKILL.md
      references/APP_IDENTIFIERS.md
      references/APP_MARKET_REVIEW.md
      references/APP_VALIDATION.md
      references/CODE_QUALITY.md
      references/DOCUMENTATION.md
      references/EXTENSION_REGISTRATION.md
  max-scenarios:
    description: 'Cap on scenarios per gate run. Scenarios the PR touched are kept first; anything cut is named in the PR comment'
    required: false
    default: '25'
  blocking:
    description: 'When "true" a gate failure fails the check. Anything else warns and passes — the soak setting'
    required: false
    default: 'false'
  runs-per-scenario:
    description: >-
      How many times each scenario runs in each arm (max 20). Above 1, an intermittent failure
      is visible rather than indistinguishable from a regression — at proportional cost.
    required: false
    default: '1'
  base-arm-grace-seconds:
    description: >-
      Seconds the base comparison arm gets after the PR arm completes before its poll is
      cancelled (max 300; 0 means don't wait for the base arm at all). Exceeding it degrades the
      PR comment to "attribution unavailable" without affecting the verdict — the base eval run
      itself still completes server-side.
    required: false
    default: '60'
runs:
  using: 'node20'
  main: 'dist/index.js'
