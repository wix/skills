yarnPath: .yarn/releases/yarn-4.17.1.cjs
nodeLinker: node-modules

# No dep here needs a build step — this tree exists only to run `tsc --noEmit` over the
# TypeScript embedded in skills/wix-app reference docs. Three of its packages ship
# install scripts, so this is worth being explicit about.
enableScripts: false

# 7-day dependency cooldown, in minutes. Why this exists, the two ways it can silently
# end up doing nothing, and how to regenerate a lockfile without defeating it:
# docs/skill-evaluation.md#regenerating-lockfiles
npmMinimalAgeGate: 10080
