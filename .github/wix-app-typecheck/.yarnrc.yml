yarnPath: .yarn/releases/yarn-4.12.0.cjs
nodeLinker: node-modules

# 7 days here, where the wix-private house standard is 14d (see the four evalforge
# projects). This tree exists to typecheck the TypeScript embedded in skills/wix-app
# reference docs against live Wix SDK types, which puts it in a narrow window:
#
#   14d  -> @wix/react-component-utils predates `useReducedMotion`, which a doc uses
#   0d   -> @wix/data jumps to 1.0.504 (1 day old) which drops the `items` export
#
# 7d satisfies both. Widening this means a doc referencing a <14d-old Wix API fails
# CI, so if you raise it, expect to pin the affected @wix/* dep instead.
#
# Why the gate exists at all, and how to regenerate this lockfile without defeating
# it: docs/skill-evaluation.md#regenerating-lockfiles
npmMinimalAgeGate: "7d"
