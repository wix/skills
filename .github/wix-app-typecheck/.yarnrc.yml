yarnPath: .yarn/releases/yarn-4.12.0.cjs
nodeLinker: node-modules

# Lower from Yarn's default (a much higher number) to work around a Yarn 4.12.0 / Node 24
# HTTP/2 session crash ("onCancel handler was attached after the promise settled") that
# reproduced twice in CI when fetching a large, uncached dependency set at high concurrency.
networkConcurrency: 8

# wix-private house standard: a 14-day cooldown on third-party packages, @wix/* exempt.
# Do not bump past 4.12.0 without checking this line survives — 4.15+ rewrites this file
# and writes `npmMinimalAgeGate: 0` into it, which disables the cooldown silently.
npmMinimalAgeGate: "14d"
npmPreapprovedPackages:
  - "@wix/*"
