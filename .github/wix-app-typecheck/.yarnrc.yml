yarnPath: .yarn/releases/yarn-4.17.1.cjs
nodeLinker: node-modules

# Install scripts stay off — nothing in this repo needs one. esbuild ships its binary as
# an @esbuild/<platform> package rather than a postinstall download, and the only other
# packages that declare scripts (core-js, sinon) don't need them to run. Yarn 4.15+
# already defaults this to false; it is explicit so the default cannot drift back.
enableScripts: false

# 7-day dependency cooldown, in minutes. Why this exists, the two ways it can silently
# end up doing nothing, and how to regenerate a lockfile without defeating it:
# docs/skill-evaluation.md#regenerating-lockfiles
npmMinimalAgeGate: 10080
