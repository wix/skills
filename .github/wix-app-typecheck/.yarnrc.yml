yarnPath: .yarn/releases/yarn-4.12.0.cjs
nodeLinker: node-modules

# wix-private house standard: a 14-day cooldown on third-party packages, with @wix/*
# exempt so first-party types stay current. Why this exists, and how to regenerate a
# lockfile: docs/skill-evaluation.md#regenerating-lockfiles
npmMinimalAgeGate: "14d"
npmPreapprovedPackages:
  - "@wix/*"
