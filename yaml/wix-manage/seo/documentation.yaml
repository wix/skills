apiDoc:
  title: Wix SEO Management Recipes

  docs:
    - file: ../../../skills/wix-manage/references/seo/manage-url-redirects.md
      title: Manage URL Redirects on a Wix Site
      description: "Retrieve, create, and delete URL redirects on a Wix site using the public SEO Redirects API. Covers exact and group redirects, language-scoped redirects for multilingual sites, batches of up to 500, and the change flow for a redirect that already exists. This API has no query, search, or update method: List Redirects is the only read-many. Redirects do not chain, so creating one that points at a path another redirect starts from permanently deletes that other redirect; list and check before every write."
      docsEntry: https://dev.wix.com/docs/api-reference/business-management/seo/redirects
      tags: [seo]
    - file: ../../../skills/wix-manage/references/seo/manage-seo-tags.md
      title: Manage a Wix Site's SEO Tags
      description: "Read and update SEO titles and tags at the right level. For \"change my site's SEO title\", clarify homepage, specific page, or page-type pattern before discovery or writes; site-level tags accept meta tags only, never titles. Discover item IDs and pattern variables, read before every full-replace write, and report resolved tags with their sources."
      docsEntry: https://dev.wix.com/docs/api-reference/business-management/seo
      tags: [seo]
    - file: ../../../skills/wix-manage/references/seo/manage-content-plan.md
      title: Generate and Read a Wix Site's Content Plan
      description: "Generate an SEO content plan and read its blog post topics, or troubleshoot an existing content plan flow stuck at KEYWORD_RESEARCH while polling GetContentPlanFlow. Use this recipe for both generation and stalled-flow questions: it explains the intentional pause, the Create Content Plan release request, missing flow IDs, and the exact public API paths and response fields."
      docsEntry: https://dev.wix.com/docs/api-reference/business-management/seo
      tags: [seo, content-plan]
    - file: ../../../skills/wix-manage/references/seo/manage-google-search-console.md
      title: Manage Google Search Console for a Wix Site
      description: "Connect a Wix site to Google Search Console and drive its setup through the public GSC Connection and Site Readiness APIs: check connection and readiness, start the Google authorization, verify ownership, add the property, submit the sitemap, request indexing, read search performance, run URL inspection, recover a stale connection, or disconnect. The site owner authorizes in their own browser via a single-use connect URL."
      docsEntry: https://dev.wix.com/docs/api-reference/business-management/seo/google-search-console
      tags: [seo]
    - file: ../../../skills/wix-manage/references/seo/manage-seo-suggestions.md
      title: Generate AI SEO Suggestions for a Wix Site
      description: "Generate AI-written SEO text for a Wix site through the public Tag Suggestions and Page Optimization APIs: title tag and meta description options for a page, alt text for the images of a page, store product, or blog post (one image or up to 20 per call), corrected heading levels for a page's headings, and a whole-page rewrite of title, description, headings, and body text aimed at the page's focus keyword, returned as before/after pairs. Use it when the user wants to improve, optimize, audit, or write the SEO text of a page or the homepage. Suggestions are returned for review; applying one is a separate SEO tags write."
      docsEntry: https://dev.wix.com/docs/api-reference/business-management/seo
      tags: [seo]
