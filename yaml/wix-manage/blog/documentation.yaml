apiDoc:
  title: Wix Blog Management Recipes

  docs:
    - file: ../../../skills/wix-manage/references/blog/how-to-create-blog-posts.md
      title: How to Create Blog Posts
      description: "Creates and publishes blog posts using Blog Posts API. Covers resolving the required author memberId (including creating an author member when the site has none), Ricos rich content format, image upload via Media Manager, category/tag assignment, and bulk post creation."
      docsEntry: https://dev.wix.com/docs/api-reference/business-solutions/blog
      tags: [blog]

    - file: ../../../skills/wix-manage/references/blog/blog-dashboard-navigation.md
      title: Blog Dashboard Navigation
      description: "Builds direct links to Wix Blog dashboard pages on manage.wix.com — posts list (published and draft tabs), categories, tags, writers, comment moderation, blog analytics, monetization, and settings. Pairs each main Blog entity with its read API so you can fetch an entity and hand back a 'view it in your dashboard' link. Use when the user asks where something is in the Wix dashboard, wants a direct link to a dashboard page, or you need a dashboard URL to include with the result of an API operation."
      docsEntry: https://dev.wix.com/docs/api-reference/business-solutions/blog
      tags: [blog]
