apiDoc:
  title: Wix Stores Management Recipes

  docs:
    - file: ../../../skills/wix-manage/references/stores/change-store-currency.md
      title: Change Store Currency
      description: "Changes the store's payment currency through Site Properties and explains delayed currency updates in catalog responses."
      docsEntry: https://dev.wix.com/docs/api-reference/business-solutions/stores
      tags: [stores]
    - file: ../../../skills/wix-manage/references/stores/find-products-query-and-search-catalog-v3.md
      title: Find Products (Query and Search, Catalog V3)
      description: "Find, search, query, and list products from a Wix Store using Catalog V3 Search Products and Query Products endpoints. Explains when to use each endpoint, correct fields enum values, filtering (including by price), sorting, and paging."
      docsEntry: https://dev.wix.com/docs/api-reference/business-solutions/stores
      tags: [stores]
    - file: ../../../skills/wix-manage/references/stores/query-products-catalog-v1.md
      title: Query Products (Catalog V1)
      description: "Query and list products from a Wix Store using the Catalog V1 Query Products endpoint. Use this recipe when the site's catalog version is CATALOG_V1. Covers basic queries, filtering, sorting, and paging."
      docsEntry: https://dev.wix.com/docs/api-reference/business-solutions/stores
      tags: [stores]
    - file: ../../../skills/wix-manage/references/stores/create-product-catalog-v3.md
      title: Create Product (Catalog V3)
      description: "Mandatory first recipe for every Wix Stores Catalog V3 create-product request. Before any mutation, require an explicit name and price for every product; an absent price is never 0. If no product is identified, offer both image-upload and text-description paths and stop. If name or price is missing, ask or offer a suggestion and stop. When both are present, create from the supplied details without requiring optional enrichment. Covers single/bulk creation, inventory, physical/digital products, images, options, variants, SKUs, and validation."
      docsEntry: https://dev.wix.com/docs/api-reference/business-solutions/stores
      tags: [stores]
    - file: ../../../skills/wix-manage/references/stores/create-product-catalog-v1.md
      title: Create Product (Catalog V1)
      description: "Create products using the Catalog V1 Products API. Use this recipe when the site's catalog version is CATALOG_V1. Covers simple product creation, product with options, and key V1 request structure differences from V3."
      docsEntry: https://dev.wix.com/docs/api-reference/business-solutions/stores
      tags: [stores]
    - file: ../../../skills/wix-manage/references/stores/update-product-with-options.md
      title: Update Product with Options (Catalog V3)
      description: "Modifies existing products and variants using Catalog V3 Products API. Covers adding/removing option choices, variant-specific pricing, product visibility (hide, unhide, or show a product in the storefront — a product-level `visible` update, never a delete), and revision-based updates to prevent conflicts."
      docsEntry: https://dev.wix.com/docs/api-reference/business-solutions/stores
      tags: [stores]
    - file: ../../../skills/wix-manage/references/stores/update-product-pre-order.md
      title: Update Product Pre-Order (Catalog V3)
      description: "Manages pre-order settings for product variants using V3 Inventory API. Covers enabling/disabling pre-orders, setting messages, configuring limits, and handling trackQuantity requirements."
      docsEntry: https://dev.wix.com/docs/api-reference/business-solutions/stores
      tags: [stores]
    - file: ../../../skills/wix-manage/references/stores/add-store-pages-to-site.md
      title: Add Store Pages to Site
      description: "Adds missing checkout and cart pages to a site when Stores app is installed. Used when store pages are missing after migration or setup issues."
      docsEntry: https://dev.wix.com/docs/api-reference/business-solutions/stores
      tags: [stores]
    - file: ../../../skills/wix-manage/references/stores/stores-dashboard-navigation.md
      title: Stores Dashboard Navigation
      description: "Builds direct links to Wix Stores and eCommerce dashboard pages on manage.wix.com — products list, edit a specific product, categories, inventory, orders list, a specific order, abandoned checkouts, gift cards, shipping and tax settings. Pairs each main Stores/eCommerce entity with its read API so you can fetch an entity and hand back a 'view it in your dashboard' link. Use when the user asks where something is in the Wix dashboard, wants a direct link to a dashboard page, or you need a dashboard URL to include with the result of an API operation."
      docsEntry: https://dev.wix.com/docs/api-reference/business-solutions/stores
      tags: [stores]
