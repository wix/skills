apiDoc:
  title: Wix Events Management Recipes

  docs:
    - file: ../../../skills/wix-manage/references/events/create-wix-event.md
      title: Create Event
      description: "Creates an event with the Wix Events V3 API — the required request body, ISO-8601 date and time settings, venue/online/TBD location, RSVP vs ticketed registration, guest capacity, short vs rich-text descriptions, ticket tiers and pricing, and recurring series. Covers the exact field shapes and the API's misleading validation messages. Use when the user wants to create an event, set its date, location, description, guest limit or ticket prices, or set up a repeating event."
      docsEntry: https://dev.wix.com/docs/api-reference/business-solutions/events
      tags: [events]
    - file: ../../../skills/wix-manage/references/events/manage-wix-events.md
      title: Manage Events
      description: "Operates on events that already exist with the Wix Events V3 API — finding an event by title, publishing a draft, cancelling, deleting (one or by filter), cloning, updating an event's date or details, and counting events. Use when the user wants to find, publish or cancel an event, duplicate one, move an event's date, delete events in bulk, or count their events. Creating an event, its tickets or a recurring series is a separate recipe."
      docsEntry: https://dev.wix.com/docs/api-reference/business-solutions/events
      tags: [events]
