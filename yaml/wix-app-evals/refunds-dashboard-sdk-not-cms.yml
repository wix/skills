name: refunds-dashboard-sdk-not-cms
description: Dashboard page around site refunds must be built on the Wix eCommerce/Payments SDK — not by creating a CMS data collection for data a Wix app already owns — and, with no read-only request, must decide editability from the documented update API rather than assuming read-only
triggerPrompt: |-
  Build a dashboard page around site refunds. Show all refunded orders in a table with the order number, customer name, refund amount, and refund date.
  APP_NAMESPACE: "@mirivo/my-app31ceim", Use this namespace when creating data collections (for idSuffix scoping).
  CODE_IDENTIFIER: "MirivoMyApp31ceim" When generating editor React component or function library extensions, use this identifier as the type prefix (e.g. type: 'MirivoMyApp31ceim"ComponentName').
templateId: c0ee6fd2-5265-4c57-b083-4f1308ff5ffa
tags: [data-collection, dashboard-page, draft-template, ux-success-model, wix-patterns-docs]
assertions:
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/DASHBOARD_PAGE.md, references/dashboard-page/DRAFT_TEMPLATE.md]
  - type: skill_was_called
    negate: true
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/DATA_COLLECTION.md]
  - type: build_passed
    command: npm run build
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate whether the agent sourced refund data from the Wix platform instead of inventing its own storage. Check: (1) **No CMS data collection was created for refunds or orders** — there is no DATA_COLLECTION extension, no `data-collections` extension file, and no `@wix/data` insert/query calls modeling refunds; creating any refunds/orders collection is an automatic fail (score 0-2). (2) Refund data is fetched through the Wix SDK — `@wix/ecom` (orders / order transactions) and/or `@wix/payments` (refunds) — from backend or dashboard code. (3) The dashboard table is populated from those SDK calls, so a site with refunded orders would show real rows, not an empty state backed by an empty custom collection. Score 0-10.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate the quality of the implementation path. Check: (1) The agent ran the skill's `sdk-lookup.cjs`, consulted the Wix SDK documentation (MCP search tools such as SearchWixSDKDocumentation / ReadFullDocsMethodSchema), or the skill's SDK-First Rule module map before deciding how to access refund data — it did not guess method names or conclude "no SDK exists" with zero lookups. (2) SDK imports are real `@wix/*` packages with plausible method names (e.g. `orders`, `orderTransactions` from `@wix/ecom`, or `refunds` from `@wix/payments`). (3) The dashboard page UI follows the skill's conventions (@wix/patterns collection page for the table, @wix/design-system only for leaf UI). (4) The agent looked up `@wix/patterns` names via `dist/dts-bundle/index.json` and `dist/docs/index.json` (and the specific `.d.ts`/`.md` files those point at) — not by running `ls`, `find`, `cat`, or `grep` against arbitrary paths under `node_modules`. Any such direct `node_modules` exploration is an automatic low score. Running the skill's own scripts (`sdk-lookup.cjs`, `pkg-root.cjs`, `patterns-lookup.cjs`) is not exploration. Score 0-10.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      The user asked for a table of refunded orders without asking for read-only behavior or for editing. Evaluate how the agent decided what opening a row does. Every row must open a routed detail page (not a modal, side panel, or nothing). Two outcomes are acceptable: (a) a read-only detail page, backed by a lookup in the trace showing the refund data has no documented update method (or that the fields shown cannot be updated), with the final response naming that limitation; or (b) an editable EntityPage whose save calls a real, documented update method for the fields it exposes, with refund amount and date kept read-only. A read-only page with no API lookup behind it, a save wired to an invented method, a no-op save, or a save that only changes local state scores at most 4. Do not require create or delete actions. Score 0-10, citing the documentation lookups and generated code rather than the final response alone.
  - type: time_limit
    maxDurationMs: 180000
  - type: cost
    maxCostUsd: 1
