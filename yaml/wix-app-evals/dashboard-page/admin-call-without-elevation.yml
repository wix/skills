name: dashboard-page/admin-call-without-elevation
description: Dashboard page performing the same admin Locations operation as the Editor React component scenario — because a dashboard extension runs as the Wix user, it must call the SDK directly rather than building a backend endpoint or elevating
triggerPrompt: |-
  Build a dashboard page for my app that lists the site's business locations and lets the site owner archive one. Use the Wix Locations API.
  APP_NAMESPACE: "@mirivo/my-app31ceim", Use this namespace when creating data collections (for idSuffix scoping).
  CODE_IDENTIFIER: "MirivoMyApp31ceim" When generating editor React component or function library extensions, use this identifier as the type prefix (e.g. type: 'MirivoMyApp31ceim"ComponentName').
templateId: 33f2cb85-054e-4281-b617-3bc21ac0803f
tags: [dashboard-page, backend-api, wix-patterns-docs]
assertions:
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/DASHBOARD_PAGE.md]
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/WIX_PATTERNS_DOCS.md]
  - type: build_passed
    command: npm run build
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      This is the negative counterpart to the Editor React component Locations scenario. Same two methods — `locations.queryLocations` and `locations.archiveLocation`, both admin-only — but a dashboard extension runs as the **Wix user**, not as a site visitor. A site owner holds the Manage Locations permission, so the page calls the SDK directly. Routing this through a backend endpoint is unnecessary indirection, and `auth.elevate` in dashboard page code does not work at all.

      Check: (1) The dashboard page imports the Locations SDK and calls `queryLocations` and `archiveLocation` directly from page code. (2) There is **no** `auth.elevate` call anywhere in the project. (3) **These two Locations calls are not proxied through any backend extension** — no HTTP endpoint, web method, or other server hop created solely to reach them. If the agent built one, it over-applied the site-extension routing rule to a host that doesn't need it. (4) The list refreshes after an archive, and the default location — which cannot be archived — is handled rather than offered as archivable. The locations list and its row actions come from `@wix/patterns` rather than a hand-written table or a raw WDS assembly, per the Patterns Docs Gate. (5) The agent surfaced adding the Locations scopes in Dev Center as a manual step.

      Judge these two operations only. "Dashboard extension" does not mean "never route" in general — some methods require elevation even from a dashboard, and elevation only works in backend code, so routing is correct for those. An agent that notes the role caveat — that a collaborator without the Manage Locations role would still be refused — should not be penalized for mentioning it, only for acting on it by adding a server hop for these calls. Score 0-10. Score 3 or below if `archiveLocation` or `queryLocations` is proxied, or if `auth.elevate` appears.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate the path the agent took. Check: (1) It identified the host as a dashboard extension and concluded the Wix user identity suffices, rather than reflexively routing every admin-scoped method to a backend endpoint. (2) It did not spend turns reading the Backend API reference or scaffolding an endpoint it then discarded — reading it while deciding is fine, building it is not. (3) It used `npx wix generate` to scaffold the page unless the starter project already contained one. Score 0-10. Cite the specific tool calls behind your score, and for each friction you penalize, name what the docs or references failed to make available up front.
  - type: time_limit
    maxDurationMs: 180000
  - type: cost
    maxCostUsd: 1
