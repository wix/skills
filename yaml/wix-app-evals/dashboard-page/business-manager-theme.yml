name: dashboard-page/business-manager-theme
description: An ordinary dashboard page request that never mentions theming — proves the generated entry file ships the Business Manager (Harmony/odeditor) provider stack, lazy icon imports and --wds-* tokens by default, rather than the pre-redesign WixDesignSystemProvider-only setup that compiles and previews cleanly while looking unmigrated
triggerPrompt: |-
  Build a dashboard page where the site owner can manage the equipment my studio rents out. Each item has a name, a category, a daily rate and a status (available, rented, in repair). The owner needs to see them all in a table, add a new item, and edit an existing one. Show the status as a coloured badge.
  APP_NAMESPACE: "@mirivo/my-app31ceim", Use this namespace when creating data collections (for idSuffix scoping).
  CODE_IDENTIFIER: "MirivoMyApp31ceim" When generating editor React component or function library extensions, use this identifier as the type prefix (e.g. type: 'MirivoMyApp31ceim"ComponentName').
templateId: c0ee6fd2-5265-4c57-b083-4f1308ff5ffa
tags: [dashboard-page, business-manager-theme, business-manager-tokens, dashboard-modal, data-collection, wix-patterns-docs]
assertions:
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/DASHBOARD_PAGE.md]
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/BUSINESS_MANAGER_THEME.md]
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/BUSINESS_MANAGER_TOKENS.md]
  - type: build_passed
    command: npm run build
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate whether the generated dashboard page is wired for the Business Manager (Harmony) theme. The user never asked for theming, so this tests the default output, not instruction-following. Locate wherever the design-system providers are declared — normally a `BusinessManagerTheme.tsx` wrapper component that the entry file (`{feature}.tsx`, or `withProviders.tsx` for a dynamic-parameters page) wraps its content in. The expected shape is a single shared `BusinessManagerTheme` module imported at the extension root; an inline stack duplicated per entry file is what the skill explicitly warns against, so score it no higher than 5 even when its contents are right. Check: (1) BOTH `@wix/design-system/styles.global.css` AND `@wix/design-system/themes/odeditor.global.css` are imported. Only `styles.global.css` fails outright, scoring no higher than 3 — that is precisely the pre-redesign setup that renders the old look while passing every build and preview check. (2) All four providers are present and nested outermost-first in this order: `WixDesignSystemProvider` → `WixDesignSystemIconThemeProvider` → `IconThemeProvider theme="odeditor"` (imported from `@wix/wix-ui-icons-common/core`) → `WixDesignSystemDefaultPropsProvider`. Missing the icon providers, or the defaults provider, scores no higher than 4 — each omission leaves a visibly unmigrated surface. (3) `WixDesignSystemDefaultPropsProvider` receives defaults equivalent to `Button: { size: 'small', skin: 'dark' }`, `IconButton: { size: 'small', skin: 'dark', priority: 'tertiary' }`, `TextButton: { size: 'small', skin: 'standard' }`, `Input: { size: 'small' }`. (4) `WixPatternsProvider` is nested INSIDE `WixDesignSystemDefaultPropsProvider`, not above it — a patterns shell outside the defaults provider gets no defaults for the WDS leaf UI it contains. (5) The providers are declared in one place and applied at the extension root, not re-declared in child, tab or page components. (6) `features={{ newColorsBranding: true }}` does NOT appear anywhere; it predates the theme and is not a substitute for it. Score 0-10.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate whether the page's own styling uses design tokens rather than hardcoded values — the half-migrated failure mode, where a hardcoded value keeps its old appearance while the themed components around it change. Check every file the agent wrote: (1) Every icon is imported from `@wix/wix-ui-icons-common/lazy`, NOT from the package root `@wix/wix-ui-icons-common` and NOT from `/lazy/system` (which holds WDS's internal decorations, not app icons, so ordinary icons are not exported from it). A root import renders classic icons regardless of the providers, so any root icon import scores no higher than 4. An `iconKey` string in a builder/extension config file is not an import and is exempt. (2) There are no hardcoded colour literals (hex, `rgb(`, `hsl(`) in any `.tsx`, `.css`, `.scss` or `.st.css` file the agent wrote. The status badge is the likely offender here: the three statuses must be distinguished with the `skin` prop on a WDS `Badge` (e.g. `standard`/`success`/`warning`/`danger`), not with hand-picked background colours. A colour-literal-per-status badge scores no higher than 3. (3) There are no `style={{ ... }}` overrides carrying colour, font-family or font-size on WDS components; where the agent needed such a value it used the component's `skin`/`size` prop, or a `--wds-*` CSS custom property on its own non-WDS container. (4) No hardcoded font families (`"Wix Madefor Display"`, `"Arial"`) or pixel font sizes. (5) If a value genuinely had no matching token, it carries a justification or TODO comment rather than sitting bare — an unexplained literal is a defect even when it looks right in the default theme. (6) Spacing: `SP*` tokens and numeric spacing on `gap`/`padding`/`margin` are CORRECT and must not be penalised — they follow the theme, which rebases the base unit from 6px to 4px. What IS a defect is a hardcoded pixel spacing value, or any text asserting the `SP*` scale is unchanged by the theme or converting it to fixed px. Score 0-10.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate whether the page itself works and follows the patterns-first rule, so that a themed-but-broken page cannot pass this scenario. Check: (1) The equipment table comes from `@wix/patterns` — a `Table`/`Grid` driven by a collection state hook (`useTableCollection` or a sibling) inside a `CollectionPage` shell — not a hand-written `<table>` or a manually assembled WDS table. (2) The add and edit flows are a `@wix/patterns` `EntityPage` driven by `useEntityPage` with form state from `@wix/patterns/form`, reached via `usePatternsNavigate` — not a hand-built WDS form and not a dashboard modal. The create route is registered separately with `type="createEntity"` and passes `isNewEntity`. (3) All four fields (name, category, daily rate, status) are present in both the table columns and the entity form. (4) For a router-wired page, the entry file supplies and guards `location` from `dashboard.observeState`, and the guard's pending branch renders a loader rather than `null` — without the guard `PatternsReactRouter` throws at open while `tsc` and `wix build` pass, and with a bare `null` a host handshake that never completes is indistinguishable from a broken page. The entry file also wraps its content in an error boundary (normally a shared `DashboardPageBoundary` class beside `BusinessManagerTheme`) so a render-time throw shows a reload affordance instead of a blank iframe; a router-wired entry file with no boundary scores no higher than 6, and one whose pending branch is `null` no higher than 7. (5) `@wix/design-system` is used only for leaf UI inside the patterns shells. (6) There is no `@wix/auto-patterns` import and no `patterns.json` file. Score 0-10.
  - type: time_limit
    maxDurationMs: 900000
  - type: cost
    maxCostUsd: 2.5
