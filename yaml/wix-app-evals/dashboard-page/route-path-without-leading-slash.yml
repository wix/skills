name: dashboard-page/route-path-without-leading-slash
description: A read-only Orders dashboard registers with a valid page route while its bookmarkable detail and Back navigation retain page-relative router paths.
triggerPrompt: |-
  Build a read-only Orders Review page in my app's dashboard using the site's real orders. Show the order number, customer, status and total. Clicking an order should open its details at a link I can bookmark, and I should be able to go back to the order list. Do not create sample orders or add editing actions.
templateId: c0ee6fd2-5265-4c57-b083-4f1308ff5ffa
tags: [dashboard-page, wix-patterns-docs]
assertions:
  - type: skill_was_called
    skillNames: [wix-app]
    referenceFiles:
      wix-app:
        - references/DASHBOARD_PAGE.md
        - references/dashboard-page/DRAFT_TEMPLATE.md
        - references/dashboard-page/DRAFT_TEMPLATE_ROUTER.md
  - type: build_passed
    command: npm run build
  - type: llm_judge
    model: claude-sonnet-4-6
    scoringMode: boolean
    prompt: |-
      Open the generated dashboard page builder file for the Orders Review page. Pass only if its routePath is nonempty and does not start with /.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Inspect the generated source and tool results, not just the final explanation. The user needs one registered Orders Review dashboard extension with a read-only collection and bookmarkable record detail.
      The dashboard extension must remain registered in src/extensions.ts. Internal PatternsReactRoute paths must remain page-relative with their leading slash: the collection at / and a parameterized detail route such as /:id. Row navigation, direct detail loading and Back must target those same paths, without prefixing them with the extension routePath.
      Score 0-10. Score at most 3 if the extension is unregistered, internal routing is broken by removing its slashes or adding the extension prefix, or the detail route is absent. A clean build cannot compensate for any of those failures. Do not infer runtime registration or browser success from a build alone; identify any unverified runtime behavior in the reason.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Inspect the sequence of tool calls for the distinction between dashboard registration and internal navigation. Score 0-10: 10 means the agent used the dashboard references, scaffolded a valid route without a leading slash, preserved internal router paths, and completed the request without route-repair coaching.
      Score at most 6 if the agent first generated a leading-slash routePath and repaired it later, encountered a route registration failure even if recovered, removed necessary internal route slashes, or asked the user to fix routing. Name the offending call or source change. A successful final result does not erase an earlier route failure. If registration or browser checks did not run, the final response must not claim they passed; score at most 6 for such an unsupported success claim. Unrelated environment failures do not by themselves prove a route error: report them separately.
  - type: time_limit
    maxDurationMs: 900000
  - type: cost
    maxCostUsd: 2.5
