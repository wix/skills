name: dashboard-page/table-reservations-today
description: Dashboard page listing a restaurant's table reservations — proves the agent finds the table reservations package instead of looking in the restaurants package
triggerPrompt: |-
  Build a dashboard page for my app that lists my restaurant's table reservations for today, with guest name, party size and time.
  APP_NAMESPACE: "@mirivo/my-app31ceim", Use this namespace when creating data collections (for idSuffix scoping).
  CODE_IDENTIFIER: "MirivoMyApp31ceim" When generating editor React component or function library extensions, use this identifier as the type prefix (e.g. type: 'MirivoMyApp31ceim"ComponentName').
templateId: c0ee6fd2-5265-4c57-b083-4f1308ff5ffa
tags: [dashboard-page, sdk-module-map]
assertions:
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/DASHBOARD_PAGE.md]
  - type: build_passed
    command: npm run build
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Table reservations are read through `@wix/table-reservations` (namespace `reservations`), not through `@wix/restaurants`, which covers menus and online orders. Check: (1) The page imports `reservations` from `@wix/table-reservations`, and that package is a declared dependency in package.json. (2) No reservation data is read from `@wix/restaurants`, from a CMS data collection, or from mock data. (3) The fields mapped into columns (guest name, party size, time) were checked against the SDK declaration for the method the agent called. (4) The table-reservations read scope is reported as a manual step. Score 0-10. Score 4 or below if reservations are imported from `@wix/restaurants` or modelled as a CMS collection.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate the path the agent took. Check: (1) It read the Dashboard Page reference before building the UI and located the SDK method and its field names from the installed package's declarations or the SDK-view docs, rather than from the REST page or memory. (2) It consulted the entity-to-SDK-module map before choosing a package. (3) It did not model the data as a CMS data collection. (4) It reported the Dev Center permission scopes it relied on as manual steps instead of assuming they were granted. Score 0-10. Cite the specific tool calls behind your score, and for each friction you penalize, name what the docs or references failed to make available up front.
  - type: time_limit
    maxDurationMs: 900000
  - type: cost
    maxCostUsd: 2.5
