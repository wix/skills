name: dashboard-page/orders-search-by-number
description: Dashboard page over Wix eCommerce orders with search by order number, a created-date range and payment method per row — proves valid filter shapes and the 100-id cap on the transactions batch lookup
triggerPrompt: |-
  Build a dashboard page for my app that lists the site's orders with order number, buyer, total, created date and payment method. I want to search by order number and filter by a created-date range.
  APP_NAMESPACE: "@mirivo/my-app31ceim", Use this namespace when creating data collections (for idSuffix scoping).
  CODE_IDENTIFIER: "MirivoMyApp31ceim" When generating editor React component or function library extensions, use this identifier as the type prefix (e.g. type: 'MirivoMyApp31ceim"ComponentName').
templateId: c0ee6fd2-5265-4c57-b083-4f1308ff5ffa
tags: [dashboard-page, sdk-module-map]
assertions:
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/DASHBOARD_PAGE.md, references/dashboard-page/DATA_SOURCES.md]
  - type: build_passed
    command: npm run build
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      The page must use `orders.searchOrders` from `@wix/ecom` with a valid filter. Check: (1) Order-number search does not use `$startsWith` on `number`: that field allows only `$eq`, `$ne`, `$in`, `$exists`, `$gt`, `$gte`, `$lt`, `$lte`, so the search is an exact `number` match (`$eq`), or the agent states that prefix search is unavailable. (2) The created-date range is two conditions under `$and`, `{ $and: [{ _createdDate: { $gte: from } }, { _createdDate: { $lte: to } }] }`, not `{ _createdDate: { $gte, $lte } }` in one object, and the field is `_createdDate`. (3) Payment method comes from one batched `orderTransactions.listTransactionsForMultipleOrders` call per page, not one call per row, with the ids chunked or the page size kept at or below 100, and an empty id list skipped. (4) Paging state reads the cursor from `pagingMetadata.cursors.next`, and a follow-up cursor request carries the cursor without `filter` or `sort`. (5) Orders read and transactions read scopes are reported as manual steps. Score 0-10. Score 4 or below if `$startsWith` is used on `number`, if both range operators sit on one `_createdDate` object, or if transactions are fetched once per row.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate the path the agent took. Check: (1) It read the Dashboard Page reference before building the UI and located the SDK method and its field names from the installed package's declarations or the SDK-view docs, rather than from the REST page or memory. (2) It read `references/dashboard-page/DATA_SOURCES.md` and confirmed the filterable operators for each field before writing the filter. (3) It did not model the data as a CMS data collection. (4) It reported the Dev Center permission scopes it relied on as manual steps instead of assuming they were granted. Score 0-10. Cite the specific tool calls behind your score, and for each friction you penalize, name what the docs or references failed to make available up front.
  - type: time_limit
    maxDurationMs: 900000
  - type: cost
    maxCostUsd: 2.5
