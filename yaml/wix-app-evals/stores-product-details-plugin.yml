name: stores/product-details-plugin-v3-shapes
description: Stores product-page site plugin that reads a V3 product by slug — covers the response wrapper, namespace-only type exports, nested option choices, variant stock, and RichContent description
triggerPrompt: |-
  Build a site plugin for the Wix Stores product page that shows extra product details under the gallery: each product option with its choice labels and swatch colours, whether each variant is in stock, and the product description rendered as plain text. The plugin gets the product's slug from the page, so look the product up by slug.
  CODE_IDENTIFIER: "MirivoMyApp31ceim" When generating editor React component or function library extensions, use this identifier as the type prefix (e.g. type: 'MirivoMyApp31ceim"ComponentName').
templateId: 33f2cb85-054e-4281-b617-3bc21ac0803f
tags: [stores-versioning, get-product, editor-react-component]
assertions:
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/STORES_VERSIONING.md]
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/stores/GET_PRODUCT.md]
  - type: build_passed
    command: npm run build
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate whether the agent built a working product-page site plugin. Check: (1) A site plugin extension exists and is registered. (2) It resolves a product from a slug and renders that product's data — not placeholder or hard-coded content. (3) Option choices are rendered with their labels, and swatch colours are applied where the option is a swatch. (4) Per-variant stock state is shown. (5) The description is rendered as readable plain text. Score 0-10.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate whether the code uses the correct Wix Stores Catalog V3 field shapes. Every item below is a real type error the SDK produces when it is got wrong, so judge the code as written, not the intent. Check: (1) Product types are reached through the namespace (`productsV3.V3Product`) — a bare `import { V3Product } from '@wix/stores'` is wrong, because the package root exports namespaces only. (2) The `getProductBySlug` result is unwrapped via its `product` field before any field is read; reading `variantsInfo`, `currency`, or `inventory` straight off the response is wrong. (3) Option choices are read from `option.choicesSettings?.choices`, NOT `option.choices`. (4) Per-variant stock is read from `variant.inventoryStatus` (e.g. `.inStock`), NOT `variant.inventory`; product-level availability is `product.inventory.availabilityStatus`. (5) Plain-text description comes from `plainDescription`; calling string methods such as `.replace()` on `description` is wrong because `description` is a `RichContent` document. (6) The catalog version is detected with `catalogVersioning.getCatalogVersion()` before any Stores read. Any one of items 1-5 got wrong scores no higher than 4. Score 0-10.
  - type: time_limit
    maxDurationMs: 180000
  - type: cost
    maxCostUsd: 1
