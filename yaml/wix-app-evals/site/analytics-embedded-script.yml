name: site/analytics-embedded-script
description: A third-party tracking snippet is an EMBEDDED_SCRIPT with the right scriptType/placement, a companion dashboard page for its parameters, and template vars read from data attributes.
triggerPrompt: |-
  Add Google Analytics tracking to sites that install my app. The site owner supplies their measurement ID and can switch tracking on or off without uninstalling the app.
  APP_NAMESPACE: "@evalforge/gatrack-d65swn", Use this namespace when creating data collections (for idSuffix scoping).
  CODE_IDENTIFIER: "EvalforgeGatrackD65swn" When generating editor React component or function library extensions, use this identifier as the type prefix (e.g. type: 'EvalforgeGatrackD65swn"ComponentName').
templateId: 33f2cb85-054e-4281-b617-3bc21ac0803f
tags: [embedded-script, dashboard-page]
assertions:
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/EMBEDDED_SCRIPT.md]
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/DASHBOARD_PAGE.md]
  - type: build_passed
    command: npm run build
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate whether the agent shipped a correct embedded script. Check: (1) An `EMBEDDED_SCRIPT` extension was scaffolded via `wix generate --params` with all five required params, `scriptType: ANALYTICS` and `placement: HEAD`. (2) The generated `<folder>.html` initialises gtag.js with the owner's measurement ID and tracks a page view. (3) Template variables appear **only inside HTML attribute values** — a config element carrying `data-*` attributes, read back through `dataset` in the script — never `{{var}}` inside the `<script>` body. (4) The `enabled` boolean is compared against the string `"true"`, and the early exit at module scope uses `throw new Error(...)` rather than `return`, with the main logic in a named async function called from `DOMContentLoaded`. (5) A companion `DASHBOARD_PAGE` extension loads and saves the parameters with `embeddedScripts.getEmbeddedScript()` / `embedScript()` from `@wix/app-management`, passing every value as a string. Score 0-10.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate whether the agent surfaced the operational requirements this extension carries. Check: (1) The manual Dev Center step is stated explicitly — enable `SCOPE.DC-APPS.MANAGE-EMBEDDED-SCRIPTS` at the dev-center-permissions page — and appears in the aggregated manual action items at the end, not buried mid-answer. (2) The agent explains that a release alone does not re-embed the script: sites keep serving whatever was active the last time `embedScript()` ran, so the owner must re-run the dashboard action after a content change. (3) It notes that adding, removing or renaming a dynamic parameter is a **major** version change requiring the site owner to click Update. (4) The enable/disable toggle is present as a parameter, not hard-coded. Score 0-10.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Rate how cleanly the agent got there. Examine the tool-call trace. Score 0-10 (10 = direct). Penalize and LIST any of: a `return` statement at module scope in the `<script type="module">` block (Rollup rejects it — a build failure recovered afterwards counts double); `{{templateVars}}` interpolated inside the script body instead of attributes; picking `FUNCTIONAL` or `ESSENTIAL` over `ANALYTICS`, or `BODY_END` over `HEAD`, without cause; shipping the script with no companion dashboard page; passing non-string values to `embedScript()`; a failed build or typecheck recovered later. For each, name the likely skill or docs gap. Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + suspected gap, or 'clean path' if none>"}.
  - type: time_limit
    maxDurationMs: 420000
  - type: cost
    maxCostUsd: 2.5
