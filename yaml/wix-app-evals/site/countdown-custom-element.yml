name: site/countdown-custom-element
description: A standalone widget a site owner drops anywhere is a CUSTOM_ELEMENT — an HTMLElement class with kebab-case observedAttributes, CSS Modules styling, and a WDS settings panel.
triggerPrompt: |-
  Build a countdown timer widget site owners can place anywhere on their site. It counts down to a target date and shows days, hours, minutes and seconds, and displays a finished message once the date passes. In the editor panel the owner sets the target date, the finished message, and the accent color.
  APP_NAMESPACE: "@evalforge/countdown-z73nvl", Use this namespace when creating data collections (for idSuffix scoping).
  CODE_IDENTIFIER: "EvalforgeCountdownZ73nvl" When generating editor React component or function library extensions, use this identifier as the type prefix (e.g. type: 'EvalforgeCountdownZ73nvl"ComponentName').
templateId: 33f2cb85-054e-4281-b617-3bc21ac0803f
tags: [custom-element-widget, editor-react-component, site-plugin]
assertions:
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/CUSTOM_ELEMENT_WIDGET.md]
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/custom-element-widget/SETTINGS_PANEL.md]
  - type: build_passed
    command: npm run build
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate whether the agent built a working countdown custom element. Check: (1) A `CUSTOM_ELEMENT` extension was scaffolded via `wix generate --params` with a `folder` that is a valid custom-element tag name (lowercase, contains a hyphen), producing the widget `.tsx`, `.panel.tsx`, `.module.css` and builder file. (2) The widget extends `HTMLElement` and is the default export; `observedAttributes` returns **kebab-case** names matching the panel props; `attributeChangedCallback` re-renders and `getAttribute` always has a fallback. (3) The ticking interval starts in `connectedCallback` and is cleared in `disconnectedCallback`. (4) The countdown maths is right and the finished message replaces the timer once the target date passes. (5) The panel is a React component using WDS inside `SidePanel > Header > Content > Footer`, each field wrapped in `SidePanel.Field`, and the color field uses `inputs.selectColor(value, { onChange })` from `@wix/editor` with a `FillPreview` trigger. Score 0-10.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Rate how cleanly the agent reached that outcome. Examine the tool-call trace and the final code. Score 0-10 (10 = direct: right extension type, right authoring rules first try). Penalize and LIST any of: choosing the wrong site extension (an Editor React component or a Site Plugin instead of a custom element widget — a Site Plugin needs a host slot, which this task has none of); calling `customElements.define()` in the widget code (Wix does that from the builder's `tagName`); camelCase entries in `observedAttributes`; `<input type="color">`, `async/await`, or a readOnly text input for the color field instead of the Editor picker; hard-coded colors inline instead of the `.module.css` `.root` class and its custom-property tokens; a timer left running after disconnect; a failed build or typecheck recovered later. For each, name the likely skill or docs gap. Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + suspected gap, or 'clean path' if none>"}.
  - type: time_limit
    maxDurationMs: 360000
  - type: cost
    maxCostUsd: 2
