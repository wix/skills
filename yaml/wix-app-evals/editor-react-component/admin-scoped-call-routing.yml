name: editor-react-component/admin-scoped-call-routing
description: Editor React component needing wixClientAdmin Locations methods — both the list and the archive must be routed through a backend endpoint that elevates, not called or elevated inside the component
triggerPrompt: |-
  Build an Editor React component for my app that shows the site's business locations, and lets the site owner archive a location from the component. Use the Wix Locations API.
  APP_NAMESPACE: "@mirivo/my-app31ceim", Use this namespace when creating data collections (for idSuffix scoping).
  CODE_IDENTIFIER: "MirivoMyApp31ceim" When generating editor React component or function library extensions, use this identifier as the type prefix (e.g. type: 'MirivoMyApp31ceim"ComponentName').
templateId: 33f2cb85-054e-4281-b617-3bc21ac0803f
tags: [editor-react-component, backend-api]
assertions:
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/EDITOR_REACT_COMPONENT.md]
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/BACKEND_API.md]
  - type: build_passed
    command: npm run build
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Both Locations methods this task needs are `wixClientAdmin` methods: `locations.archiveLocation` (scope `SCOPE.DC-MULTILOCATION.MANAGE-LOCATIONS`) and `locations.queryLocations` (scope `SCOPE.DC-MULTILOCATION.READ-LOCATIONS` — an admin method despite being a read). An Editor React component runs as a site visitor or member, and `auth.elevate` from `@wix/essentials` only works in backend code, so neither call can happen in the component.

      Editor React components are scaffolded under `src/extensions/site/components/<folder>/` — that is the component code, NOT `src/site/`.

      Evaluate whether the agent routed both calls. Check: (1) Neither `auth.elevate` nor a direct `locations.*` SDK call appears anywhere under `src/extensions/site/`. **The read counts** — a component that routes the archive but calls `queryLocations` directly to populate its list is wrong, and its list would not populate at runtime. (2) One or more HTTP endpoints under `src/pages/api/` wrap both `queryLocations` and `archiveLocation` with `auth.elevate`. (3) The component reaches them with `httpClient.fetchWithAuth()` from `@wix/essentials` — a bare `fetch` sends no identity and is wrong. (4) Before performing the archive, the endpoint re-checks something about the caller rather than archiving for anyone who can reach it; elevation bypasses Wix's permission check, so an unguarded endpoint lets any site visitor archive a location. If the agent could find no sound way to identify the caller and said so explicitly, treat that as acceptable — inventing a check that doesn't actually establish the caller is worse. (5) The agent surfaced adding the Locations scopes in Dev Center as a manual step.

      Score 0-10. Score 3 or below if `auth.elevate` or any `locations.*` call appears under `src/extensions/site/`, regardless of how good the rest of the code is.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate the path the agent took, not just the final files. Check: (1) It determined the identity requirement from the methods' SDK reference — the schema line reads `wixClientAdmin.…`, which is the signal — rather than guessing from the scope name or discovering it by trial and error after a runtime failure. Concluding "READ-LOCATIONS is a read, so it's fine in the component" is the specific failure to penalize. (2) It read the Backend API reference before creating the endpoint, and the Editor React component reference before scaffolding. (3) It scaffolded the component with `npx wix generate` rather than hand-writing the extension files. Score 0-10, and cite the specific tool calls behind your score.
  - type: time_limit
    maxDurationMs: 180000
  - type: cost
    maxCostUsd: 1
