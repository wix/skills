name: stores/product-details-editor-component-v3-shapes
description: Editor React Component on a Stores product page — must resolve the product from the page URL (it gets no product context) and use the correct V3 shapes for the slug response, option choices, variant stock, and description
triggerPrompt: |-
  Build an Editor React Component that a site owner can place on their Wix Stores product page to show extra details for the product on that page: each product option with its choice labels and swatch colours, whether each variant is in stock, and the product description as plain text.
  CODE_IDENTIFIER: "MirivoMyApp31ceim" When generating editor React component or function library extensions, use this identifier as the type prefix (e.g. type: 'MirivoMyApp31ceim"ComponentName').
templateId: 33f2cb85-054e-4281-b617-3bc21ac0803f
tags: [stores, stores-versioning, editor-react-component]
assertions:
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/STORES_VERSIONING.md]
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/stores/GET_PRODUCT.md]
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/editor-react-component/SITE-CONTEXT-HOOKS.md]
  - type: build_passed
    command: npm run build
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate whether the agent built a working Editor React Component for a Stores product page. Check: (1) An Editor React Component extension exists and is registered. (2) It renders real product data resolved at runtime, not placeholder or hard-coded content. (3) Option choices are rendered with their labels, and swatch colours are applied where the option is a swatch. (4) Per-variant stock state is shown. (5) The description is rendered as readable plain text. (6) The component degrades gracefully when it is placed on a page where no product can be resolved. Score 0-10.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate how the component obtains its product and whether it uses the correct Wix Stores Catalog V3 field shapes. Every item below is a real type error or a real API that does not exist, so judge the code as written, not the intent.
      Product resolution: (a) An Editor React Component receives NO product context — it must derive the product from the page URL (e.g. a slug parsed off `useCurrentUrl()`), then look it up. Inventing a hook such as `useCurrentProduct()`, or reading `widget.getProp('product-id')` (that is the site-plugin API, and this is not a site plugin), is wrong.
      V3 field shapes: (b) Product types are reached through the namespace (`productsV3.V3Product`) — a bare `import { V3Product } from '@wix/stores'` is wrong, because the package root exports namespaces only. (c) The `getProductBySlug` result is unwrapped via its `product` field before any field is read; reading `variantsInfo`, `currency`, or `inventory` straight off the response is wrong. (d) Option choices are read from `option.choicesSettings?.choices`, NOT `option.choices`. (e) Per-variant stock is read from `variant.inventoryStatus` (e.g. `.inStock`), NOT `variant.inventory`; product-level availability is `product.inventory.availabilityStatus`. (f) Plain-text description comes from `plainDescription`; calling string methods such as `.replace()` on `description` is wrong because `description` is a `RichContent` document. (g) The catalog version is detected with `catalogVersioning.getCatalogVersion()` before any Stores read.
      Any one of items (a) through (f) got wrong scores no higher than 4. Score 0-10.
  - type: time_limit
    maxDurationMs: 180000
  - type: cost
    maxCostUsd: 1
