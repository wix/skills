name: employee-shift-dashboard
description: Dashboard page for store owners to manage employee shifts, built with @wix/patterns over a scoped data collection
triggerPrompt: |-
  Build a dashboard page that lets store owners manage employee shifts. The page should have a table where each row is a shift with these fields: employee name, date, and hours. The store owner must be able to add new shifts to the table.
  APP_NAMESPACE: "@mirivo/my-app31ceim", Use this namespace when creating data collections (for idSuffix scoping).
  CODE_IDENTIFIER: "MirivoMyApp31ceim" When generating editor React component or function library extensions, use this identifier as the type prefix (e.g. type: 'MirivoMyApp31ceim"ComponentName').
templateId: c0ee6fd2-5265-4c57-b083-4f1308ff5ffa
tags: [dashboard-page, data-collection, wix-patterns-docs]
assertions:
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/DASHBOARD_PAGE.md]
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/WIX_PATTERNS_DOCS.md]
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/DATA_COLLECTION.md]
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/dashboard-page/DRAFT_TEMPLATE_CMS_COLLECTION.md]
  - type: build_passed
    command: npm run build
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate whether the agent created a functional dashboard page for managing employee shifts. Check: (1) There is a visible table/grid displaying shifts with columns for employee name, date, and hours. (2) There is a way to add new shifts (e.g. a form or add button). (3) New shifts appear in the table after being added. (4) The code is well-structured and the UI is usable. Score 0-10.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate whether the shifts UI follows the patterns-first component selection rule. Check: (1) The shifts table/grid comes from `@wix/patterns` — a `Table`/`Grid` driven by a collection state hook (`useTableCollection` or a sibling) inside a `@wix/patterns` page shell (`CollectionPage`) — and is NOT a hand-written `<table>`, a manually assembled Wix Design System table, or a custom collection implementation. Because the rows come from a data collection, `Table` and `useTableCollection` must be imported from `@wix/patterns/schema`, not from the package root: the root exports are the hand-wired versions and will not read a schema, and the page should carry no `columns` prop at all — the schema renders them. Root imports paired with a hand-written `columns` array score no higher than 4. (2) **The add/edit-shift flow is a `@wix/patterns` `EntityPage` driven by `useEntityPage`, with form state from `@wix/patterns/form`, reached via `usePatternsNavigate` — NOT a hand-built Wix Design System form inside a dashboard modal.** A correct table paired with a hand-rolled WDS entity form scores no higher than 4. (3) The `@wix/patterns` provider lives in a parent component, in a separate file from the one calling the collection hook. (4) `@wix/design-system` is used only for leaf UI inside those shells (inputs, buttons, form fields, text, layout) — not to replace anything patterns provides. (5) There is no `@wix/auto-patterns` import and no `patterns.json` file anywhere in the project. (6) The agent looked up `@wix/patterns` names via `dist/docs/index.json` and `dist/dts-bundle/index.json` (and the specific `.md`/`.d.ts` files those point at) — not by running `ls`, `find`, `cat`, or `grep` against arbitrary paths under `node_modules`. Any such direct `node_modules` exploration is an automatic low score, same severity as the `@wix/auto-patterns` check above. (7) The component names came from the library's own guides rather than from recall: the agent read `dist/docs/index.json` and then the guide docs it lists — `Composition and Providers.md` before writing patterns JSX, and `Collection Toolkit.md` and/or `Collection to Entity Flow.md` for the components themselves — and used names those guides recommend. This is the assertion `skill_was_called` cannot make, because these files ship inside the installed package rather than in the skill. An agent that wrote correct patterns code without opening any guide scores no higher than 6; one that named a component the guides do not mention, and did not verify it against `dist/docs/index.json`, scores no higher than 4. (8) If the installed `@wix/patterns` had no `Collection Toolkit` entry in `dist/docs/index.json`, the agent said so and asked to upgrade rather than proceeding from memory. Score 0-10.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      The prompt requires adding new shifts, so this build has a create route as well as an edit one. The rows come from a scoped data collection, so the page is the schema-driven one (`useCmsSchemaSource` + `@wix/patterns/schema`), whose entity API is `useEntityPage(source, { entityId, form, parentPath })` — it takes no `fetch`, no `onSave` and no `isNewEntity`, because reads and writes go through the source's own backend. Evaluate only how the create route is wired. Check: (1) The create route is registered as its own `PatternsReactRoute` with `type="createEntity"` — not the edit route reused with the id left out, and not a dashboard modal. (2) The navigation to it calls `navigateToEntityPage({ path })` with **no** `entity` argument. Inventing a blank/placeholder record to pass as `entity` is a defect: it becomes `state.entity` until the source resolves. (3) One component serves both `/new` and `/:id`, and what distinguishes them is `entityId` being `undefined` on the create route — read from `useParams`, passed straight through. A second component duplicated for create, or a hardcoded flag standing in for it, is a defect. (4) The hand-wired entity API is NOT used against a schema source: `fetch`, `onSave` or `isNewEntity` passed to `useEntityPage` means the agent took DRAFT_TEMPLATE_ROUTER.md's §3 instead of the CMS template's §3, and the save then bypasses the source. Treat any of those three options as no higher than 4. (5) `form` comes from `useForm()` (`@wix/patterns/form`) and is passed in, since the fields card writes through it. Score 0-10.
  - type: time_limit
    maxDurationMs: 900000
  - type: cost
    maxCostUsd: 2.5
