name: dashboard/app-settings-page
description: A non-collection settings screen is a @wix/patterns SettingsPage with WDS leaf fields — no table, no collection hook, and no hand-rolled page header.
triggerPrompt: |-
  Build a settings page in the dashboard for my app. The site owner configures: a notification email address, a toggle for "send a daily summary", and a dropdown for the summary time zone. Settings must load on open, save on submit, and show a toast when saving succeeds or fails.
  APP_NAMESPACE: "@evalforge/appsettings-v81zwq", Use this namespace when creating data collections (for idSuffix scoping).
  CODE_IDENTIFIER: "EvalforgeAppsettingsV81zwq" When generating editor React component or function library extensions, use this identifier as the type prefix (e.g. type: 'EvalforgeAppsettingsV81zwq"ComponentName').
templateId: 33f2cb85-054e-4281-b617-3bc21ac0803f
tags: [dashboard-page, wix-patterns-docs, data-collection]
assertions:
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/DASHBOARD_PAGE.md]
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/WIX_PATTERNS_DOCS.md]
  - type: build_passed
    command: npm run build
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate whether the agent built a working settings page. Check: (1) A `DASHBOARD_PAGE` extension was scaffolded via `wix generate --params` with a `title` and a lowercase-hyphen `route`. (2) The three settings (email, daily-summary toggle, time-zone select) render and are wired to state. (3) Current values are loaded when the page opens and persisted on save. (4) Success and failure both surface via `dashboard.showToast()`. (5) The email field is validated before saving. Score 0-10.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate the component selection. Check: (1) The page shell is the `@wix/patterns` `SettingsPage` (with its `.Header` / `.Content` sub-parts) — **not** a `CollectionPage`, not a WDS `Page`, and not a hand-rolled header/layout. (2) The `@wix/patterns` provider lives in a parent component, in a separate file from the page body. (3) No table, grid, or collection state hook was introduced — this screen has no collection. (4) `@wix/design-system` supplies only the leaf fields (`FormField`, `Input`, `ToggleSwitch`, `Dropdown`, `Button`) and `@wix/design-system/styles.global.css` is imported in the main component entry file only. (5) Nothing was hand-rolled that patterns or WDS already ships, and there is no `@wix/auto-patterns` import or `patterns.json`. Score 0-10.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Rate how cleanly the agent got there. Examine the tool-call trace. Score 0-10 (10 = direct). Penalize and LIST any of: writing JSX before confirming `@wix/patterns` is installed and enumerating `node_modules/@wix/patterns/dist/docs/index.json`; guessing a component or prop name from memory and fixing it after a type error; building the shell from WDS first and reworking it into patterns; a failed build or typecheck; redundant probing reads. For each, name the likely skill or docs gap. Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + suspected gap, or 'clean path' if none>"}.
  - type: time_limit
    maxDurationMs: 300000
  - type: cost
    maxCostUsd: 1.5
