name: dashboard/supplier-entity-page-not-modal
description: Adding and editing a collection item must be a @wix/patterns EntityPage reached via usePatternsNavigate — NOT a Dashboard Modal. Negative dependency on DASHBOARD_MODAL.md.
triggerPrompt: |-
  Build a dashboard page where a store owner manages their suppliers. The list shows supplier name, contact email and lead time in days. The owner needs to add a new supplier and edit an existing one — name and email are required, lead time is optional and must be a positive number.
  APP_NAMESPACE: "@evalforge/suppliers-q38ftm", Use this namespace when creating data collections (for idSuffix scoping).
  CODE_IDENTIFIER: "EvalforgeSuppliersQ38ftm" When generating editor React component or function library extensions, use this identifier as the type prefix (e.g. type: 'EvalforgeSuppliersQ38ftm"ComponentName').
templateId: 33f2cb85-054e-4281-b617-3bc21ac0803f
tags: [dashboard-page, dashboard-modal, wix-patterns-docs, data-collection]
assertions:
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/WIX_PATTERNS_DOCS.md]
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/DASHBOARD_PAGE.md]
  - type: skill_was_called
    negate: true
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/DASHBOARD_MODAL.md]
  - type: build_passed
    command: npm run build
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate whether the agent built a working supplier management page. Check: (1) A collection view lists suppliers with name, contact email and lead time. (2) There is a create flow and an edit flow for a single supplier. (3) Name and email are required and validated; lead time is optional and rejected when not a positive number. (4) Saved changes are reflected back in the list. (5) The data is persisted in an app-scoped data collection whose `idSuffix` is the bare suffix while API calls use the full `@evalforge/suppliers-q38ftm/<suffix>` id. Score 0-10.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate whether the add/edit flow follows the documented entity rule. Check: (1) The single-supplier create/edit screen is a `@wix/patterns` `EntityPage` driven by `useEntityPage({ fetch, onSave })`, registered as a `PatternsReactRoute` inside `PatternsReactRouter` and reached with `usePatternsNavigate().navigateToEntityPage`. (2) Form state comes from `useForm` / `useController` in `@wix/patterns/form`; `@wix/design-system` supplies only leaf fields (`FormField`, `Input`, `Text`) inside `EntityPage.Card`. (3) The list is a `@wix/patterns` `Table`/`Grid` driven by a collection state hook inside a `CollectionPage` shell — not a hand-written `<table>` or a manually assembled WDS table. (4) **No Dashboard Modal extension was created for adding or editing a supplier, and no WDS `<Modal />` or hand-rolled React modal hosts the supplier form.** A correct table paired with an entity form in a modal scores no higher than 3. (5) No `@wix/auto-patterns` import and no `patterns.json` anywhere in the project. Score 0-10.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Rate how smoothly the agent got there. Examine the tool-call trace. Score 0-10 (10 = direct: no wasted calls, no errors). Penalize and LIST any of: writing JSX before enumerating the real component list with `cat node_modules/@wix/patterns/dist/docs/index.json`; guessing a patterns or WDS component/prop name from memory and correcting it later; building the entity form first as a modal and then reworking it; a non-2xx or failed build/typecheck even if recovered; probing or redundant reads a clearer skill would avoid. For each, name the likely skill or docs gap. Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + suspected gap, or 'clean path' if none>"}.
  - type: time_limit
    maxDurationMs: 420000
  - type: cost
    maxCostUsd: 2.5
