name: dashboard/blog-posts-banner-plugin
description: A widget embedded in a Wix Blog dashboard slot is a Dashboard Plugin — scaffolded with extendsSlotId, reading host data via observeState, built from WDS (it renders outside a patterns page shell).
triggerPrompt: |-
  Add a promotional banner to the Wix Blog Posts page in my dashboard. It should sit inside the Blog posts page itself, show a headline plus a call-to-action button, and use whatever post context the page hands it (for example the number of posts) in the banner copy.
  APP_NAMESPACE: "@evalforge/blogbanner-k29xrt", Use this namespace when creating data collections (for idSuffix scoping).
  CODE_IDENTIFIER: "EvalforgeBlogbannerK29xrt" When generating editor React component or function library extensions, use this identifier as the type prefix (e.g. type: 'EvalforgeBlogbannerK29xrt"ComponentName').
templateId: 33f2cb85-054e-4281-b617-3bc21ac0803f
tags: [dashboard-plugin, dashboard-page, dashboard-menu-plugin]
assertions:
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/DASHBOARD_PLUGIN.md]
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/dashboard-plugin/SLOTS.md]
  - type: build_passed
    command: npm run build
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate whether the agent built a working Wix Blog posts-page dashboard plugin. Check: (1) A `DASHBOARD_PLUGIN` extension was scaffolded via `wix generate --params` — folder, React component, builder file, UUID and `src/extensions.ts` registration all CLI-generated. (2) `extendsSlotId` is a real slot ID taken from the Blog section of the slots reference, not invented. (3) The component subscribes with `dashboard.observeState()` inside a `useEffect` and uses the received params in the rendered copy, with a sensible fallback before the first callback fires. (4) The banner renders a headline and a CTA using `@wix/design-system` components inside a `WixDesignSystemProvider`. (5) The plugin does not assume a fixed height or width beyond its slot. Score 0-10.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Rate how cleanly the agent reached that outcome. Examine the tool-call trace and the final tree. Score 0-10 (10 = direct: right extension type first try, no rework). Penalize and LIST any of: creating a Dashboard **Menu** Plugin or a Dashboard Page instead of a Dashboard Plugin, or creating either one in addition (this is a plugin-only task); inventing a slot ID rather than reading it from the slots reference; hand-writing the builder file, UUID or `src/extensions.ts` entry; reaching for `@wix/patterns` page shells here (a dashboard plugin renders outside a patterns page shell, so WDS is the default); a failed build or typecheck that had to be recovered; probing reads a clearer skill would avoid. For each, name the likely skill or docs gap. Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + suspected gap, or 'clean path' if none>"}.
  - type: time_limit
    maxDurationMs: 300000
  - type: cost
    maxCostUsd: 1.5
