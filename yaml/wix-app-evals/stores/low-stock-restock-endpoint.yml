name: stores/low-stock-restock-endpoint
description: A Stores inventory write behind an HTTP endpoint — version detection first, inventory read/write on both V1 and V3 paths, and V3 optimistic concurrency respected.
triggerPrompt: |-
  Expose an endpoint my warehouse system can call: POST /api/restock takes a SKU and a quantity, finds the matching product in the store, increases its inventory by that quantity, and returns the new stock level. Return a clear error if the SKU isn't found. It has to work on any site my app is installed on.
  APP_NAMESPACE: "@evalforge/restock-f92lkc", Use this namespace when creating data collections (for idSuffix scoping).
  CODE_IDENTIFIER: "EvalforgeRestockF92lkc" When generating editor React component or function library extensions, use this identifier as the type prefix (e.g. type: 'EvalforgeRestockF92lkc"ComponentName').
templateId: 33f2cb85-054e-4281-b617-3bc21ac0803f
tags: [stores, stores-versioning, backend-api]
assertions:
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/STORES_VERSIONING.md]
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/stores/INVENTORY.md]
  - type: build_passed
    command: npm run build
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate whether the agent implemented the restock endpoint correctly. Check: (1) The endpoint is `src/pages/api/restock.ts` exporting `POST` typed with `APIRoute` from `astro` — no `wix generate` attempt and no `src/extensions.ts` registration for it. (2) `catalogVersioning.getCatalogVersion()` runs before any other Stores call, its result cached, with `STORES_NOT_INSTALLED` handled gracefully. (3) **Both** paths are implemented: V1 via `inventory`, V3 via `inventoryItemsV3` — a single-version implementation fails this outright. (4) The V3 update respects optimistic concurrency: the current `revision` is fetched and passed back on update. (5) Input is validated (SKU present, quantity a positive number), a missing SKU returns a 404-style JSON error rather than throwing, and Wix API calls are wrapped in `auth.elevate` from `@wix/essentials`. Score 0-10.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Rate how cleanly the agent got there. Examine the tool-call trace. Score 0-10 (10 = direct). Penalize and LIST any of: reaching for Stores APIs before detecting the catalog version; treating V1 and V3 stock shapes as interchangeable (`stock.quantity` vs the Inventory Items API), or comparing stock status against lowercase strings; omitting the `revision` on a V3 update and hitting a concurrency error; passing `sort` to a V3 product query; attempting `wix generate` for the HTTP endpoint; forgetting to report both the V1 and V3 inventory scopes plus `SCOPE.STORES.CATALOG_READ_LIMITED`; a failed build or typecheck recovered later. For each, name the likely skill or docs gap. Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + suspected gap, or 'clean path' if none>"}.
  - type: time_limit
    maxDurationMs: 420000
  - type: cost
    maxCostUsd: 2.5
