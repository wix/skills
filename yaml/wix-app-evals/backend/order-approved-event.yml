name: backend/order-approved-event
description: Reacting after something happens on the site is a backend EVENT extension — a default-exported SDK webhook handler with elevated API calls, idempotency and try/catch.
triggerPrompt: |-
  When an order is approved on the site, I want to record it in my app so I can report on it later: store the order id, the buyer's email and the total, and skip it if I've already recorded that order.
  APP_NAMESPACE: "@evalforge/orderlog-t26fkw", Use this namespace when creating data collections (for idSuffix scoping).
  CODE_IDENTIFIER: "EvalforgeOrderlogT26fkw" When generating editor React component or function library extensions, use this identifier as the type prefix (e.g. type: 'EvalforgeOrderlogT26fkw"ComponentName').
templateId: 33f2cb85-054e-4281-b617-3bc21ac0803f
tags: [backend-event, data-collection]
assertions:
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/BACKEND_EVENT.md]
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/backend-event/COMMON-EVENTS.md]
  - type: build_passed
    command: npm run build
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate whether the agent built a correct order-approved handler. Check: (1) An `EVENT` extension was scaffolded via `wix generate --params '{"extensionType":"EVENT","folder":"<lowercase-hyphen>"}'` — folder, both files, UUID and `src/extensions.ts` registration all CLI-generated, and the sample CRM contact import replaced. (2) The handler is the default export of `orders.onOrderApproved(...)` imported from `@wix/ecom`. (3) It writes order id, buyer email and total into an app-scoped data collection whose `idSuffix` is the bare suffix while API calls use the full `@evalforge/orderlog-t26fkw/<suffix>` id. (4) The write is idempotent — an already-recorded order id is not duplicated, because events can be delivered more than once. (5) The Wix API calls are wrapped with `auth.elevate` from `@wix/essentials` and the body is inside try/catch so a failure does not break other handlers. Score 0-10.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Rate how cleanly the agent got there. Examine the tool-call trace. Score 0-10 (10 = direct). Penalize and LIST any of: guessing the SDK module or handler name instead of taking it from the common-events reference; registering more than one extension for the same event (one handler per event is the hard limit); calling a Wix API without `auth.elevate`; no try/catch and no idempotency guard; not surfacing the required permission scope or the fact the event only fires after a release; a failed build or typecheck recovered later. For each, name the likely skill or docs gap. Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + suspected gap, or 'clean path' if none>"}.
  - type: time_limit
    maxDurationMs: 300000
  - type: cost
    maxCostUsd: 1.5
