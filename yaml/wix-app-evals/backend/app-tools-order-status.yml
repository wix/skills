name: backend/app-tools-order-status
description: Exposing a tool to the Wix AI assistant needs BOTH an APP_TOOLS declaration and a TOOLS_PROVIDER_CONFIG service plugin, linked by an exactly matching methodName.
triggerPrompt: |-
  I want the Wix AI assistant to be able to answer "where is my order?" for my app. Give it a tool that takes an order id and returns the fulfillment status, the shipping carrier and the tracking number.
  APP_NAMESPACE: "@evalforge/ordertools-c94rpb", Use this namespace when creating data collections (for idSuffix scoping).
  CODE_IDENTIFIER: "EvalforgeOrdertoolsC94rpb" When generating editor React component or function library extensions, use this identifier as the type prefix (e.g. type: 'EvalforgeOrdertoolsC94rpb"ComponentName').
templateId: 33f2cb85-054e-4281-b617-3bc21ac0803f
tags: [app-tools, service-plugin]
assertions:
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/APP_TOOLS.md]
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/app-tools/TOOLS.md]
  - type: build_passed
    command: npm run build
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate whether the agent wired up a complete App Tools setup. Check: (1) **Both** extensions were scaffolded via `wix generate --params` — an `APP_TOOLS` extension and a `SERVICE_PLUGIN` with `pluginType: TOOLS_PROVIDER_CONFIG`. (2) The tool declaration replaces the stub: a `methodName` of 1–30 characters, `requestSchema` requiring `orderId`, a `responseSchema` covering status/carrier/tracking, and `activated: true`. (3) The `description` reads like a short prompt (2–4 sentences): what it does, when to use it including the phrasings a user would say, and the required input — not a one-line "Returns order status." (4) `toolsProvider.provideHandlers({ runTool })` routes on `request.methodName` with a `case` matching the declaration **exactly**, and a `default` branch that rejects unknown tools. (5) The handler validates `payload.orderId` defensively (schemas are advisory, Wix does not enforce them) and wraps any Wix API call in `auth.elevate` from `@wix/essentials`. Score 0-10.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Rate how cleanly the agent reached that outcome. Examine the tool-call trace and final tree. Score 0-10 (10 = direct: both extensions, right first time). Penalize and LIST any of: shipping only one of the two extensions (a declaration with no runtime handler, or a handler with no declaration — either alone caps the score at 3); a `methodName` mismatch between the declaration and the `switch`; leaving `activated: false` or leaving the generated `myMethod` stub behind; hand-writing files, UUIDs or `src/extensions.ts` entries the CLI generates; failing to tell the user the app must be built and released before the tool goes live; a failed build or typecheck recovered later. For each, name the likely skill or docs gap. Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + suspected gap, or 'clean path' if none>"}.
  - type: time_limit
    maxDurationMs: 420000
  - type: cost
    maxCostUsd: 2.5
