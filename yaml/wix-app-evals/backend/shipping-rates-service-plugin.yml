name: backend/shipping-rates-service-plugin
description: Custom checkout shipping rates are an ECOM_SHIPPING_RATES service plugin — a singular SPI whose exact request/response types must come from ReadFullDocsMethodSchema before any code is written.
triggerPrompt: |-
  My store needs custom shipping options at checkout. Offer "Standard" at $6.90 for orders under $75 and free above that, and "Express" at a flat $18.50 which must not be offered outside the United States. Both should show a delivery estimate.
  APP_NAMESPACE: "@evalforge/shiprates-p47cnd", Use this namespace when creating data collections (for idSuffix scoping).
  CODE_IDENTIFIER: "EvalforgeShipratesP47cnd" When generating editor React component or function library extensions, use this identifier as the type prefix (e.g. type: 'EvalforgeShipratesP47cnd"ComponentName').
templateId: 33f2cb85-054e-4281-b617-3bc21ac0803f
tags: [service-plugin]
assertions:
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/SERVICE_PLUGIN.md]
  - type: skill_was_called
    negate: false
    skillNames: [wix-app]
    referenceFiles:
      wix-app: [references/service-plugin/SHIPPING-RATES.md]
  - type: build_passed
    command: npm run build
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Evaluate whether the agent implemented the shipping rules correctly. Check: (1) A `SERVICE_PLUGIN` extension with `pluginType: ECOM_SHIPPING_RATES` was scaffolded via `wix generate --params`, with a `name` that is lowercase alphanumeric + hyphens and at most 19 characters. (2) `shippingRates.provideHandlers({ getShippingRates })` from `@wix/ecom/service-plugins` is implemented and returns the documented response shape (`shippingRates` entries with `code`, `title`, `logistics`, `cost`). (3) Standard is $6.90 below a $75 subtotal and free at or above it — the threshold boundary handled explicitly. (4) Express is $18.50 and is omitted entirely for non-US destinations. (5) Missing or malformed input (no address, empty cart, absent totals) is handled gracefully instead of throwing. Score 0-10.
  - type: llm_judge
    model: claude-sonnet-4-6
    minScore: 7
    prompt: |-
      Rate how cleanly the agent reached that implementation. Examine the tool-call trace. Score 0-10 (10 = direct: schema first, code once). Penalize and LIST any of: **editing handler code before calling `ReadFullDocsMethodSchema` on the getShippingRates docs URL** (the skill makes this mandatory — this alone caps the score at 3); guessing request/response field names and correcting them after a type error; scaffolding a second `ECOM_SHIPPING_RATES` component (this SPI type is singular — only one per app); passing builder fields the `ecomShippingRates()` builder does not accept, or leaving the generated `description` placeholder in the builder file; calling a Wix API without wrapping it in `auth.elevate` from `@wix/essentials`; a failed build or typecheck recovered later. For each, name the likely skill or docs gap. Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + suspected gap, or 'clean path' if none>"}.
  - type: time_limit
    maxDurationMs: 300000
  - type: cost
    maxCostUsd: 1.5
