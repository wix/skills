name: custom-apps/price-for-customer-abroad-with-app-skill
description: >-
  Verifies the agent uses an installed app's skill to answer a request no
  built-in Wix feature covers: it discovers the site's app skills and app
  tools, picks the Global Pricing Helper's International price quote skill,
  reads its guidelines with Get App Skill, and runs only that skill's tools
  through Invoke Tool, with payloads built from each tool's requestSchema.
triggerPrompt: >-
  Use the pricing app on my site: what should a customer in Germany pay, in
  euros and including VAT, for our $49 mug? Round the final price so it
  ends in .99.
tags: [custom-apps, app-installation]
siteSetup:
  mode: template
  templateId: blank-editor
  bootstrap:
    steps:
      - label: Install Global Pricing Helper from its share link, a demo app that declares app skills and app tools and isn't in the App Market
        method: post
        url: https://www.wixapis.com/apps-installer-service/v1/app-share-url/install
        body:
          tenant:
            id: "{{siteId}}"
            tenantType: SITE
          shareUrlId: 503085ae-8a7d-450c-8af1-cbb37906011c
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/app-management/app-tools/skills/use-app-skills-and-app-tools
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user asked what a customer in Germany should pay for a $49 mug,
      including VAT, rounded to end in .99. The site has the Global Pricing
      Helper app installed. Its "International price quote" app skill
      (toolMethodNames: convertCurrency, calculateVat, roundPrice) covers
      exactly this request. Its tools return: 49 USD = 45.08 EUR (rate 0.92);
      German VAT 19% = 8.57, total 53.65; charm rounding = 53.99.
      Intent: answer with the app's pricing, not with the agent's own math.

      Pass if the agent:
      - discovered the site's app skills and app tools (List App Skills and
        List Tools Providers), AND
      - read the International price quote skill with Get App Skill, AND
      - ran convertCurrency, calculateVat and roundPrice through Invoke Tool
        with providerAppId set to the app's appId and payloads matching each
        tool's requestSchema (amount/from/to, amount/country, amount/style),
        AND
      - told the user the final price is 53.99 EUR, showing the converted
        price, the 19% VAT and the total before rounding.

      Fail if the agent:
      - computes the conversion, VAT or rounding itself instead of calling
        the app's tools, OR
      - calls a tool that is not in the skill's toolMethodNames, OR
      - asks the user to choose a skill or a rounding style, although the
        request names everything the skill needs, OR
      - reports a final price other than 53.99 EUR.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: >
      Rate how smoothly the Wix MCP let the agent fulfill the request. Examine
      the tool-call trace. Score 0-10 (10 = direct: no wasted calls, no errors).
      Penalize and LIST any of: a non-2xx error even if recovered; an endpoint
      called with a wrong URL, host or HTTP method and then corrected; an
      Invoke Tool payload guessed wrong then corrected; calling Get App Skill
      for skills other than the chosen one; searching the docs or probing
      other APIs before the two discovery calls; redundant or repeated calls
      clearer docs would avoid. For each, name the likely MCP/docs gap.
      Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + suspected MCP/docs gap, or 'clean path' if none>"}.
