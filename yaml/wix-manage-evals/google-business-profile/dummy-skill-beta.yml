name: google-business-profile/dummy-skill-beta
description: Verifies that dummy skill Beta is independently published and readable.
triggerPrompt: Run Google Business Profile dummy skill Beta for the publishing race test.
tags: [seo]
maxTokens: 4000
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/google-business-profile/skills/dummy-skill-beta-publishing-race-test
  - type: llm_judge
    minScore: 7
    maxTokens: 256
    prompt: |
      Pass only if the final response is exactly GBP_DUMMY_BETA, with no extra text.
  - type: llm_judge
    minScore: 7
    maxTokens: 256
    prompt: |
      Pass only if the tool-call trace reads this dummy skill and makes no API, site, or mutation
      calls. Return ONLY {"score":<0-10>,"reason":"<brief reason>"}.
