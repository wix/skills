name: google-business-profile/draft-check-connection-status
description: >-
  Verifies that the connection-status draft reads the site's Google Business Profile connection
  once and reports the status without starting OAuth or changing data.
triggerPrompt: >-
  Check whether my Wix site is currently connected to Google Business Profile. Do not reconnect it
  or change anything.
tags: [seo]
maxTokens: 12000
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/google-business-profile/skills/draft-check-google-business-profile-connection-status
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Pass if the agent performs a read-only Google Business Profile connection check for the
      authenticated Wix site, accurately explains the returned status (or clearly reports a
      permission blocker), and does not request a connect URL, start OAuth, disconnect, or mutate
      any site or Google data. Fail if it invents a site ID, claims VALID proves live Google access,
      or makes any write or connection-changing call.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Rate the tool-call path from 0-10. A 10 is one direct Get Connection call followed by an
      accurate response, or one permission denial followed by a clear blocker explanation. Penalize
      redundant status reads, documentation searches after the recipe is loaded, connect-URL or
      disconnect calls, guessed request shapes, recovered non-2xx calls, or calls against another
      site. Return ONLY {"score":<0-10>,"reason":"<terse friction list or 'clean path'>"}.
siteSetup:
  mode: template
  templateId: blank-editor
