name: google-business-profile/draft-list-wix-stored-locations
description: >-
  Verifies that the Wix-stored-locations draft uses the Wix-only query and does not require a live
  Google connection, hydrate Google data, or mutate locations.
triggerPrompt: >-
  List the Google Business Profile locations already stored for my Wix site. I only need the Wix
  records, not live data from Google, and do not change anything.
tags: [seo]
maxTokens: 12000
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/google-business-profile/skills/draft-list-wix-stored-google-business-profile-locations
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Pass if the agent uses Query GBP Locations to read only the locations stored for the
      authenticated Wix site, reports the results accurately (or clearly reports a permission
      blocker), and does not require an active Google connection. Fail if it invents a site ID,
      uses a live-Google hydration method, imports a location, or updates or deletes data.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Rate the tool-call path from 0-10. A 10 is one direct Wix-only locations query followed by an
      accurate response, with cursor paging only when the response requires it, or one permission
      denial followed by a clear blocker explanation. Penalize Google-backed location calls,
      connection setup, redundant probes, guessed request shapes, recovered non-2xx calls, or any
      mutation. Return ONLY {"score":<0-10>,"reason":"<terse friction list or 'clean path'>"}.
siteSetup:
  mode: template
  templateId: blank-editor
