name: rich-content/ricos-collapsible-list
description: Sharp-edge check on the Author Ricos Rich Content recipe — a COLLAPSIBLE_LIST with correct title/body nesting.
triggerPrompt: I need hand-authored Ricos rich-content JSON. First call ReadFullDocsArticle for the Author Ricos Rich Content recipe at https://dev.wix.com/docs/api-reference/assets/rich-content/skills/author-ricos-rich-content. Then give me the nodes tree for a one-item FAQ collapsible list. The title is "What is your return policy?" and the body is "Returns are accepted within 30 days." Output only the richContent JSON.
tags: [rich-content]
maxTokens: 450000
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/assets/rich-content/skills/author-ricos-rich-content
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Inspect the produced Ricos JSON for a collapsible FAQ list.

      Score 9-10: contains `COLLAPSIBLE_LIST` → `COLLAPSIBLE_ITEM` → `COLLAPSIBLE_ITEM_TITLE` and `COLLAPSIBLE_ITEM_BODY`; each title/body wraps a `PARAGRAPH` containing `TEXT` with `paragraphData` present (e.g. `textStyle.textAlignment`); title text mentions the return policy question and body text mentions 30 days; `collapsibleListData` is present; every `type` is a bare string.
      Score 6-8: correct nesting but a minor field is missing (e.g. `collapsibleListData`) or title/body text is slightly off.
      Score 3-5: nesting skips a level (e.g. TEXT directly in COLLAPSIBLE_ITEM), OR missing TITLE or BODY, OR wrong node types.
      Score 0-2: no collapsible list, or prose/plain-text output.
