name: bookings/create-class-service-bulk-create-response-shape
description: >-
  Verifies the class-creation recipe lets the agent read the created service's id
  and schedule id straight out of the Bulk Create Services bulk envelope, instead
  of reading a non-existent `results[0].item.service` and then re-querying the site
  to rediscover what the create call already returned.
triggerPrompt: >-
  Create a Fitness category in my Wix Bookings and add a Morning Yoga class to it,
  then tell me the new service's ID and its schedule ID.
tags: [bookings]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/bookings/skills/create-class-service
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user asked the agent to create a "Fitness" service category in Wix Bookings, add a
      "Morning Yoga" CLASS service to that category, and report the new service's ID and its
      schedule ID.
      Intent: the category and the class service are actually created, and both IDs are reported.

      Pass if the trace shows:
      - a successful (2xx) Create Category call for "Fitness", AND
      - a successful (2xx) Bulk Create Services call creating a `type: "CLASS"` service named
        "Morning Yoga" assigned to that category via `category.id`, AND
      - the final answer reports a service ID and a schedule ID for the created class.

      Fail if:
      - either create call errored (non-2xx), OR
      - the service was created with the wrong type or name, or was not assigned to the Fitness
        category, OR
      - the agent only described the steps without performing them, OR
      - the final answer omits the service ID or the schedule ID.

      Return ONLY {"score":<0-10>,"reason":"<one sentence>"}.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Judge ONLY how the agent obtained the created service's identifiers from the Bulk Create
      Services response (`POST /bookings/v2/bulk/services/create`). Ignore answer prose quality.

      That endpoint returns a bulk envelope:
      `{ results: [{ itemMetadata: { id, originalIndex, success }, item: <Service> }], bulkActionMetadata: {...} }`.
      `item` is the Service itself — there is no `item.service` — and `item` is present only when
      the request sends `returnEntity: true`. So `results[0].item.id` / `results[0].item.schedule.id`
      work only with that flag, and `results[0].itemMetadata.id` always carries the new service id.

      Pass if:
      - the agent's code read the identifiers from a valid path on the create response — either
        `results[0].itemMetadata.id`, or `results[0].item.…` with `returnEntity: true` sent in the
        same request body, AND
      - no API-execution step failed while reading that response, AND
      - after the create returned 2xx the agent did NOT issue an extra Query Services, Get Service
        or Query Categories call to rediscover the ID or schedule ID it had just been given.

      Fail if any of these appear:
      - code reading `results[0].item.service`, `results[0].service`, or a top-level `service`
        field from the bulk create response, OR
      - an execution error such as "Cannot read properties of undefined (reading 'service')" or any
        other undefined-property error while parsing the create response, even if the agent
        recovered afterwards, OR
      - reading `results[0].item.…` without `returnEntity: true` in the request body, OR
      - a follow-up Query Services / Get Service / Query Categories call issued after a 2xx create
        purely to recover the service ID or schedule ID, OR
      - the service being created a second time because the first response could not be parsed.

      Return ONLY {"score":<0-10>,"reason":"<terse description of the response path used and any wasted or failed call>"}.
  - type: llm_judge
    minScore: 3
    maxTokens: 2048
    prompt: >
      DIAGNOSTIC — rate how smoothly the Wix MCP let the agent create a class service and report its
      ids. Examine the tool-call trace. Score 0-10 (10 = direct: no wasted calls, no errors).
      Penalize and LIST any of: a non-2xx response even if recovered; a request or response shape
      guessed wrong then corrected; a Query/Get Categories or Services call made to rediscover an id
      the create response already returned; the category or the service being created more than
      once; a Site Properties or currency lookup, or an installed-apps check, before creating the
      service; the same fact searched for in the docs more than once. For each, name the likely
      MCP/docs gap.
      Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + suspected MCP/docs gap, or 'clean path' if none>"}.
siteSetup:
  mode: template
  templateId: bookings-editor
