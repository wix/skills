name: bookings/create-class-natural
description: >-
  Verifies that a natural class-creation request (no recipe named) routes to the class
  recipe and produces a CLASS service with the requested capacity and price — and that
  the agent is honest that the class is not bookable until sessions are scheduled.
triggerPrompt: >-
  Add a yoga class to my Wix site for $25, with room for 12 people.
tags: [bookings]
siteSetup:
  mode: template
  templateId: bookings-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/bookings/skills/create-class-service
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user asked to add a yoga class for $25 with room for 12 people.
      Intent: create one CLASS service via Wix Bookings Services V2 with the right
      capacity and price, and set correct expectations about session scheduling.
      Evaluate the final response and the Wix API calls made.

      Pass if the agent:
      - creates exactly one service with `type: "CLASS"`, AND
      - sets `defaultCapacity: 12`, AND
      - sets a fixed price of 25 (`payment.rateType: "FIXED"` with `fixed.price.value` "25" or "25.00"), AND
      - enables online booking, AND
      - EITHER successfully creates class session events on the service's schedule,
        OR clearly tells the user the class still needs sessions scheduled (dates/times)
        before customers can book it.

      Fail if the agent:
      - creates the service as APPOINTMENT or COURSE, OR
      - sends appointment-only fields for the class (e.g. relies on `staffMemberIds`
        or `sessionDurations` for the class's schedule), OR
      - claims the class is ready/bookable when no session events exist and no
        scheduling caveat is given, OR
      - reports success without a successful create call in the trace, OR
      - only explains how to do it instead of doing it.
  - type: llm_judge
    minScore: 7
    prompt: |
      Rate how smoothly the Wix MCP let the agent fulfill the request. Examine the
      tool-call trace. Score 0-10 (10 = direct: no wasted calls, no errors). Penalize
      and LIST any of: a non-2xx error even if recovered; a request-body shape guessed
      wrong then corrected; fields silently dropped by the API that the agent then had
      to re-do; redundant or probing calls clearer docs would avoid. Do not penalize a
      single post-create verification read. For each friction, name the likely
      recipe/docs/MCP gap.
      Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + suspected gap, or 'clean path' if none>"}.
