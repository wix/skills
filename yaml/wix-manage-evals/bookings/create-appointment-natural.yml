name: bookings/create-appointment-natural
description: >-
  Verifies that a natural service-creation request (no recipe named) routes to the
  appointment recipe and produces a correctly shaped APPOINTMENT service on a fresh
  bookings site: staff resourceId assigned, 60-minute duration, $75 fixed price.
triggerPrompt: >-
  Set up a 60-minute strategy consultation for $75 on my Wix site that customers
  can book online.
tags: [bookings]
maxTokens: 400000
siteSetup:
  mode: template
  templateId: bookings-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/bookings/skills/create-appointment-service
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user asked to set up a 60-minute strategy consultation for $75, bookable online.
      Intent: create one APPOINTMENT service via Wix Bookings Services V2 with correct
      staff assignment, duration, and pricing. Evaluate the final response and the Wix
      API calls made.

      Pass if the agent:
      - creates exactly one service with `type: "APPOINTMENT"` (a consultation is not a CLASS or COURSE), AND
      - includes `staffMemberIds` with a real staff `resourceId` obtained from a staff-members
        query on this site (not an invented ID, and not the staff member's `id`), AND
      - sets a 60-minute duration via `schedule.availabilityConstraints.sessionDurations`, AND
      - sets a fixed price of 75 (`payment.rateType: "FIXED"` with `fixed.price.value` "75" or "75.00"), AND
      - enables online booking (`onlineBooking.enabled: true`), AND
      - reports the created service back to the user based on a successful create response.

      Fail if the agent:
      - creates the service as CLASS or COURSE, OR
      - omits staff assignment or invents a staff/resource ID, OR
      - reports success without a successful create call in the trace, OR
      - creates more than one service, OR
      - only explains how to do it instead of doing it.
  - type: llm_judge
    minScore: 7
    prompt: |
      Rate how smoothly the Wix MCP let the agent fulfill the request. Examine the
      tool-call trace. Score 0-10 (10 = direct: no wasted calls, no errors). Penalize
      and LIST any of: a non-2xx error even if recovered; a request-body shape guessed
      wrong then corrected (e.g. wrong staff ID field, wrong payment structure);
      redundant or probing calls clearer docs would avoid; re-reading the same doc
      repeatedly. Do not penalize one staff-members query or one post-create
      verification read. For each friction, name the likely recipe/docs/MCP gap.
      Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + suspected gap, or 'clean path' if none>"}.
