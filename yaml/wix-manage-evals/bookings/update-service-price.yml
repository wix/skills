name: bookings/update-service-price
description: >-
  Verifies the update flow of the create-and-update recipe on a seeded service: fetch the
  service for its revision, PATCH with revision inside the service object and a complete
  payment object, and end with the price actually changed.
triggerPrompt: >-
  Change the price of my "Pilates Class" service to $35.
tags: [bookings]
siteSetup:
  mode: template
  templateId: bookings-editor
  bootstrap:
    steps:
      - label: seed a class service to update
        method: post
        url: https://www.wixapis.com/bookings/v2/bulk/services/create
        body:
          services:
            - name: Pilates Class
              type: CLASS
              onlineBooking:
                enabled: true
              defaultCapacity: 10
              payment:
                rateType: FIXED
                options:
                  online: true
                  inPerson: false
                fixed:
                  price:
                    value: "30"
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/bookings/skills/create-and-update-booking-services
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user asked to change the price of their existing "Pilates Class" service to $35.
      Intent: locate the existing service and update its price — not create anything new.
      Evaluate the final response and the Wix API calls made.

      Pass if the agent:
      - finds the existing "Pilates Class" service by querying/reading services (not by
        inventing an ID), AND
      - updates that service so its fixed price value ends up as "35" or "35.00", via an
        update/PATCH call that succeeded (2xx) — using the service's current revision, AND
      - leaves the service as the same single service (same name and type), AND
      - reports the change based on the successful update response.

      Fail if the agent:
      - creates a new service, or deletes and recreates the service, OR
      - changes anything the user didn't ask for (name, type, capacity, currency to a
        different currency), OR
      - reports the price as changed without a successful update call in the trace, OR
      - only explains how to do it instead of doing it.
  - type: llm_judge
    minScore: 7
    prompt: |
      Rate how smoothly the Wix MCP let the agent fulfill the request. Examine the
      tool-call trace. Score 0-10 (10 = direct: one lookup, one read for revision if
      needed, one successful PATCH). Penalize and LIST any of: a non-2xx error even if
      recovered (e.g. a PATCH rejected for a missing revision, revision placed outside
      the service object, or an incomplete payment object); a request-body shape guessed
      wrong then corrected; redundant or probing calls clearer docs would avoid. For
      each friction, name the likely recipe/docs/MCP gap.
      Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + suspected gap, or 'clean path' if none>"}.
