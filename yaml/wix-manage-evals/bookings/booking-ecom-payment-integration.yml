name: bookings/booking-ecom-payment-integration
description: >-
  Verifies the agent reads the end-to-end booking flow reference and explains how a site
  owner settles a paid booking server-side through Wix eCommerce: the booking is a Cart V2
  catalog item, the operator places the order with a price-verification token instead of
  sending anyone to a checkout page, and the order is what moves the booking from CREATED
  to CONFIRMED. Complements end-to-end-booking-flow.yml, which covers the customer-pays path.
triggerPrompt: >-
  I'm booking clients in from my own back-office tool using my site's API key. I've already
  created the appointment booking for a paid service, and the client has given me their card
  details over the phone, so nobody is going to visit a checkout page. Right now the booking
  shows status CREATED and isn't on my calendar. What is the exact sequence of REST calls to
  settle it so it ends up confirmed and paid? Written instructions only, no live API call.
tags: [bookings]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/bookings/skills/end-to-end-booking-flow
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      A site owner has a `CREATED` booking for a paid service and wants to settle it from their
      own backend, with no customer-facing payment page. Evaluate both the final response and
      any Wix API/tool calls made.
      Intent: give the operator-side Cart V2 sequence (cart -> calculate -> place-order) and
      explain that the eCommerce order, not a manual confirm, is what confirms an online-paid
      booking.

      Pass if the response:
      - explains that `CREATED` means the booking is not confirmed and not on the calendar until
        it is settled, AND
      - creates a cart via `POST /ecom/v2/carts` with `catalogItems`, using the booking ID as
        `catalogItemId` and the Wix Bookings appId (`13d21c63-b5ec-5912-8397-c3a5ddb27a97`) in the
        `catalogReference`, AND
      - calculates the cart (`POST /ecom/v2/carts/{cartId}/calculate`) to obtain
        `priceVerificationToken`, then calls `POST /ecom/v2/carts/{cartId}/place-order` with that
        token, AND
      - states that the booking becomes `CONFIRMED` as a result of the order (the operator does
        not call Confirm Booking for this path), AND
      - draws the boundary: `place-order` is for the owner settling server-side; a customer who
        pays themselves is sent to `get-checkout-url` instead, and a free or offline booking is
        settled with Confirm Booking directly.

      Fail if the response:
      - uses Checkout V1 (e.g. `/ecom/v1/checkouts`, a create-checkout step, `createOrder`, or
        `lineItems` instead of `catalogItems`), OR
      - tells the operator the only option is to send the customer a checkout URL, OR
      - tells the operator to call Confirm Booking for the online-paid booking before or instead
        of placing the order, or says the booking is `CONFIRMED` regardless of payment, OR
      - omits the calculate/`priceVerificationToken` step or the `place-order` call, OR
      - claims the Bookings API charges the card itself.
  - type: llm_judge
    minScore: 7
    prompt: |
      Rate how smoothly the Wix MCP let the agent answer. Examine the tool-call trace.
      Score 0-10 (10 = read the relevant doc(s) and answered; no failed or wasted calls).
      This is an instructions-only question about a multi-step flow, so reading several
      reference pages for the endpoints in that flow is expected and is NOT a friction.
      Penalize and LIST only: a live mutation (creating a booking, cart, checkout or order)
      for a question that asked for written instructions; a non-2xx error even if recovered;
      the same article read or the same search repeated with the same arguments. For each
      friction, name the likely recipe/docs/MCP gap.
      Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + suspected gap, or 'clean path' if none>"}.
