name: bookings/booking-ecom-payment-integration
description: >-
  Verifies the agent reads the end-to-end booking flow reference and gets the booking
  lifecycle right for a paid service: CREATED is unconfirmed and off the calendar, an
  online-paid booking is confirmed by the paid eCommerce order rather than by Confirm
  Booking, and Confirm Booking (with a payment status) is only for free, offline or
  custom-checkout payments. Complements end-to-end-booking-flow.yml, which covers the
  full discovery-to-payment sequence.
triggerPrompt: >-
  I created a booking through the Wix Bookings REST API for a paid appointment. The customer
  is going to pay online. The booking came back with status CREATED and it doesn't show on
  my booking calendar. Do I have to call Confirm Booking myself, and if not, what actually
  confirms it? Written REST instructions only, no live API call.
tags: [bookings]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/bookings/skills/end-to-end-booking-flow
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user has a `CREATED` booking for a paid service that the customer will pay online, and
      asks whether they must call Confirm Booking and what confirms the booking. Evaluate both
      the final response and any Wix API/tool calls made.
      Intent: explain the booking lifecycle correctly — the eCommerce order confirms an
      online-paid booking; Confirm Booking is for the cases where no eCommerce checkout happens.

      Pass if the response:
      - explains that `CREATED` means the booking is not yet confirmed and not on the calendar,
        and that this is expected before payment, AND
      - says NOT to call Confirm Booking for a booking the customer pays online through Wix
        eCommerce, AND
      - describes the eCommerce path that confirms it: a Cart V2 cart via `POST /ecom/v2/carts`
        with `catalogItems`, the booking ID as `catalogItemId` and the Wix Bookings appId
        (`13d21c63-b5ec-5912-8397-c3a5ddb27a97`) in the `catalogReference`, then
        `POST /ecom/v2/carts/{cartId}/get-checkout-url` for the customer to pay, AND
      - states that once the eCommerce order is paid the booking becomes `CONFIRMED` (or `PENDING`
        when the service requires manual approval) automatically, AND
      - reserves Confirm Booking / Confirm Or Decline Booking (with a `paymentStatus` such as
        `EXEMPT`, `NOT_PAID` or `PAID`) for bookings that are not paid through Wix eCommerce
        checkout — free, offline, or payment the owner collected outside Wix.

      Fail if the response:
      - says the booking is `CONFIRMED` regardless of payment, or that it must be `CONFIRMED`
        before checkout, OR
      - tells the user to call Confirm Booking for the online-paid booking before or instead of
        the eCommerce checkout, OR
      - uses Checkout V1 (e.g. `/ecom/v1/checkouts`, a create-checkout step, `createOrder`, or
        `lineItems` instead of `catalogItems`) as the payment path, OR
      - claims the Bookings API charges the customer itself, OR
      - never explains what moves the booking out of `CREATED`.
  - type: llm_judge
    minScore: 7
    prompt: |
      Rate how smoothly the Wix MCP let the agent answer. Examine the tool-call trace.
      Score 0-10 (10 = read the relevant doc(s) and answered; no failed or wasted calls).
      This is an instructions-only question about a multi-step flow, so reading several
      reference pages for the endpoints in that flow is expected and is NOT a friction.
      Penalize and LIST only: a live mutation (creating a booking, cart, checkout or order)
      for a question that asked for written instructions; a non-2xx error even if recovered;
      the same article read or the same search repeated with the same arguments. For each
      friction, name the likely recipe/docs/MCP gap.
      Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + suspected gap, or 'clean path' if none>"}.
