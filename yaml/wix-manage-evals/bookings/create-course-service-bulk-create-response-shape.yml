name: bookings/create-course-service-bulk-create-response-shape
description: >-
  Verifies the course-creation recipes let the agent read the created service's id
  and schedule id straight out of the Bulk Create Services bulk envelope, so the
  follow-up Calendar Events call can be made without re-querying the site for a
  schedule id the create response already returned.
triggerPrompt: >-
  Create a 6 week "Intro to Pottery" course in my Wix Bookings, with weekly online
  sessions on Mondays at 18:00 starting next Monday, capacity 8, priced at $240 for
  the whole course. When it is set up, tell me the course's service ID and the
  schedule ID its sessions were created on.
tags: [bookings]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/bookings/skills/create-course-service
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user asked the agent to create a 6-week "Intro to Pottery" COURSE service in Wix
      Bookings with weekly online sessions, capacity 8, priced $240 for the course, and to report
      the service ID and the schedule ID the sessions were created on.
      Intent: a real course service exists, its sessions exist as Calendar events, and both IDs
      are reported.

      Pass if the trace shows:
      - a successful (2xx) Bulk Create Services call creating a `type: "COURSE"` service named
        "Intro to Pottery" with `defaultCapacity: 8`, AND
      - a successful (2xx) Calendar Events call creating the course sessions, AND
      - the final answer reports both a service ID and a schedule ID.

      Fail if:
      - the create call errored (non-2xx), OR
      - the sessions were passed as nested `course.sessions` / `CourseSession` data on the service
        payload instead of being created as Calendar events, OR
      - no Calendar events were created at all, OR
      - the agent only described the steps without performing them, OR
      - the final answer omits the service ID or the schedule ID.

      Return ONLY {"score":<0-10>,"reason":"<one sentence>"}.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Judge ONLY how the agent obtained the created service's identifiers from the Bulk Create
      Services response (`POST /bookings/v2/bulk/services/create`). Ignore answer prose quality.

      That endpoint returns a bulk envelope:
      `{ results: [{ itemMetadata: { id, originalIndex, success }, item: <Service> }], bulkActionMetadata: {...} }`.
      `item` is the Service itself — there is no `item.service` — and `item` is present only when
      the request sends `returnEntity: true`. The schedule id lives on the Service, at
      `results[0].item.schedule.id`, so it is reachable only with that flag;
      `results[0].itemMetadata.id` always carries the new service id.

      Pass if:
      - the agent's code read the service id from a valid path on the create response — either
        `results[0].itemMetadata.id`, or `results[0].item.id` with `returnEntity: true` sent in the
        same request body, AND
      - the schedule id came from `results[0].item.schedule.id` on that same create response, AND
      - no API-execution step failed while reading that response, AND
      - after the create returned 2xx the agent did NOT issue an extra Query Services, Get Service
        or Query Schedules call to rediscover the service id or the schedule id it had just been
        given.

      Fail if any of these appear:
      - code reading `results[0].item.service`, `results[0].service`, or a top-level `service`
        field from the bulk create response, OR
      - an execution error such as "Cannot read properties of undefined (reading 'service')" or any
        other undefined-property error while parsing the create response, even if the agent
        recovered afterwards, OR
      - reading `results[0].item.…` without `returnEntity: true` in the request body, OR
      - a follow-up Query Services / Get Service / Query Schedules call issued after a 2xx create
        purely to recover the service id or the schedule id, OR
      - the service being created a second time because the first response could not be parsed.

      Return ONLY {"score":<0-10>,"reason":"<terse description of the response path used and any wasted or failed call>"}.
siteSetup:
  mode: template
  templateId: bookings-editor
