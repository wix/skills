name: bookings/end-to-end-booking-flow
description: >-
  Verifies the agent reads the end-to-end booking flow reference and describes the full
  REST flow, using the Cart V2 create-cart step for online-payment bookings.
triggerPrompt: >-
  Walk me through implementing a complete booking experience end to end with the Wix REST APIs,
  from finding services to taking payment for an online-paid appointment. Written REST instructions
  only, no live API call.
tags: [bookings]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/bookings/skills/end-to-end-booking-flow
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user asked for a complete end-to-end booking flow, including payment for an online-paid
      appointment. Evaluate both the final response and any Wix API/tool calls made.
      Intent: describe the full flow (query services -> availability -> create booking -> confirm or pay)
      using the correct Cart V2 flow for online payments.

      Pass if the response:
      - queries services and checks availability with Time Slots V2 (not the deprecated availability calendar), AND
      - creates a booking with the appointment `slot` structure and notes the booking starts as `CREATED`, AND
      - for free/offline bookings confirms directly, and for online payments creates a cart via
        `POST /ecom/v2/carts` with `catalogItems` using the booking ID as `catalogItemId`, AND
      - has the customer pay by calling `POST /ecom/v2/carts/{cartId}/get-checkout-url` and sending
        them to the returned `checkoutUrl`, AND
      - notes the booking is auto-confirmed once the eCommerce order is paid.

      A response may additionally mention the calculate + `POST /ecom/v2/carts/{cartId}/place-order`
      path, but only as a server-side alternative for an operator settling the booking without a
      payment page — not as the way a customer pays.

      Fail if the response:
      - uses Checkout V1 for the payment step (e.g. `/ecom/v1/checkouts`, a create-checkout call,
        `createOrder`, or `lineItems` instead of `catalogItems`), OR
      - uses the deprecated availability query instead of Time Slots V2, OR
      - presents `place-order` as how the customer pays, or tells the user to call Confirm Booking
        before or instead of eCommerce checkout for an online-paid booking, OR
      - omits the create-booking step, the create-cart step, or the checkout URL step.
  - type: llm_judge
    minScore: 7
    prompt: |
      Rate how smoothly the Wix MCP let the agent answer. Examine the tool-call trace.
      Score 0-10 (10 = read the relevant doc(s) and answered; no failed or wasted calls).
      This is an instructions-only question about a multi-step flow, so reading several
      reference pages for the endpoints in that flow is expected and is NOT a friction.
      Penalize and LIST only: a live mutation (creating a booking, cart, checkout or order)
      for a question that asked for written instructions; a non-2xx error even if recovered;
      the same article read or the same search repeated with the same arguments. For each
      friction, name the likely recipe/docs/MCP gap.
      Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + suspected gap, or 'clean path' if none>"}.
