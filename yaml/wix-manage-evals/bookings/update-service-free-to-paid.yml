name: bookings/update-service-free-to-paid
description: >-
  Verifies the update flow of the create-and-update recipe on the free-to-paid
  conversion — the case where the recipe carries knowledge raw method docs don't:
  a NO_FEE service becomes paid only by sending rateType FIXED together with the
  complete payment object (options + fixed.price) and the current revision in one
  update. Replaces an earlier plain price-change scenario that agents solved
  without the recipe.
triggerPrompt: >-
  My "Pilates Class" on my Wix site is currently free — start charging $35 for it.
tags: [bookings]
siteSetup:
  mode: template
  templateId: bookings-editor
  bootstrap:
    steps:
      - label: seed a free class service to convert
        method: post
        url: https://www.wixapis.com/bookings/v2/bulk/services/create
        body:
          services:
            - name: Pilates Class
              type: CLASS
              onlineBooking:
                enabled: true
              defaultCapacity: 10
              payment:
                rateType: NO_FEE
                options:
                  online: false
                  inPerson: true
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/bookings/skills/create-and-update-booking-services
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user's free "Pilates Class" service must start charging $35.
      Intent: convert the existing NO_FEE service to a FIXED-price service at $35 —
      update, not recreate. Examine the tool-call trace, including request bodies
      and any error bodies.

      Pass if the agent:
      - finds the existing "Pilates Class" service by querying/reading services
        (not by inventing an ID), AND
      - updates THAT service so its payment ends as `rateType: "FIXED"` with
        `fixed.price.value` "35" or "35.00", via a successful (2xx) update that
        used the service's current revision, AND
      - keeps it the same single service (same name, type CLASS, capacity), AND
      - reports the change based on the successful update response.

      Fail if the agent:
      - creates a new service, or deletes and recreates the service, OR
      - leaves the service NO_FEE (e.g. only sets a price without changing
        rateType) or reports success without a successful update in the trace, OR
      - changes anything the user didn't ask for (name, type, capacity), OR
      - only explains how to do it instead of doing it.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Rate how smoothly the Wix MCP let the agent convert the free service to paid.
      Examine the tool-call trace, including request bodies and any error bodies.
      Score 0-10 (10 = direct: one lookup, one read for revision if needed, one
      successful update). Reading the recipe is expected and never a wasted call.

      HEAVY penalties (each costs 2-3 points):
      - an update sent with only `fixed.price` (without `rateType: "FIXED"` and
        `options` in the same complete payment object) — this fails with
        `Validation failed: payment.type Payment type must be set to FIXED, ...
        payment.options It is mandatory to specify either payment.options.online
        or payment.options.inPerson as true`; the recipe states the free-to-paid
        rule explicitly, so hitting this error means the recipe was not applied
      - an update rejected for a missing/stale `revision`, or `revision` placed
        outside the `service` object
      - duplicate update (same service updated more than once), or claimed
        success without a successful update in the trace

      LIGHT penalties (each costs at most 1 point):
      - a request-body shape guessed wrong then corrected (other than the payment
        cases above)
      - redundant or probing calls clearer docs would avoid

      Do not penalize a single post-update verification read. For each friction,
      name the likely cause: recipe, MCP, or docs gap. A clean-but-slow path that
      hits only light penalties should still score 7+.
      Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + suspected gap, or 'clean path' if none>"}.
