name: domains/domain-connect
description: >-
  Verifies the agent reads the domain-search-and-purchase recipe when a user
  wants to connect an existing domain to their Wix site, checks the site's
  premium status, and routes them to the correct connect URL or upgrade page.
triggerPrompt: >-
  I already have mybakery.com registered somewhere else. How do I connect it to my Wix site?
tags: [domains]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/account-level/domains/skills/domain-search-and-purchase
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user already owns mybakery.com and wants to connect it to their Wix site.
      Intent: check whether the site has a premium plan and either give a connect link or explain they need to upgrade.

      Pass if the response:
      - recognizes this as a connect request (not a purchase), AND
      - either provides a direct connect link (for premium sites) or clearly explains that connecting
        requires a premium plan and offers an upgrade link, AND
      - does not mention API names, endpoint paths, error codes, tool names, or technical internals.

      Fail if the response:
      - tries to guide the user through a domain purchase flow instead of a connect flow, OR
      - exposes any technical implementation detail to the user, OR
      - gives a connect link without accounting for whether the site has a premium plan.
