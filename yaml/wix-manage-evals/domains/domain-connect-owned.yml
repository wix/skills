name: domains/domain-connect-owned
description: >-
  Verifies the agent reads the domain-search-and-purchase recipe when the user
  already owns a domain, treats it as a connect rather than a purchase, and
  gates the connection on the site's Premium plan.
triggerPrompt: >-
  I already have mybakery.com registered somewhere else. How do I connect it to my Wix site?
tags: [domains]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/account-level/domains/skills/domain-search-and-purchase
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user already owns mybakery.com and wants it on their Wix site. Their request: "I already have mybakery.com registered somewhere else. How do I connect it to my Wix site?"

      Per Part C of the recipe this is the connect path: the site's plan decides the outcome. A Premium
      site gets a dashboard connect link; a Free site gets the connect link plus an upgrade block,
      because connecting a domain is a Premium feature.

      Pass if the response:
      - treats this as connecting a domain the user already owns, not as a purchase, AND
      - either gives a manage.wix.com connect link for a Premium site, or explains that connecting
        requires a Premium plan and offers an upgrade link, AND
      - accounts for the site's plan rather than handing over a connect link unconditionally.

      Fail if the response:
      - walks the user through buying a domain, or offers alternative domains to register instead, OR
      - narrates internal mechanics — API or tool names, endpoint paths, error codes, or premium-status
        field names, OR
      - invents a dashboard URL, or promises the domain will be connected automatically once they upgrade.
