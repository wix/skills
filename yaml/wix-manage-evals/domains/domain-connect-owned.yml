name: domains/domain-connect-owned
description: >-
  Verifies the agent reads the domain-search-and-purchase recipe when the user already owns a domain,
  treats it as a connect rather than a purchase, and resolves the target site per Part C Case B —
  asking which site when the account holds several, without handing over a connect link first.
triggerPrompt: >-
  I need a domain for my Wix site — I already have mybakery.com registered somewhere else.
tags: [domains]
maxTokens: 600000
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/account-level/domains/skills/domain-search-and-purchase
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user already owns mybakery.com and wants it on their Wix site. Their request: "I need a domain for my Wix site — I already have mybakery.com registered somewhere else."

      Per Part C of the recipe this is the connect path, and the request names no site. Case B of §C1
      applies: with several sites on the account, the agent lists them and asks which one. Connecting
      is gated on that site's Premium plan, so the plan-specific answer — connect link, or connect link
      plus upgrade block — can only come after a site is chosen. Every connect URL embeds a siteId, so
      §C1 forbids putting one in the question itself.

      Pass if the response:
      - reads this as connecting a domain the user already owns, not as a purchase, AND
      - asks which site to connect it to, presenting the sites on the account, rather than answering
        for a site it never established, AND
      - puts no site-specific connect URL in that message.

      Fail if the response:
      - hands over a dashboard connect link, or a link with a site placeholder in it, before a site has
        been chosen, OR
      - walks the user through buying a domain, or offers alternative domains to register instead, OR
      - narrates internal mechanics — API or tool names, endpoint paths, error codes, or
        premium-status field names, OR
      - claims a plan outcome for a site it never identified.
