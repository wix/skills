name: domains/domain-purchase
description: >-
  Verifies the agent reads the domain-search-and-purchase recipe when a user
  wants to buy a domain, checks availability, and guides them through the
  purchase flow without exposing technical internals.
triggerPrompt: >-
  I want to buy mybakery.com for my Wix site.
tags: [domains]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/account-level/domains/skills/domain-search-and-purchase
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user wants to purchase mybakery.com for their Wix site.
      Intent: check availability, guide through registration details, and provide a checkout link.

      Pass if the response:
      - checks whether mybakery.com is available and tells the user the result in plain language, AND
      - either proceeds toward purchase (pricing, privacy, contact info) or offers alternatives if taken, AND
      - does not mention API names, endpoint paths, error codes, tool names, cart operations, or any
        phrase like "let me retry", "calling the API", "the request failed", or "adding line items".

      Fail if the response:
      - exposes any technical implementation detail to the user, OR
      - stops after checking availability without guiding the user to the next step, OR
      - invents domain availability information without checking.
