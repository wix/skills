name: domains/domain-redirect-bind-wording
description: >-
  Verifies that after a successful REDIRECT bind, the agent's success line does not assert the
  redirect is already live — the bind response gives no signal about DNS/CDN propagation, so the
  response must describe the request's outcome, not a live-traffic fact.
triggerPrompt: >-
  I already own example.org — can you set it up to redirect to my Wix site?
tags: [domains]
maxTokens: 800000
siteSetup:
  templateId: blank-editor
  bootstrap:
    steps:
      - label: seed an already-owned domain that isn't connected to any site yet
        method: post
        url: https://www.wixapis.com/domains/v1/connected-domains
        body:
          connectedDomain:
            domain: example.org
            connectionType: POINTING
            suppressNotifications: true
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/account-level/domains/skills/domain-search-purchase-and-connect-a-domain
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user asked to redirect a domain they already own to their Wix site: "I already own
      example.org — can you set it up to redirect to my Wix site?" The domain is genuinely already
      registered and already known to the user's account, just not yet assigned to any site — the
      agent's job is to bind it as a redirect to the current site.

      Per §C3.4 of the recipe, a successful REDIRECT bind is confirmed only by a 2xx from the bind
      call — its response shape is unverified and carries no field the agent may read. The recipe
      explicitly forbids stating anything about timing, propagation, SSL or DNS after a bind (§C7),
      because none of that is known at that point. The success line must therefore report that the
      redirect was set up / requested, not that it is already live or already serving traffic —
      those are two different claims, and only the first one is something the bind response
      supports.

      Pass if the response, after the bind succeeds:
      - confirms the domain is set to redirect / configured to redirect to the primary domain, using
        language that does not assert the redirect is already live or already serving visitors, AND
      - names the primary domain it now points to, AND
      - says nothing about DNS, propagation, SSL, certificates, or a timeframe.

      Fail if the response:
      - states or implies the redirect is already live, already working, or already serving traffic
        right now (e.g. "now redirects to", "is already redirecting", "visitors are now sent to"),
        OR
      - promises or denies any timing/propagation/DNS/SSL detail, OR
      - narrates internal mechanics — API or tool names, endpoint paths, or response field names.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: >
      Rate how smoothly the Wix MCP let the agent fulfill the request. Examine
      the tool-call trace. Score 0-10 (10 = direct: no wasted calls, no errors). Penalize and LIST
      any of: a non-2xx error even if recovered; reading a field out of the bind response instead of
      treating any 2xx as success; asking the primary-or-redirect question when the user already
      said "redirect"; redundant or probing calls clearer docs would avoid. For each, name
      the likely MCP/docs gap.
      Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + suspected MCP/docs gap, or 'clean path' if none>"}.
