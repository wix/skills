name: domains/domain-redirect-bind-wording
description: >-
  Verifies that the agent never asserts a REDIRECT bind is already live before it has actually
  succeeded — the bind response gives no signal about DNS/CDN propagation, so any claimed outcome
  must describe the request's result, not a live-traffic fact, at whatever point the conversation
  actually reaches.
triggerPrompt: >-
  I already own example.org — can you set it up to redirect to my Wix site?
tags: [domains]
maxTokens: 800000
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/account-level/domains/skills/domain-search-purchase-and-connect-a-domain
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user asked to redirect a domain they say they already own to their Wix site: "I already own
      example.org — can you set it up to redirect to my Wix site?"

      Per the recipe, a claimed domain is never taken on the user's word — the agent resolves real
      ownership first (an availability check, then an account-asset lookup), and only offers a bind once
      that ownership is actually confirmed against the account. example.org may not resolve to anything
      this account owns, in which case the correct outcome is a link/next-step answer, not a bind — and
      that is a legitimate, passing outcome here, not a wrong turn.

      Per §C3.4 of the recipe, a successful REDIRECT bind is confirmed only by a 2xx from the bind call —
      its response shape is unverified and carries no field the agent may read. The recipe explicitly
      forbids stating anything about timing, propagation, SSL or DNS after a bind (§C7), because none of
      that is known at that point. Wherever the conversation actually ends up, the response must never
      claim a redirect is already live/serving traffic unless a bind call actually returned success in
      this same conversation.

      Pass if the response:
      - resolves ownership before offering to bind (asks a clarifying question, explains that the domain
        isn't recognized as the account's, or gives connection instructions) when ownership isn't
        confirmed, OR
      - if a bind did succeed, confirms the domain is set to redirect / configured to redirect to the
        primary domain, using language that does not assert the redirect is already live, names the
        primary domain, and says nothing about DNS, propagation, SSL, certificates, or a timeframe.

      Fail if the response, at any point:
      - states or implies a redirect is already live, already working, or already serving traffic right
        now (e.g. "now redirects to", "is already redirecting", "visitors are now sent to") without a
        bind call in this conversation having actually succeeded, OR
      - promises or denies any timing/propagation/DNS/SSL detail for a bind that hasn't happened, OR
      - narrates internal mechanics — API or tool names, endpoint paths, or response field names.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: >
      Rate how smoothly the Wix MCP let the agent fulfill the request. Examine
      the tool-call trace. Score 0-10 (10 = direct: no wasted calls, no errors). Penalize and LIST
      any of: a non-2xx error even if recovered; reading a field out of the bind response instead of
      treating any 2xx as success; asking the primary-or-redirect question when the user already
      said "redirect"; redundant or probing calls clearer docs would avoid. For each, name
      the likely MCP/docs gap.
      Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + suspected MCP/docs gap, or 'clean path' if none>"}.
