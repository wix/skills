name: domains/domain-buy-flow
description: >-
  Verifies the agent reads the domain-search-purchase-and-connect recipe on a buy
  request, reports availability in plain language, and carries on into the
  purchase path instead of stopping at the availability answer.
triggerPrompt: >-
  I want to buy bestbakery-in-tel-aviv.com for my Wix site.
tags: [domains]
maxTokens: 800000
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/account-level/domains/skills/domain-search-purchase-and-connect-a-domain
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user asked to buy bestbakery-in-tel-aviv.com for their Wix site. Their request: "I want to buy bestbakery-in-tel-aviv.com for my Wix site."

      Per Part A of the recipe, the availability check runs silently and the result is stated plainly;
      per Part P the conversation then continues toward the purchase (site and plan outcome, registration
      period, contact details, checkout) rather than ending on the availability answer.

      Pass if the response:
      - asks which site to connect it to, presenting the sites on the account, rather than answering
        for a site it never established, OR
      - states whether bestbakery-in-tel-aviv.com is available in plain language, AND
      - asks if user wants to connect the domain to one of user's sites OR 
      - proposes the user to choose between connect it to Wix site (with showing the list of sites) or to purchase it standalone

      Fail if the response:
      - narrates internal mechanics to the user — API or tool names, endpoint paths, error codes, cart
        or line-item operations, or filler like "let me check", "one moment", "the request failed", OR
      - stops after answering availability without a next step, OR
      - asserts availability or a price it never retrieved.
