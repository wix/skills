# yaml/wix-manage-evals/quarantine.yaml
#
# Scenarios listed here are excluded from gating unrelated PRs: when a PR pulls a
# scenario in only because it covers a changed skill doc, quarantined scenarios are
# skipped. A PR that edits a quarantined scenario's own YAML still runs it.
#
# Quarantine is for flaky scenarios awaiting a rewrite — a scenario that alternates
# pass/fail on unchanged content. Add an entry with the reason (and evidence: run IDs
# or dashboard trend); remove the entry when the scenario is rewritten.
scenarios: []
