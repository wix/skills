name: accessibility/scan-site-accessibility
description: >-
  Verifies that the agent discovers the site's supported page collections, runs one asynchronous
  accessibility scan for all product pages, polls it correctly, and returns actionable results
  without treating failed pages as clean.
triggerPrompt: >-
  Scan all product pages on my Wix site for accessibility issues. Tell me which pages failed,
  prioritize the critical issues, and explain what I can fix.
tags: [aria, stores]
# Intentionally no top-level token cap: this live scenario includes asynchronous
# scan polling and paginated result retrieval.
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/site/accessibility/skills/scan-a-wix-site-for-accessibility-issues
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user asked to scan every Wix Stores product page, identify failed pages, prioritize
      critical accessibility issues, and explain fixes.

      Pass if the agent:
      - discovers supported page collections and uses the returned product collection ID unchanged,
      - creates one scan with a fresh idempotency key, then polls its returned scan ID using the
        suggested interval until a terminal state,
      - on COMPLETED or PARTIALLY_COMPLETED, reads paginated page summaries and findings,
      - distinguishes pages that failed to scan from pages that completed with zero findings, and
      - presents prioritized findings with page/element identity and fix/verification guidance,
        asking for human input when the result requires it.

      Fail if the agent hardcodes a product collection ID without discovery, launches one scan per
      product page, starts duplicate scans while one is active or its state is unknown, reports a
      failed page as clean, or claims it changed the site through the scan API. If starting the scan
      returns 403 or PERMISSION_DENIED, require the agent to stop after that first run attempt and
      clearly identify the missing Manage Accessibility Scans authorization; do not reward retries
      with alternate URLs, request shapes, targets, or sites.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Rate how smoothly the Wix MCP let the agent fulfill the accessibility-scan request. Examine
      the tool-call trace. Score 0-10 (10 = direct: collection discovery, one run, disciplined
      polling, then paginated results with no wasted calls or errors). Penalize and list any guessed
      collection ID or request shape, duplicate run, unnecessary page-by-page findings queries,
      polling faster than the suggested interval, ignored failed-page state, recovered non-2xx
      error, or redundant probing call. For each problem, name the likely skill, MCP, or docs gap.
      Return ONLY {"score":<0-10>,"reason":"<terse list of frictions and suspected gap, or 'clean path' if none>"}.
siteSetup:
  mode: template
  templateId: stores-v3-editor
  bootstrap:
    steps:
      - label: seed product page for scanning
        method: post
        url: https://www.wixapis.com/stores/v3/products
        body:
          product:
            name: Accessibility Scan Test Product
            productType: PHYSICAL
            physicalProperties: {}
            variantsInfo:
              variants:
                - price: { actualPrice: { amount: "19.50" } }
                  physicalProperties: {}
                  visible: true
