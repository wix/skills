name: get-paid/how-to-setup-wix-payments
description: >-
  Verifies the agent reads the how-to-setup-wix-payments skill and connects a
  Wix Payments account against the correct endpoint after collecting the
  required inputs, checking country support, and getting explicit consent.
  Fresh site on purpose: the shared site may already have Payments connected
  (the recipe's "payments already connected" HTTP 500), which would invalidate
  the not-yet-connected premise.
triggerPrompt: I want to start accepting payments on my Wix site. Can you connect Wix Payments for me?
tags: [get-paid]
siteSetup:
  mode: template
  templateId: blank-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/get-paid/skills/how-to-setup-wix-payments
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user's request: "I want to start accepting payments on my Wix site. Can you connect Wix Payments for me?"
      Intent: connect a Wix Payments account for the site using the how-to-setup-wix-payments skill.

      Pass if the response:
      - determines the site's country (reading it from Site Properties or asking the user) and confirms it is on the recipe's supported self-serve list before any connect call — for an unsupported country it must stop and point the user to the dashboard instead of connecting, AND
      - if the country is supported, asks for (or confirms it has) the site owner's first name, last name, a product/service description, and terms-of-service acceptance before calling connect (a run that correctly stopped on an unsupported country does not need to collect these), AND
      - if it states the connect endpoint, uses `POST https://www.wixapis.com/payments/v1/wix-payments-account/connect`, AND
      - obtains or explicitly asks for the user's consent before making the mutating connect call.

      Fail if the response:
      - fabricates the user's name/business details instead of asking, OR
      - proceeds to connect (or presents connect as the immediate next step) without ever checking whether the site's country supports self-serve connect, OR
      - calls or states the connect endpoint with a different path (e.g. `/payments/mcp/v1/wix-payments-account/connect`), OR
      - connects without any indication of explicit user consent.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Rate how smoothly the Wix MCP let the agent handle this request. Examine
      the tool-call trace. Score 0-10 (10 = direct: read the recipe, one Site
      Properties read for the country, then a final answer collecting the
      missing inputs — no wasted calls, no errors).

      Penalize and LIST any of:
      - a mutating call (the connect endpoint or any other write) — score 0-3:
        the user never supplied the required details or consent
      - a non-2xx error, even if recovered — score at most 5
      - a request body or endpoint guessed wrong then corrected — score at most 5
      - repeated doc/spec searches for facts the recipe already states (the
        Site Properties endpoint, the country list, the connect endpoint) —
        minor deduction: one or two redundant reads land at 7-8, a longer
        probing spiral lower

      For each friction, name the likely MCP/docs gap. Return ONLY
      {"score":<0-10>,"reason":"<terse list of frictions, or 'clean path'>"}
