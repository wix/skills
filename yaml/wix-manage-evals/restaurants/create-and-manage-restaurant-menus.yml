name: restaurants/create-and-manage-restaurant-menus
description: Verifies that the agent loads the restaurant menu management skill and can explain menu operations.
triggerPrompt: How do I manage menus in Wix Restaurants? Please explain everything and use the appropriate APIs.
tags: [restaurants]
siteSetup:
  mode: template
  templateId: restaurants-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/restaurants/skills/create-and-manage-restaurant-menus
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Pass if the agent gives a useful answer about managing restaurant menus.
      The response should mention menus and at least one relevant operation or API.
      Fail only if the response is unrelated to Wix Restaurants.
