name: google-ads/manage-campaign-success-guide
description: >-
  Verifies the agent retrieves the campaign success guide immediately when a
  user requests it after campaign creation and presents an actionable
  three-item batch without waiting for metrics or routing to pre-campaign
  suggestions.
triggerPrompt: >-
  I just created my Google Ads lead campaign on my Wix site (MSID:
  b342a30b-616e-40ce-ad26-52a83397e08e), and it's still learning, so I don't
  see any results yet. Show me its campaign success guide and tell me what to
  improve next.
tags: [marketing]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/marketing/ads/google-ads/skills/manage-a-campaign-success-guide
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Pass if the response:
      - treats the direct request as approval, identifies the campaign on site
        b342a30b-616e-40ce-ad26-52a83397e08e, and successfully retrieves or
        creates its campaign success guide with platformType GOOGLE;
      - if campaign resolution requires a list call, uses GET
        https://www.wixapis.com/_serverless/pa-google/v1/campaigns at most once;
      - presents the returned suggestions as prioritized, actionable
        improvements on this first response and does not wait for LEARNING to
        end, for performance metrics, or for the user to request links or a
        richer format;
      - presents the first three OPEN suggestions when at least three exist,
        or all OPEN suggestions when fewer exist, in a single-column action
        plan. It preserves their relative API order, does not semantically
        regroup them by theme or destination, and does not expose or name a
        later-batch suggestion. If more OPEN suggestions remain, it says this
        batch contains the highest-priority remaining tasks and invites the
        user to see the next batch;
      - hides COMPLETED suggestions and tracking-status labels, and creates no
        offer or destination from a completed or later-batch item;
      - links the analyzed landing page when the guide returns its URL, makes
        one grouped offer when visible OPEN items have supported agent work,
        and, when destinations appropriate for the visible batch exist,
        finishes with a Next actions block after the suggestions and offer that
        contains each destination once. If visible site-editing tasks exist, it
        uses the exact Editor URL when that URL is available from site context
        or one read-only site-metadata lookup. If it makes that lookup, it calls
        POST https://www.wixapis.com/site-list/v2/sites/query with
        query.filter.id.$in set to the one-element array containing
        b342a30b-616e-40ce-ad26-52a83397e08e and cursorPaging.limit set to 1;
        it does not use primitive equality for the id filter. A resolved CTA is
        a real absolute Markdown link with a destination-specific label, not a
        suggested follow-up message or generic "Open in Wix" action. If no
        suitable lookup is available or no exact URL is available after at
        most one attempt, it says "Go to the Editor" once as plain guidance
        instead of repeating links, guessing a URL, or continuing to probe;
      - if Search Themes is in the visible batch, offers to propose and apply
        an approved set for the user. It does not show a Keywords Manager link
        unless the user explicitly prefers the manual path;
      - if Google Business Profile is in the visible batch, offers to check and
        initiate the connection and explains that the site owner must finish
        Google's consent. It does not tell the user to perform supported
        connection work manually;
      - leaves recommendation labels and manual next steps as plain content. If
        it suggests a conversational follow-up, it offers at most one supported
        task and phrases it as explicit delegation rather than as a bare task
        label;
      - identifies it as a guide for improving the existing campaign rather than
        generating a new campaign's inputs; and
      - does not query analytics before retrieving the guide or change any guide
        status without a separate user request.

      Fail if it asks for redundant approval, does not retrieve the guide, uses
      a different site, receives a non-2xx response, tells the user to wait for
      metrics, queries analytics first, returns a bare list, uses a table/grid/
      multi-column layout, semantically reorders or regroups recommendations,
      turns task labels into pseudo-links or suggested messages, shows more or
      fewer than the first three OPEN suggestions when at least three exist,
      exposes completed items, names a later-batch item, omits the next-batch
      invitation when more OPEN suggestions remain, repeats or guesses
      navigation, uses primitive equality or another unverified ID-filter shape
      for Query Sites, labels navigation generically as "Open in Wix", omits
      both the exact Editor link and the plain Editor fallback when a visible
      task belongs there, includes an unrelated campaign CTA or a destination
      required only by completed or hidden items, shows a manual Search Themes
      link without the user's preference, tells the user to perform supported
      connection work manually, changes a suggestion status, claims
      recommendations are automatically implemented, or routes to pre-campaign
      suggestions.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Rate how smoothly the agent handled the request. Examine the tool-call
      trace. Score 9-10 for a direct path: read the campaign success guide
      documentation, use site b342a30b-616e-40ce-ad26-52a83397e08e, identify
      its campaign with at most one campaign-list call, retrieve or create the
      guide once, use existing navigation metadata or at most one read-only
      site-metadata lookup when needed, using query.filter.id.$in with the
      selected ID and cursorPaging.limit 1, and present the first batch without
      querying analytics, reading action recipes prematurely, or mutating guide
      state.

      Score 7-8 when the agent completes that path correctly but uses extra
      documentation or other non-error discovery. Do not penalize plain "Go to
      the Editor" guidance when no exact Editor URL is available from context
      or after the single allowed metadata lookup; that is the required
      fallback, not a missing link.

      Score below 7 for using a different site or probing multiple sites,
      pre-campaign suggestion or analytics calls, a non-2xx call even if
      recovered, repeated campaign or guide calls, guide-status mutation,
      repeated navigation lookup or continued probing after the single attempt,
      a primitive or otherwise unverified Query Sites ID-filter shape,
      premature action-recipe calls, omission of both the exact Editor link and
      its plain fallback, or internal service or tool names in the user-facing
      answer. Name the likely recipe, MCP, or docs gap for each detour. Return
      only
      {"score":<0-10>,"reason":"<terse findings or clean path>"}.
