name: google-ads/google-ads-dashboard-navigation
description: >-
  Verifies the agent reads the Google Ads dashboard-navigation recipe and
  returns the general dashboard and campaign-scoped Keywords Manager URLs.
triggerPrompt: >-
  My Wix site's meta site id is 2c9d2b46-fc18-4557-ae71-4d21a2228914, and my
  Google Ads campaign id is 7d4a9c2e-86f1-4b37-a2d5-9e18c6f043ab. I prefer to
  add its search themes manually. Give me the general campaign dashboard and
  the direct page where I can add those themes.
tags: [google-ads]
maxTokens: 150000
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/marketing/ads/google-ads/skills/google-ads-dashboard-navigation
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user explicitly prefers to add a campaign's search themes manually
      and asked for both relevant Wix dashboard links.

      Pass if the response:
      - includes the general Google Ads dashboard:
        https://manage.wix.com/dashboard/2c9d2b46-fc18-4557-ae71-4d21a2228914/google-ads;
      - includes the campaign-scoped Keywords Manager URL:
        https://manage.wix.com/dashboard/2c9d2b46-fc18-4557-ae71-4d21a2228914/google-ads/keywords-manager?campaignId=7d4a9c2e-86f1-4b37-a2d5-9e18c6f043ab;
      - labels the second link as the place to add Search Themes rather than
        using a generic "Open in Wix" label.

      Fail if the response:
      - invents routes not in the recipe, OR
      - uses a wrong domain or malformed URL, OR
      - drops or changes the campaignId query parameter, OR
      - only describes how to click through the dashboard instead of giving links.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Rate how smoothly the agent returned the requested navigation. Examine
      the tool-call trace. Score 0-10, where 10 is a direct path: read the
      Google Ads dashboard-navigation documentation, use the supplied meta site
      and campaign IDs without a lookup, and return both absolute URLs with no
      unrelated calls.

      Penalize site or campaign discovery despite the supplied IDs, guessed or
      corrected routes, unnecessary API calls, redundant documentation, any
      non-2xx response, and internal service or tool names in the user-facing
      answer. Name the likely recipe, MCP, or docs gap for each detour. Return
      only {"score":<0-10>,"reason":"<terse findings or clean path>"}.
