name: google-ads/manage-campaign-update-targeting
description: >-
  Verifies the agent sends complete arrays on update: adding one geo target to
  the test site's campaign means reading the campaign for the locations it
  already has and sending those plus the new one, not a locations array holding
  a single entry.
triggerPrompt: >-
  Add Brooklyn, NY to the locations targeted by the Google Ads campaign on my
  Wix site (MSID: b342a30b-616e-40ce-ad26-52a83397e08e), keeping everywhere it
  already targets. Go ahead and apply it.
tags: [marketing]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/marketing/ads/google-ads/skills/manage-campaign-lifecycle
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user wants one more geo target added to the campaign on site
      b342a30b-616e-40ce-ad26-52a83397e08e, keeping the existing targeting, and
      gave approval to apply it. That site has exactly one Google Ads campaign.

      Pass if the response:
      - resolves the campaign on that site by listing its campaigns, then reads
        it with GET /v1/campaigns/{campaignId} to obtain the locations it
        currently targets; AND
      - resolves Brooklyn to a geoTargetConstant through the suggestions
        geo-options endpoint rather than inventing or hardcoding an id; AND
      - sends PATCH /v1/campaigns/{campaignId} with a locations array holding
        the entries the read returned AND the new one — stating that an array
        sent partially loses the entries left out of it; AND
      - carries the campaign's other fields (name, campaignType, budget, and the
        smartCampaign / performanceMaxCampaign block) through the update
        unchanged; AND
      - if Brooklyn is already among the campaign's locations, says so and
        leaves the targeting as it is, rather than adding a duplicate entry.

      Fail if the response:
      - sends locations containing only the new entry, or otherwise implies the
        API merges arrays; OR
      - puts the targeting in performanceMaxCampaign.locationGroups instead of
        the campaign's top-level locations; OR
      - sends a payload built only from the requested change; OR
      - skips the campaign read; OR
      - asks the user which campaign to update when the site has only one; OR
      - calls any URL under https://www.wixapis.com/google-ads/v1 — that base is
        stale and 404s; the Google Ads base is
        https://www.wixapis.com/_serverless/pa-google/v1; OR
      - hallucinates an add-location or remove-location endpoint.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Rate how smoothly the agent handled the request. Examine the tool-call
      trace. Score 0-10, where 10 is a direct path: the lifecycle recipe loaded
      from public documentation, the site's campaigns listed once, the campaign
      read once, the geo target resolved, one full-entity update, one read-back
      to verify. Penalize any non-2xx response even if recovered — a 404 from the
      stale google-ads/v1 base in particular — a locations array rebuilt from the
      user's words rather than the read response, guessed request shapes,
      redundant probing or documentation searches, and internal service or tool
      names in the user-facing answer. Name the likely recipe/docs gap behind
      each detour.
      Return only {"score":<0-10>,"reason":"<terse findings or clean path>"}.
