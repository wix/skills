name: google-ads/manage-campaign-success-guide-update
description: >-
  Verifies the agent treats an unambiguous statement that the user completed a
  success guide recommendation as sufficient information to form the correct
  status update without another confirmation step.
triggerPrompt: >-
  For Google Ads campaign 7d4a9c2e-86f1-4b37-a2d5-9e18c6f043ab, I made the
  call-to-action button clearer as the campaign success guide recommended. How
  do I record that recommendation as done?
tags: [marketing]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/marketing/ads/google-ads/skills/manage-a-campaign-success-guide
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Pass if the response:
      - treats the user's completion statement as sufficient information and
        does not ask for confirmation or which recommendation they mean;
      - uses POST
        /pa-platform/suggestions/v1/campaign-success-guides/{campaignId}/update-suggestion-status
        with a request body containing type CLEAR_CTA_COPY and status COMPLETED;
      - identifies the suggestion by type rather than by suggestion id;
      - does not claim that marking the item COMPLETED changed the campaign,
        landing page, or call-to-action itself.

      Fail if it asks for confirmation, site details, or campaign details; maps
      to a different or multiple suggestions; uses a suggestion id as the update
      key; invents an endpoint; or claims the underlying recommendation was
      implemented.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Rate how smoothly the agent handled the request. Examine the tool-call
      trace. Score 0-10, where 10 is a direct path with the correct skill and
      public documentation and a correct update request with no redundant
      probing. This is an explanatory API request, so do not require or expect a
      live mutation. Penalize non-2xx calls, asking for confirmation or site
      details despite the complete hypothetical, guessed request shapes, wrong
      endpoints, and internal service or tool names in the user-facing answer.
      Name the likely recipe/docs gap for each detour. Return only
      {"score":<0-10>,"reason":"<terse findings or clean path>"}.
