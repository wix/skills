name: google-ads/manage-campaign-success-guide-update
description: >-
  Verifies the agent treats an unambiguous statement that the user completed a
  success guide recommendation as sufficient information to mark the matching
  item completed without another confirmation step.
triggerPrompt: >-
  I made the call-to-action button clearer as the Google Ads campaign success
  guide recommended for my Wix site (MSID:
  b342a30b-616e-40ce-ad26-52a83397e08e). Mark that recommendation as done.
tags: [marketing]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/marketing/ads/google-ads/skills/manage-a-campaign-success-guide
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Pass if the response:
      - treats the user's completion statement as sufficient approval and does
        not ask whether to mark the recommendation complete or which
        recommendation they mean;
      - uses site b342a30b-616e-40ce-ad26-52a83397e08e, identifies its campaign,
        retrieves the current guide, and maps the user's wording to suggestion
        type CLEAR_CTA_COPY and desired status COMPLETED;
      - when the item is OPEN, successfully calls POST
        https://www.wixapis.com/pa-platform/suggestions/v1/campaign-success-guides/{campaignId}/update-suggestion-status
        with type CLEAR_CTA_COPY and status COMPLETED; and
      - when the item is already COMPLETED, either successfully sends that same
        desired-state update or reports that no change is needed. Both are
        acceptable because the requested end state is already satisfied.

      In either case, it must identify the suggestion by type rather than by
      suggestion ID and must not claim that the tracking-status update changed
      the campaign, landing page, or call-to-action itself.

      Fail if it asks for redundant confirmation, maps to a different or
      multiple suggestions, uses a suggestion ID instead of the type, sends a
      different endpoint, method, type, or status, modifies another guide item,
      receives a non-2xx response, claims success without either a successful
      update or an already-COMPLETED guide item, or claims the underlying
      landing-page change was implemented by this status update.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Rate how smoothly the agent handled the request. Examine the tool-call
      trace. Score 0-10, where 10 is a direct path: read the campaign success
      guide documentation, use site b342a30b-616e-40ce-ad26-52a83397e08e,
      identify its campaign, retrieve the current guide once, and either update
      CLEAR_CTA_COPY to COMPLETED once or stop cleanly after verifying it is
      already COMPLETED.

      Do not penalize one successful same-state COMPLETED update. Penalize
      redundant confirmation, probing other sites, repeated guide retrieval or
      update calls, changing any other suggestion, a wrong endpoint or request
      shape, a suggestion ID in place of the type, any non-2xx call even if
      recovered, unrelated documentation, or internal service or tool names in
      the user-facing answer. Name the likely recipe, MCP, or docs gap for each
      detour. Return only
      {"score":<0-10>,"reason":"<terse findings or clean path>"}.
