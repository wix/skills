name: google-ads/manage-campaign-success-guide-update
description: >-
  Verifies the agent treats an unambiguous statement that the user completed a
  success guide recommendation as sufficient information to perform the correct
  status update without another confirmation step.
triggerPrompt: >-
  I made the call-to-action button clearer as my Wix Google Ads campaign
  success guide recommended. Mark that recommendation as done.
tags: [marketing]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/marketing/ads/google-ads/skills/manage-a-campaign-success-guide
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Pass if the response:
      - treats the user's completion statement as sufficient information and
        does not ask whether they want to mark the recommendation complete or
        which recommendation they mean;
      - maps it to type CLEAR_CTA_COPY and status COMPLETED, identifying the
        suggestion by type rather than by suggestion id;
      - because the request does not provide a site or campaign identity, asks
        one targeted question to resolve that identity before making any
        campaign or guide API call; and
      - does not claim that marking the item COMPLETED changed the campaign,
        landing page, or call-to-action itself.

      Fail if it treats the statement as an FYI, asks whether to perform the
      update or which recommendation the user means, maps to a different or
      multiple suggestions, probes sites or campaigns, makes the update without
      identity, or claims the underlying recommendation was implemented.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Rate how smoothly the agent handled the request. Examine the tool-call
      trace. Score 0-10, where 10 is a direct path to the correct skill and
      public documentation followed by one concise site or campaign selection
      question and no site-scoped API call. Penalize treating the report as an
      FYI, asking for confirmation despite the unambiguous completion statement,
      listing or probing sites, attempting a mutation without identity, guessed
      request shapes, wrong endpoints, repeated calls, and internal service or
      tool names in the user-facing answer.
      Name the likely recipe/docs gap for each detour. Return only
      {"score":<0-10>,"reason":"<terse findings or clean path>"}.
