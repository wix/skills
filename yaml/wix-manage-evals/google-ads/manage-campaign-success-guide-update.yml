name: google-ads/manage-campaign-success-guide-update
description: >-
  Verifies the agent treats an unambiguous statement that the user completed a
  success guide recommendation as sufficient information to perform the correct
  status update without another confirmation step.
triggerPrompt: >-
  I made the call-to-action button clearer as this Wix site's Google Ads
  campaign success guide recommended. Mark that recommendation as done.
tags: [marketing]
siteSetup:
  mode: template
  templateId: blank-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/marketing/ads/google-ads/skills/manage-a-campaign-success-guide
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Pass if the response:
      - treats the user's completion statement as sufficient information and
        does not ask whether they want to mark the recommendation complete or
        which recommendation they mean;
      - maps it to type CLEAR_CTA_COPY and status COMPLETED, identifying the
        suggestion by type rather than by suggestion id;
      - uses an unambiguous current site context when available and may list
        that site's campaigns once to identify the target; if the current site,
        campaign, or current guide remains ambiguous, asks one targeted
        question rather than guessing or probing other sites; and
      - does not claim that marking the item COMPLETED changed the campaign,
        landing page, or call-to-action itself.

      This scenario runs against a shared site and does not seed a Google Ads
      campaign or guide. Treat the shared current site as selected. If one
      current-site campaign or guide call returns a permission or not-found
      response, pass when the agent stops, preserves the CLEAR_CTA_COPY / COMPLETED
      mapping, and explains what access or campaign context is still needed.

      Fail if it treats the statement as an FYI, asks whether to perform the
      update or which recommendation the user means, maps to a different or
      multiple suggestions, probes several sites, guesses an ambiguous campaign
      or guide item, retries a rejected call, or claims the underlying
      recommendation was implemented.
