name: google-ads/manage-campaign-success-guide-update
description: >-
  Verifies the agent finds the campaign success guide update endpoint and
  constructs the correct request for a completed recommendation without
  executing the mutation.
triggerPrompt: >-
  I made the call-to-action button clearer as the Google Ads campaign success
  guide recommended for my Wix site (MSID:
  b342a30b-616e-40ce-ad26-52a83397e08e). Show me the exact Wix REST API request
  you would use to mark that recommendation as done, but do not call the update
  API or change the guide.
tags: [marketing]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/marketing/ads/google-ads/skills/manage-a-campaign-success-guide
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Pass if the response:
      - identifies POST
        https://www.wixapis.com/pa-platform/suggestions/v1/campaign-success-guides/{campaignId}/update-suggestion-status
        as the update endpoint, with a campaign ID placeholder or a clearly
        identified campaign ID in the path;
      - constructs the request body with exactly the intended mapping:
        type CLEAR_CTA_COPY and status COMPLETED, identifying the suggestion by
        type rather than by suggestion ID;
      - explains that site b342a30b-616e-40ce-ad26-52a83397e08e supplies the
        site context and is not a field in this request body; and
      - honors the dry-run instruction: it does not call the campaign, guide,
        or update APIs and does not claim the guide was changed.

      Fail if it uses a suggestion ID in the URL, uses a different endpoint,
      method, type, or status, adds the site ID to the request body, omits the
      payload, performs any operational API call, claims the update happened,
      or claims this tracking update implements the underlying landing-page
      change.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Rate how smoothly the agent handled the request. Examine the tool-call
      trace. Score 0-10, where 10 is a direct dry-run path: read the campaign
      success guide documentation, find the update-suggestion-status endpoint,
      and construct the correct CLEAR_CTA_COPY / COMPLETED request without
      calling any campaign or guide API.

      Score below 7 if the agent makes any operational site, campaign, guide, or
      update call, because this scenario must not mutate or depend on the static
      fixture. Also penalize redundant documentation, a wrong endpoint or
      request shape, a suggestion ID in place of the type, or internal service
      or tool names in the user-facing answer. Name the likely recipe, MCP, or
      docs gap for each detour. Return only
      {"score":<0-10>,"reason":"<terse findings or clean path>"}.
