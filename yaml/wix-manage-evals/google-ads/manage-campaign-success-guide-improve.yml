name: google-ads/manage-campaign-success-guide-improve
description: >-
  Verifies a user asking how to improve an existing Google Ads campaign is
  routed to its campaign success guide rather than pre-campaign suggestions or
  performance analytics.
triggerPrompt: >-
  How can I improve my Google Ads campaign on my site
  (MSID: b342a30b-616e-40ce-ad26-52a83397e08e)?
tags: [marketing]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/marketing/ads/google-ads/skills/manage-a-campaign-success-guide
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Pass if the response:
      - understands "improve my Google Ads campaign" as a request for the
        existing campaign's Campaign Success Guide rather than for analytics or
        pre-campaign asset, keyword, budget, or targeting suggestions;
      - uses site b342a30b-616e-40ce-ad26-52a83397e08e, lists that site's
        campaigns at most once with GET
        https://www.wixapis.com/_serverless/pa-google/v1/campaigns to identify
        the campaign, and retrieves or creates its Campaign Success Guide once
        with platformType GOOGLE; and
      - does not require the campaign to leave LEARNING or have performance
        metrics before using the guide.

      Fail if it gives only generic optimization advice, routes only to analytics
      or pre-campaign suggestions, does not retrieve the guide, uses a different
      site, tells the user to wait for metrics, probes several sites, receives a
      non-2xx response, guesses between multiple campaigns, or claims
      recommendations are automatically implemented.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Rate how smoothly the agent handled the request. Examine the tool-call
      trace. Score 9-10 for a direct path to the Campaign Success Guide on site
      b342a30b-616e-40ce-ad26-52a83397e08e: select that site, list its campaigns
      at most once if needed, retrieve or create the guide once, and report the
      result. Score 7-8 if extra documentation discovery is needed but the agent
      stays on this route and completes it without an erroneous API call.

      Score below 7 if it detours into analytics or pre-campaign suggestions,
      uses or probes another site, guesses between campaigns, encounters a
      non-2xx call, repeats campaign or guide calls, or exposes internal service
      or tool names in the user-facing answer. Do not judge the guide's visual
      presentation in this routing scenario. Name the likely recipe, MCP, or
      docs gap for each detour. Return only
      {"score":<0-10>,"reason":"<terse findings or clean path>"}.
