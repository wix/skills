name: google-ads/manage-campaign-success-guide-improve
description: >-
  Verifies a user asking how to improve an existing Google Ads campaign is
  routed to its campaign success guide rather than pre-campaign suggestions or
  performance analytics.
triggerPrompt: How can I improve my Google Ads campaign?
tags: [marketing]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/marketing/ads/google-ads/skills/manage-a-campaign-success-guide
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Pass if the response:
      - routes the request to the campaign success guide for an existing Google
        Ads campaign rather than to pre-campaign asset, keyword, budget, or
        targeting suggestions;
      - treats "How can I improve my Google Ads campaign?" as approval to
        retrieve the guide once the campaign is identified, without asking a
        redundant yes/no confirmation;
      - identifies the campaign from available context or asks one targeted
        campaign-selection question when it is genuinely ambiguous; and
      - does not require the campaign to leave LEARNING or have performance
        metrics before using the guide.

      Fail if it routes only to analytics or pre-campaign suggestions, tells the
      user to wait for metrics, asks whether they want the guide after they
      already asked how to improve the campaign, guesses among multiple
      campaigns, or claims recommendations are automatically implemented.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Rate how smoothly the agent handled the request. Examine the tool-call
      trace. Score 0-10, where 10 is a direct path through the campaign success
      guide with only the campaign-resolution step genuinely required by the
      available context. Do not penalize one concise campaign-selection question
      when the campaign is ambiguous. Penalize redundant confirmation, querying
      analytics before the guide, routing through pre-campaign suggestions,
      guessed campaign selection, non-2xx calls, redundant documentation or
      probing, and internal service or tool names in the user-facing answer.
      Name the likely recipe/docs gap for each detour. Return only
      {"score":<0-10>,"reason":"<terse findings or clean path>"}.
