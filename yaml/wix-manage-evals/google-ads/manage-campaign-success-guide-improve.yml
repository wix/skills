name: google-ads/manage-campaign-success-guide-improve
description: >-
  Verifies a user asking how to improve an existing Google Ads campaign is
  routed to its campaign success guide rather than pre-campaign suggestions or
  performance analytics.
triggerPrompt: >-
  How can I improve my Wix Google Ads campaign?
tags: [marketing]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/marketing/ads/google-ads/skills/manage-a-campaign-success-guide
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Pass if the response:
      - routes the request to the campaign success guide for an existing Google
        Ads campaign rather than to pre-campaign asset, keyword, budget, or
        targeting suggestions;
      - explains that the guide is the next step for prioritized improvements;
      - uses an unambiguous current site context when available and may list
        that site's campaigns once to identify the target; if the current site
        or campaign remains ambiguous, asks one focused selection question
        rather than guessing or probing other sites; and
      - does not require the campaign to leave LEARNING or have performance
        metrics before using the guide.

      Fail if it gives only generic optimization advice, routes only to analytics
      or pre-campaign suggestions, tells the user to wait for metrics, probes
      several sites, guesses an ambiguous campaign, or claims recommendations
      are automatically implemented.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Rate how smoothly the agent handled the request. Examine the tool-call
      trace. Score 0-10, where 10 is a direct path to the campaign success guide
      documentation followed by concise guidance and efficient target
      resolution: use the current site context, list its campaigns at most once
      if needed, and ask one focused question only if ambiguity remains.
      Penalize querying analytics first, routing through pre-campaign
      suggestions, probing multiple sites, guessing a campaign or installation
      state, repeated non-2xx calls, redundant documentation, and internal
      service or tool names in the user-facing answer.
      Name the likely recipe/docs gap for each detour. Return only
      {"score":<0-10>,"reason":"<terse findings or clean path>"}.
