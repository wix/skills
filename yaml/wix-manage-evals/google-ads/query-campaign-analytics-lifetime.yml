name: google-ads/query-campaign-analytics-lifetime
description: >-
  Verifies a lifetime, newest-day-first performance query sends an explicit
  dateRange and keeps DATE in fields, the two omissions that make
  performance-metrics return 500.
triggerPrompt: >-
  Show me the daily clicks and cost for my Google Ads campaign since it started,
  newest day first. Give me the exact Wix Google Ads API call.
tags: [marketing]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/marketing/ads/google-ads/skills/query-campaign-performance-analytics
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user wants daily clicks and cost for the campaign's whole lifetime,
      sorted newest day first.

      Pass if the response:
      - uses POST /v1/performance-metrics with a campaignResourceName
        (customers/{customerId}/campaigns/{campaignId}), AND
      - sends an explicit dateRange ({ custom: { from, to } }) whose from is the
        campaign's creation or start date (or says to fill it from the campaign),
        AND
      - sorts by DATE descending, AND
      - includes DATE in fields alongside CLICKS and COST.

      Fail if the response:
      - omits dateRange or says omitting it returns the campaign lifetime, OR
      - sorts by DATE while fields leaves out DATE, OR
      - uses the Wix campaignId instead of campaignResourceName, OR
      - invents an endpoint or falls back to generic Google Ads reporting.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: >
      Rate how smoothly the Wix MCP let the agent fulfill the request. Examine
      the tool-call trace. Score 0-10 (10 = direct: no wasted calls, no errors).
      Penalize and LIST any of: a non-2xx error from performance-metrics even if
      recovered; a request sent without dateRange then corrected; a DATE sort
      sent without DATE in fields then corrected; guessing the campaign
      identifier instead of reading it from the campaign; redundant or probing
      calls clearer docs would avoid. For each, name the likely MCP/docs gap.
      Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + suspected MCP/docs gap, or 'clean path' if none>"}.
