name: google-ads/get-campaign-suggestions-budget
description: >-
  Verifies the agent answers "how much should I spend" by calling a budget
  suggestion endpoint, picks the one that matches the campaign type, and
  converts micros to currency before presenting the answer.
triggerPrompt: >-
  I'm setting up a Performance Max campaign for my Wix bakery site (MSID:
  b342a30b-616e-40ce-ad26-52a83397e08e). How much should I budget per day?
tags: [marketing]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/marketing/ads/google-ads/skills/get-ai-campaign-suggestions-for-google-ads
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user wants a daily budget figure for a Performance Max campaign on the
      bakery site b342a30b-616e-40ce-ad26-52a83397e08e, live at
      https://www.mybakery.com/.

      Pass if the response:
      - calls a budget suggestion endpoint on
        https://www.wixapis.com/_serverless/pa-google/v1 rather than naming a
        figure from its own judgement; AND
      - picks the endpoint that matches the campaign type, and says why:
        POST /v1/budget-recommendation for PERFORMANCE_MAX / PERFORMANCE_MAX_LEADS
        (it takes campaignType, assetGroupInfo[].finalUrl, currency,
        countryCodes, languageCodes), against POST /v1/budget-suggestions, which
        returns the low/recommended/high tiers driven by
        suggestionInfo.liveSiteUrl. Either endpoint passes when the response
        explains the choice; AND
      - converts micros before presenting — 1,000,000 micros is one currency
        unit, so a recommendation is shown as e.g. $15.00/day, not 15000000; AND
      - presents the figure as a suggestion and creates nothing.

      Fail if the response:
      - answers with a budget it reasoned out rather than one the API returned; OR
      - reports a raw micros number to the user as if it were currency; OR
      - creates or updates a campaign, or spends money; OR
      - calls any URL under https://www.wixapis.com/google-ads/v1, a stale base
        that 404s; OR
      - hallucinates endpoints or request fields.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Rate how smoothly the agent handled the request. Examine the tool-call
      trace. Score 0-10, where 10 is a direct path: the suggestions recipe loaded
      from public documentation, the site context resolved if needed, one budget
      call, the figure converted and reported. Penalize any non-2xx response even
      if recovered, calling both budget endpoints to see which works, guessed
      request shapes, redundant documentation searches, and internal service or
      tool names in the user-facing answer. Name the likely recipe/docs gap
      behind each detour.
      Return only {"score":<0-10>,"reason":"<terse findings or clean path>"}.
