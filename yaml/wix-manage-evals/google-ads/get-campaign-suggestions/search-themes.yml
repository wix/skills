name: google-ads/get-campaign-suggestions-search-themes
description: >-
  Verifies the agent answers a request for search themes by actually calling the
  search-theme suggestions endpoint with the landing page and language code,
  rather than reaching for keyword themes or text assets or inventing themes.
triggerPrompt: >-
  Suggest search themes for a Performance Max campaign promoting the new
  sourdough range on my Wix bakery site (MSID:
  b342a30b-616e-40ce-ad26-52a83397e08e).
tags: [marketing]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/marketing/ads/google-ads/skills/get-ai-campaign-suggestions-for-google-ads
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user asked for search themes for a PMAX campaign on the bakery site
      b342a30b-616e-40ce-ad26-52a83397e08e, whose live site is
      https://www.mybakery.com/.

      Pass if the response:
      - calls POST /v1/search-theme-suggestions on the Google Ads base
        https://www.wixapis.com/_serverless/pa-google/v1; AND
      - sends textSuggestionInfo.languageCode — the one required field — as an
        ISO 639-1 two-letter code ("en"), not a locale like "en-US"; AND
      - sends landingPageUrl pointing at the site's live URL or a page on it
        (https://www.mybakery.com/ or deeper), since the themes are generated by
        analyzing that page; AND
      - returns the search themes the endpoint produced, presented as themes the
        user can put into a campaign's assetGroupSignals.

      Fail if the response:
      - writes the themes itself instead of calling the endpoint, or presents
        invented themes as if the API returned them; OR
      - uses keyword-theme-suggestions (Smart campaigns) or
        text-asset-suggestions (headlines and descriptions) for this request; OR
      - invents a request field for the business description — the endpoint takes
        only landingPageUrl and textSuggestionInfo; OR
      - calls any URL under https://www.wixapis.com/google-ads/v1, a stale base
        that 404s; OR
      - treats a slow response as a failure and retries — this endpoint is
        allowed up to 60 seconds.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Rate how smoothly the agent handled the request. Examine the tool-call
      trace. Score 0-10, where 10 is a direct path: the suggestions recipe loaded
      from public documentation, the site's live URL resolved if needed, one call
      to search-theme-suggestions, themes reported. Penalize any non-2xx response
      even if recovered, a premature retry of a call that is allowed 60 seconds,
      guessed request shapes, probing other suggestion endpoints first, and
      internal service or tool names in the user-facing answer. Name the likely
      recipe/docs gap behind each detour.
      Return only {"score":<0-10>,"reason":"<terse findings or clean path>"}.
