name: google-ads/get-campaign-suggestions
description: >-
  Verifies the agent uses the Suggestions recipe to surface read-only
  geo/budget/asset suggestions for a Performance Max campaign and picks the
  right endpoint per need, without mentioning Smart campaigns.
triggerPrompt: >-
  For a Performance Max campaign on my Wix site with Google Ads, which suggestion
  API endpoints does Wix provide for target locations and a recommended daily
  budget, and what do they return?
tags: [marketing]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/marketing/ads/google-ads/skills/get-ai-campaign-suggestions-for-google-ads
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user wants suggested locations and budget before building a campaign.

      Pass if the response:
      - uses the Suggestions recipe, AND
      - maps each need to the right endpoint: geo targets
        (GET /v1/geo-options) and a budget recommendation
        (POST /v1/budget-recommendation), AND
      - notes budgets are returned in micros and geo results become
        geoTargetConstants, AND
      - treats these as read-only (no campaign is created or money spent).

      Fail if the response:
      - creates a campaign or account, OR
      - proposes or mentions a Smart campaign, or points the user at the
        Smart-only keyword-theme-suggestions or budget-suggestions endpoints, OR
      - hallucinates endpoints.
