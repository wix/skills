name: seo/manage-content-plan
description: >-
  Verifies that the agent triggers a content plan generation, polls the flow, recognizes
  PENDING_REQUIREMENTS as a site-data blocker, and tells the user what is missing instead
  of retrying or waiting forever.
triggerPrompt: >-
  Generate an SEO content plan for my site and show me the blog topics it produces.
tags: [seo, content-plan]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/seo/content-plan-content-plan-flow-v1/skills/generate-and-read-a-wix-site-s-content-plan
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user asked to generate an SEO content plan and see the blog topics.

      The test site has no business description or category, so the flow will reach
      PENDING_REQUIREMENTS and park there.

      Pass if the agent:
      - triggers a content plan generation flow (POST /content-plan-flows/trigger),
      - polls GetContentPlanFlow at least once to observe the status,
      - recognizes PENDING_REQUIREMENTS as a terminal state meaning the site lacks
        required business data (description or category),
      - clearly tells the user what is missing and that the flow cannot proceed
        until the site data is provided,
      - does NOT retry the trigger, cancel the flow, or poll indefinitely.

      Fail if the agent:
      - never triggers a flow,
      - polls forever without recognizing PENDING_REQUIREMENTS,
      - retries the trigger after seeing PENDING_REQUIREMENTS,
      - claims the content plan was generated when it was not,
      - asks for a site ID (the API uses the auth context).
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Rate how smoothly the agent handled the content plan generation request on a
      site that lacks business data. Score 0-10.

      HEAVY penalties (each costs 2-3 points):
      - triggered but never polled to check the status
      - polled multiple times without recognizing the terminal state
      - retried the trigger after PENDING_REQUIREMENTS
      - claimed success without evidence

      LIGHT penalties (each costs at most 1 point):
      - extra poll before recognizing the terminal state
      - unnecessary documentation lookup before the first call

      Return ONLY {"score":<0-10>,"reason":"<terse list of frictions, or 'clean path' if none>"}.
siteSetup:
  mode: template
  templateId: blank-editor
