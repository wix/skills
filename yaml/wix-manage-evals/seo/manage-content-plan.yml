name: seo/manage-content-plan
description: >-
  Verifies the agent knows the cross-service orchestration: a Content Plan Flow
  stuck at KEYWORD_RESEARCH needs Create Content Plan (on the Blog Post Candidate
  service) to release it — the key detail the recipe teaches.
triggerPrompt: >-
  My SEO content plan flow has been stuck at KEYWORD_RESEARCH for 10 minutes.
  I've been polling GetContentPlanFlow and the status never changes.
  What's wrong and how do I get it to finish?
tags: [seo, content-plan]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/seo/skills/generate-and-read-a-wix-site-s-content-plan
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user says their content plan flow is stuck at KEYWORD_RESEARCH
      for 10 minutes and polling doesn't change the status.

      The correct answer: KEYWORD_RESEARCH is not a stall. The flow
      intentionally parks there. The user must call Create Content Plan
      (POST /create-content-plan with the flow ID) to release it. This
      is a method on the Blog Post Candidate service, not the Content
      Plan Flow service — the user won't find it by looking at the
      service they've been polling.

      Score 7+ if the agent:
      - said KEYWORD_RESEARCH is an intentional pause, not a bug or stall,
      - told the user to call Create Content Plan to release the flow,
      - provided enough detail to act (the endpoint or a clear description).

      Score 9+ if it also mentioned the endpoint path or that it's on
      a different service than the one being polled.

      Fail (score below 5) if the agent:
      - said to keep polling or wait longer,
      - suggested the flow has failed or should be retried,
      - did not mention Create Content Plan at all.
  - type: llm_judge
    minScore: 5
    maxTokens: 2048
    prompt: |
      Rate the agent's efficiency answering a question about a stuck
      content plan flow. Score 0-10.

      HEAVY penalties (each costs 2-3 points):
      - told the user to keep waiting or retry
      - gave wrong information about KEYWORD_RESEARCH
      - searched extensively without answering

      LIGHT penalties (each costs at most 1 point):
      - documentation lookup before answering
      - mentioned extra steps beyond what was asked

      A direct answer naming the parking behavior and Create Content Plan
      endpoint scores 8+.
      Return ONLY {"score":<0-10>,"reason":"<terse explanation>"}.
siteSetup:
  mode: template
  templateId: blank-editor
