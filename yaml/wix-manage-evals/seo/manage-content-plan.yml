name: seo/manage-content-plan
description: >-
  Verifies that the agent triggers an SEO content plan generation flow, polls the flow status,
  and handles the result correctly — including calling Create Content Plan to release the flow
  when it parks at KEYWORD_RESEARCH, or recognizing PENDING_REQUIREMENTS as a terminal state.
triggerPrompt: >-
  I want to generate an SEO content plan for my Wix site. Trigger the content plan generation,
  then check its status and tell me what happened.
tags: [seo, content-plan]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/seo/skills/generate-and-read-a-wix-site-s-content-plan
  - type: llm_judge
    minScore: 5
    maxTokens: 2048
    prompt: |
      The user asked to generate an SEO content plan and see the blog topics.

      The recipe's key behavior: the flow parks at KEYWORD_RESEARCH and must be
      released by calling Create Content Plan (POST /create-content-plan).

      Pass if the agent:
      - triggered the flow (POST to /content-plan-flows/trigger),
      - polled the flow status (GET to /content-plan-flows/{id}),
      - AND EITHER:
        a) called Create Content Plan (POST to /create-content-plan) to release
           the flow when it reached KEYWORD_RESEARCH, then continued polling
           to SUCCESS and read candidates, OR
        b) correctly identified PENDING_REQUIREMENTS as meaning the site lacks
           business data and told the user what is missing.

      Score 5+ if the agent triggered and polled. Score 7+ if it also called
      Create Content Plan to release the flow OR correctly handled
      PENDING_REQUIREMENTS. Score 9+ if it completed the full loop and showed
      candidates.

      Fail if the agent:
      - never triggered the flow,
      - polled at KEYWORD_RESEARCH without calling Create Content Plan and
        without recognizing it as the parking state,
      - asked for a site ID.
  - type: llm_judge
    minScore: 5
    maxTokens: 2048
    prompt: |
      Rate how smoothly the agent executed the content plan generation.
      Examine the tool-call trace. Score 0-10.

      HEAVY penalties (each costs 2-3 points):
      - never called any API endpoint (just searched docs)
      - polled at KEYWORD_RESEARCH without calling Create Content Plan
      - asked for a site ID
      - claimed success without reading candidates after SUCCESS

      LIGHT penalties (each costs at most 1 point):
      - documentation lookup before the first call
      - extra polls beyond the minimum
      - recovered a non-2xx error

      For each friction, name the likely cause: skill, MCP, or docs gap.
      Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + cause, or 'clean path' if none>"}.
siteSetup:
  mode: template
  templateId: stores-v3-editor
