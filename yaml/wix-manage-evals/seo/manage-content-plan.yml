name: seo/manage-content-plan
description: >-
  Verifies that the agent triggers an SEO content plan generation flow, polls the flow status,
  and correctly reports on the flow's state — including awareness of the KEYWORD_RESEARCH
  parking gate and PENDING_REQUIREMENTS terminal state.
triggerPrompt: >-
  Trigger an SEO content plan generation for my Wix site and check the flow status once.
  Tell me the current status — don't wait for the full generation to complete.
tags: [seo, content-plan]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/seo/skills/generate-and-read-a-wix-site-s-content-plan
  - type: llm_judge
    minScore: 5
    maxTokens: 2048
    prompt: |
      The user asked to trigger an SEO content plan generation and check the status once.

      Pass if the agent:
      - triggered the flow (POST to /content-plan-flows/trigger),
      - polled the flow status at least once (GET to /content-plan-flows/{id}),
      - reported the current status to the user.

      Score 5+ if the agent triggered and polled and reported a status.
      Score 7+ if the agent also explained what the status means or what the
      user should do next (e.g. "the flow is at SITE_ANALYSIS, it will
      proceed to KEYWORD_RESEARCH" or "the site needs business data").
      Score 9+ if the agent mentioned that the flow will park at
      KEYWORD_RESEARCH and needs Create Content Plan to release it.

      Fail only if the agent never triggered or never checked status.
  - type: llm_judge
    minScore: 5
    maxTokens: 2048
    prompt: |
      Rate the agent's efficiency. Examine the tool-call trace. Score 0-10.

      HEAVY penalties (each costs 2-3 points):
      - never called any API endpoint (just searched docs)
      - asked for a site ID
      - claimed the generation completed when it was still running

      LIGHT penalties (each costs at most 1 point):
      - documentation lookup before the first call
      - extra polls beyond the one requested

      For each friction, name the likely cause: skill, MCP, or docs gap.
      A clean trigger-poll-report path scores 8+.
      Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + cause, or 'clean path' if none>"}.
siteSetup:
  mode: template
  templateId: blank-editor
