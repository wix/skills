name: seo/manage-content-plan
description: >-
  Verifies the agent knows the cross-service orchestration: a Content Plan Flow
  parked at KEYWORD_RESEARCH needs Create Content Plan (on the Blog Post Candidate
  service) to release it, but only after the flow's keyword research items
  exist, because releasing earlier fails the flow.
triggerPrompt: >-
  My SEO content plan flow has been stuck at KEYWORD_RESEARCH for 10 minutes.
  I've been polling GetContentPlanFlow and the status never changes.
  What's wrong and how do I get it to finish?
tags: [seo, content-plan]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/seo/skills/generate-and-read-a-wix-site-s-content-plan
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user says their content plan flow is stuck at KEYWORD_RESEARCH
      for 10 minutes and polling doesn't change the status.

      The correct answer: KEYWORD_RESEARCH is not a stall. The flow shows
      it while keyword research runs and can then park there. Finishing the
      research does not change the status by itself, so polling the flow
      alone cannot show the research is ready. The user must first confirm
      the research is ready
      (GET /content-plan-keyword-research-items returns items with the
      flow's keywordResearchId), then call Create Content Plan once
      (POST /create-content-plan with the flow ID) to release it. That
      method is on the Blog Post Candidate service, not the Content Plan
      Flow service being polled. After 10 minutes the research should be
      ready; if the items are still missing, the flow should be reported
      as incomplete rather than waited on indefinitely.

      The user did not give the flow ID. The agent must ask for the actual
      contentPlanFlowId before running any check or release, and must not
      invent, guess, or use a placeholder ID.

      Score 7+ only if the agent did ALL of these:
      - asked the user for the actual contentPlanFlowId,
      - said KEYWORD_RESEARCH is not a bug: it means keyword research is
        running or done, and the flow needs a release only if it stays there
        after the research is ready,
      - told the user to confirm the keyword research items exist for the
        flow's keywordResearchId before releasing,
      - told the user to call Create Content Plan once to release the flow,
      - provided enough detail to act (the endpoints or a clear description).

      Score 9+ if it also mentioned the endpoint paths, that releasing
      before the research is ready fails the flow, or that Create Content
      Plan is on a different service than the one being polled.

      Fail (score below 5) if the agent:
      - called KEYWORD_RESEARCH just an intentional pause and said to
        release it, without the keyword research readiness check,
      - invented, guessed, or used a placeholder flow ID, or ran the check
        or release without the user's actual flow ID,
      - did not ask for the flow ID,
      - only said to keep polling the flow status or wait longer,
      - told the user to call Create Content Plan without first confirming
        the keyword research items exist,
      - suggested the flow has failed or should be re-triggered while it
        is still at KEYWORD_RESEARCH,
      - did not mention Create Content Plan at all.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Rate the agent's efficiency answering a question about a stuck
      content plan flow. Score 0-10.

      HEAVY penalties (each costs 2-3 points):
      - told the user to keep polling the flow status or re-trigger instead
        of checking the keyword research items and releasing
      - told the user to release without confirming the research is ready
      - gave wrong information about KEYWORD_RESEARCH
      - searched extensively without answering

      LIGHT penalties (each costs at most 1 point):
      - documentation lookup before answering
      - mentioned extra steps beyond what was asked

      Checking the keyword research items before releasing is a required
      step, not an extra one. A direct answer naming the parking behavior,
      the keyword research readiness check, and the Create Content Plan
      endpoint scores 8+.
      Return ONLY {"score":<0-10>,"reason":"<terse explanation>"}.
siteSetup:
  mode: template
  templateId: blank-editor
