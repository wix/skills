name: seo/manage-content-plan
description: >-
  Verifies that the agent knows the content plan flow parks at KEYWORD_RESEARCH
  and must be released with Create Content Plan — the key behavior this recipe teaches.
triggerPrompt: >-
  I triggered an SEO content plan generation on my Wix site earlier. The flow status
  shows KEYWORD_RESEARCH. What does that mean and what should I do next to get the
  blog post topics?
tags: [seo, content-plan]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/seo/skills/generate-and-read-a-wix-site-s-content-plan
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user said their content plan flow is at KEYWORD_RESEARCH and asked
      what to do next.

      The correct answer: the flow parks at KEYWORD_RESEARCH and the user must
      call Create Content Plan (POST /create-content-plan) to release it.
      Without that call, the flow stays parked forever.

      Pass if the agent:
      - explained that KEYWORD_RESEARCH is a parking state (not a failure),
      - told the user to call Create Content Plan to advance the flow,
      - mentioned the endpoint or described the action clearly enough to act on.

      Score 7+ if the agent correctly identified the parking behavior and the
      release action. Score 9+ if it also mentioned that after releasing, the
      flow continues to CONTENT_PLAN then SUCCESS, and candidates become
      readable at SUCCESS.

      Fail if the agent:
      - said KEYWORD_RESEARCH means the generation is still running (it's parked),
      - told the user to just keep polling,
      - did not mention Create Content Plan or the release step.
  - type: llm_judge
    minScore: 5
    maxTokens: 2048
    prompt: |
      Rate the agent's efficiency. Score 0-10.

      HEAVY penalties (each costs 2-3 points):
      - told the user to keep waiting or polling without mentioning the release step
      - gave wrong information about what KEYWORD_RESEARCH means
      - searched docs extensively without answering the question

      LIGHT penalties (each costs at most 1 point):
      - documentation lookup before answering
      - mentioned steps beyond what was asked

      A direct answer naming the parking behavior and Create Content Plan scores 8+.
      Return ONLY {"score":<0-10>,"reason":"<terse explanation>"}.
siteSetup:
  mode: template
  templateId: blank-editor
