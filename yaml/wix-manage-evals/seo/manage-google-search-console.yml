name: seo/manage-google-search-console
description: >-
  Verifies that the agent answers a Google Search Console status question from the two
  side-effect-free reads (Get Connection and Get Site Readiness), interprets the statuses
  together, names the next step without performing it, and never calls Get Connect URL to
  check state, because that GET starts a new authorization attempt.
triggerPrompt: >-
  Is my Wix site connected to Google Search Console and fully set up there? If something is
  missing, tell me what's blocking and what you'd do next, but don't change anything yet.
tags: [seo]
# Runs against the shared test site on purpose: the scenario is read-only and must hold for any
# real state (not connected, pending, valid, invalid), so it needs no seeded data.
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/seo/google-search-console/skills/manage-google-search-console-for-a-wix-site
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user asked whether their Wix site is connected to Google Search Console and fully set
      up, what is blocking if not, and what the next step would be. They explicitly said not to
      change anything.

      Pass if the agent:
      - calls Get Connection (GET .../gsc/connection/v1/connection) and Get Site Readiness
        (GET .../gsc/v1/site-readiness) and reports both statuses truthfully,
      - interprets them together: for example NOT_CONNECTED means a Google account must be
        connected first, VALID plus NOT_READY / SITE_OWNER_NOT_VERIFIED means Verify Site is the
        next step, INVALID or TOKEN_INVALID means the Google account must be reconnected, READY
        means connection and verification are done,
      - when the status is READY, does not claim the property was added, the sitemap submitted,
        or indexing requested unless it read List Events (GET .../gsc/v1/events) and found those
        event types,
      - names the next action without performing any write.

      Fail if the agent calls Get Connect URL (GET .../gsc/connection/v1/connect-url), because
      that call starts a new two-hour authorization attempt and flips the status to PENDING; it is
      a write, not a status check. Fail if it calls Verify Site, Add Site, Submit Sitemap, Request
      Site Indexing, Request Page Indexing, Inspect URLs, Disconnect, or Clear Verification. Fail
      if it reports the site as connected after a MISSING_TOKEN error, or describes READY as
      "fully set up in Search Console" without the events to back it. Fail if it asks the user
      for a site ID when the run already provides one.

      If any call returns 403 or PERMISSION_DENIED, require the agent to stop after that first
      attempt and name the missing SEO permission. Do not reward retries with other paths,
      request shapes, or sites.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Judge the tool-call path, not the prose. Score 0-10 (10 = direct: no wasted calls, no
      errors).

      Pass if the agent read the skill, made the two status reads once each (Get Connection and
      Get Site Readiness), optionally read List Events once to answer the "fully set up" half,
      and stopped. Penalize and list: any call to Get Connect URL or to a Site Readiness write
      method; the same status endpoint polled repeatedly with no state change between calls; a
      Site Readiness call sent to a guessed path (for example /gsc/v1/readiness or
      /gsc/connection/v1/connection-status); a non-2xx response even if recovered, except a
      FAILED_PRECONDITION that the agent correctly reported and did not retry; probing calls that
      the recipe already answers. For each friction, name the likely skill or docs gap.

      Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + suspected gap, or 'clean path' if none>"}.
