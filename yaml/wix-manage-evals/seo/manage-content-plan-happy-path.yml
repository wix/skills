name: seo/manage-content-plan-happy-path
description: >-
  Requires the full generation workflow on an isolated site with business data:
  trigger, reach KEYWORD_RESEARCH, wait for the research by checking the flow,
  release only if generation did not start on its own, reach SUCCESS, and read
  candidates.
triggerPrompt: >-
  Generate an SEO content plan for my Wix site and show me the blog post topics
  it suggests.
tags: [seo, content-plan]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/seo/skills/generate-and-read-a-wix-site-s-content-plan
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Require evidence of ALL steps in order for the same flow:
      1. POST /content-plan-flows/trigger and capture the returned contentPlanFlowId.
      2. GET /content-plan-flows/{id} until contentPlanFlow.status is KEYWORD_RESEARCH.
      3. Keep checking the same flow while the research runs. If it moves to
         CONTENT_PLAN or SUCCESS on its own, steps 3 and 4 are satisfied
         without a release.
      4. Only if the flow stays at KEYWORD_RESEARCH for 10 checks in a row: GET
         /content-plan-keyword-research-items, and POST /create-content-plan
         once only after it returns items with the flow's keywordResearchId.
         A 404 "No Keyword research" reply there means not ready yet. A 428
         on the release, followed by more checks of the same flow, also
         satisfies this step.
      5. GET the same flow until status SUCCESS.
      6. GET /content-plan-flows/{id}/blog-post-candidates and report actual returned topics.
      Score 0 if any step is missing, if only an explanation/promise is given,
      or if results are fabricated. PENDING_REQUIREMENTS, FAIL, or a timeout
      must be reported honestly but do not pass this happy-path scenario.
      Reading docs and triggering or checking status alone are not completion.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Score 0-10 for a clean completed generation: one trigger, separate
      bounded status checks, at most one release (only while the flow is
      still KEYWORD_RESEARCH and its keyword research items exist), then
      SUCCESS and reading the actual candidates. Generation usually starts
      on its own; skipping the release then, or one 428 on a release that
      raced it, is correct and not friction. Routine status checks are not
      friction.
      Score 0 for releasing before the keyword research items exist,
      releasing more than once, staying at KEYWORD_RESEARCH without ever
      checking the research or releasing, no API execution, or claiming
      completion without reading candidates.
      Penalize: one API execution that loops, sleeps, or waits for a status
      inside the call instead of separate checks; guessed shapes; repeated
      triggers; non-2xx errors; checking the keyword research items before
      10 status checks in a row at KEYWORD_RESEARCH; more than one 404 reply
      from that check; and documentation lookups after an expected 404.
      Identify likely skill, MCP, API, or provisioning causes for each friction.
      Return ONLY {"score":<0-10>,"reason":"<frictions and causes, or clean path>"}.
siteSetup:
  mode: template
  templateId: stores-v3-editor
  bootstrap:
    steps:
      # Fixture provisioning only: general site properties do not populate the
      # SEO location prerequisite. Keep this internal setup out of the public skill.
      - label: seed online SEO business location
        method: post
        url: https://manage.wix.com/_api/seo-business-location-service/v1/upsert-business-location
        body:
          businessLocation:
            id: "{{siteId}}"
            physicalLocations: []
            serviceLocations: []
            online: true
      # Keyword research requires a primaryBaseUrl; template copies are drafts.
      - label: publish disposable content plan fixture
        method: post
        url: https://www.wixapis.com/site-publisher/v1/site/publish
        body: {}
      - label: set business context for content plan generation
        method: patch
        url: https://www.wixapis.com/site-properties/v4/properties
        body:
          properties:
            categories:
              primary: "Online Store"
            description: "A store selling handmade ceramic products and home goods."
          fieldMask: "categories,description"
