name: collaborators/list-site-collaborators
description: >-
  Verifies that when asked who has access to the site, the agent reads the
  manage-site-collaborators recipe, runs Query Site Contributors, and reports
  the result without mutating anything and without dumping raw ids. A freshly
  provisioned site has no collaborators beyond its owner, and the public API
  cannot add one without an invite being accepted, so the count itself is not
  asserted.
triggerPrompt: >-
  Who currently has collaborator access to my Wix site? Look it up and tell me
  how many collaborators there are.
tags: [collaborators]
siteSetup:
  mode: template
  templateId: blank-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/account-level/user-management/sites/skills/manage-site-collaborators
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user asked how many collaborators their site has.

      Score 8-10 if EITHER:
      (a) the agent called Query Site Contributors
          (GET /roles-management/v2/contributors/query) and told the user how
          many collaborators the response contained, without removing, inviting
          or revoking anything; OR
      (b) the query was refused (for example 403 PERMISSION_DENIED) and the
          agent told the user the lookup was blocked instead of guessing a
          number.

      The endpoint returns only account ids, so the agent should not claim to
      know names or emails. Mentioning that collaborators are identified by
      account id is fine; listing the raw ids is allowed only if the user asked
      for them, which they did not (minor deduction, not a failure).

      Score 0-3 if the agent called any mutating endpoint (remove, invite,
      resend, revoke), invented a count without calling the query, or claimed to
      identify people by name or email from the response.

      Return ONLY {"score":<0-10>,"reason":"<one sentence>"}
