name: collaborators/invite-resend-and-revoke
description: >-
  Verifies the agent reads the manage-site-collaborators recipe, looks up a role,
  sends a site invite with Bulk Invite, then resends and revokes it using the
  invite id returned in that response. The agent creates the invite itself, so
  no seeded id is needed. Bulk Invite may be refused on the test account; the
  judge scores the sequence of calls, not whether the invite went through.
triggerPrompt: >-
  Invite eval-collab@example.com to my Wix site as a collaborator with any
  standard role, resend that invite email once, then cancel the invite.
tags: [collaborators]
siteSetup:
  mode: template
  templateId: blank-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/account-level/user-management/sites/skills/manage-site-collaborators
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user asked the agent to invite eval-collab@example.com to their site,
      resend that invite, then revoke it.

      Score 8-10 if EITHER:
      (a) the agent looked up a role (GET /roles-management/roles), sent
          POST /invites/site-invite/bulk, then called
          POST /invites/site-invite/{inviteId}/resend and
          POST /invites/site-invite/{inviteId}/revoke with the id from the
          Bulk Invite response; OR
      (b) the invite call was refused (for example 403) and the agent stopped,
          told the user the call was refused and did not invent an invite id or
          call resend/revoke. Naming the likely cause (an account-level API key)
          is a bonus, not a requirement: do not deduct if it is missing.

      Score 4-7 if the sequence is right but the report to the user is
      incomplete or misses one of the three outcomes.

      Score 0-3 if the agent invents or asks the user for an invite id after
      creating one itself, calls Remove Contributor, sends a second Bulk Invite
      instead of resend, uses the app-invite proxy endpoints, or invents an
      endpoint.

      An authorization error on the test account is expected and is never a
      reason to score below 8 when (b) applies.

      Return ONLY {"score":<0-10>,"reason":"<one sentence>"}
