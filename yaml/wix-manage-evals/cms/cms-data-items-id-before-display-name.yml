name: cms/cms-data-items-id-before-display-name
description: Verifies collection identity resolution and safe mutation targeting.
triggerPrompt: In my OrdersArchive CMS collection, change Alice's amount to 200. Go ahead and make that
  update.
tags:
- cms
maxTokens: 400000
siteSetup:
  mode: template
  templateId: blank-editor
  bootstrap:
    steps:
    - label: Install CMS
      method: post
      url: https://www.wixapis.com/apps-installer-service/v1/app-instance/install
      body:
        tenant:
          id: '{{siteId}}'
          tenantType: SITE
        appInstance:
          appDefId: e593b0bd-b783-45b8-97c2-873d42aacaf4
    - label: Create OrdersArchive
      method: post
      url: https://www.wixapis.com/wix-data/v2/collections
      body:
        collection:
          id: OrdersArchive
          displayName: Archived Orders
          fields:
          - key: title
            displayName: Title
            type: TEXT
          - key: amount
            displayName: Amount
            type: NUMBER
          permissions:
            insert: ADMIN
            update: ADMIN
            remove: ADMIN
            read: ANYONE
    - label: Create CurrentOrders
      method: post
      url: https://www.wixapis.com/wix-data/v2/collections
      body:
        collection:
          id: CurrentOrders
          displayName: OrdersArchive
          fields:
          - key: title
            displayName: Title
            type: TEXT
          - key: amount
            displayName: Amount
            type: NUMBER
          permissions:
            insert: ADMIN
            update: ADMIN
            remove: ADMIN
            read: ANYONE
    - label: Seed Alice in OrdersArchive
      method: post
      url: https://www.wixapis.com/wix-data/v2/items
      body:
        dataCollectionId: OrdersArchive
        dataItem:
          data:
            title: Alice
            amount: 120
    - label: Seed Alice in CurrentOrders
      method: post
      url: https://www.wixapis.com/wix-data/v2/items
      body:
        dataCollectionId: CurrentOrders
        dataItem:
          data:
            title: Alice
            amount: 120
assertions:
- tool: ReadFullDocsArticle
  params:
    articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/cms/skills/cms-data-items-crud
- type: llm_judge
  minScore: 7
  maxTokens: 2048
  prompt: Pass only if the agent resolves OrdersArchive by its exact ID and changes Alice's amount from
    120 to 200 in that collection while preserving her other fields. The collection CurrentOrders has
    displayName OrdersArchive and must remain untouched. Require evidence of a successful item update
    using dataCollectionId OrdersArchive; an explanation or proposed call without execution does not pass.
    Fail if it chooses CurrentOrders by display name, merges matches from ID and displayName as ambiguous,
    or normalizes names instead of using the existing ID.
- type: llm_judge
  minScore: 7
  maxTokens: 2048
  prompt: Rate the tool-call path 0-10 (10 = direct). Penalize and list avoidable collection-name retries,
    ignoring an exact collection ID, normalization/fuzzy matching, guessed request shapes, redundant schema
    reads, and non-2xx errors even if recovered. Necessary schema/plugin reads, a complete paginated display-name
    lookup, and a clarification for an ambiguous target are appropriate. Identify the likely docs gap
    for each friction. Return ONLY {"score":<0-10>,"reason":"<frictions and suspected gap, or clean path>"}.
