name: cms/cms-data-items-crud-link-multi-reference
description: >-
  Verifies the agent links items through a MULTI_REFERENCE field using the reference endpoints
  (or a patch that creates the link) and verifies the links, instead of writing IDs into the field
  on insert or update where the API silently drops them.
triggerPrompt: >-
  In my Projects CMS collection, assign Alice and Bob from the Team collection to the
  "Website Redesign" project. Go ahead and make the change, then confirm who is on the project.
tags: [cms]
siteSetup:
  mode: template
  templateId: blank-editor
  bootstrap:
    steps:
      - label: Install CMS
        method: post
        url: https://www.wixapis.com/apps-installer-service/v1/app-instance/install
        body:
          tenant:
            id: '{{siteId}}'
            tenantType: SITE
          appInstance:
            appDefId: e593b0bd-b783-45b8-97c2-873d42aacaf4
      - label: Create Team
        method: post
        url: https://www.wixapis.com/wix-data/v2/collections
        body:
          collection:
            id: Team
            displayName: Team
            fields:
              - key: name
                displayName: Name
                type: TEXT
            permissions:
              insert: ADMIN
              update: ADMIN
              remove: ADMIN
              read: ANYONE
      - label: Create Projects
        method: post
        url: https://www.wixapis.com/wix-data/v2/collections
        body:
          collection:
            id: Projects
            displayName: Projects
            fields:
              - key: title
                displayName: Title
                type: TEXT
            permissions:
              insert: ADMIN
              update: ADMIN
              remove: ADMIN
              read: ANYONE
      - label: Add multi-reference field Projects.team -> Team
        method: post
        url: https://www.wixapis.com/wix-data/v2/collections/create-field
        body:
          dataCollectionId: Projects
          field:
            key: team
            displayName: Team
            type: MULTI_REFERENCE
            typeMetadata:
              multiReference:
                referencedCollectionId: Team
                referencingFieldKey: projects
                referencingDisplayName: Projects
      - label: Seed team members
        method: post
        url: https://www.wixapis.com/wix-data/v2/bulk/items/insert
        body:
          dataCollectionId: Team
          dataItems:
            - data: { name: Alice }
            - data: { name: Bob }
            - data: { name: Carol }
      - label: Seed project
        method: post
        url: https://www.wixapis.com/wix-data/v2/items
        body:
          dataCollectionId: Projects
          dataItem:
            data:
              title: Website Redesign
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/cms/skills/cms-data-items-crud
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user asked to assign Alice and Bob (items in the Team collection) to the "Website Redesign"
      item in the Projects collection, whose `team` field is a MULTI_REFERENCE to Team, and to confirm
      who is on the project. Evaluate the tool calls and the final response.

      Pass only if all of the following hold:
      - The agent resolved the item IDs of Alice, Bob and Website Redesign by querying the collections
        (it did not guess IDs).
      - It created the two links with a call that actually writes multi-reference links: the
        insert-references or replace-references endpoint, or a PATCH / bulk PATCH SET_FIELD on the
        `team` field. Either path is acceptable.
      - It verified the result by reading the project back with `includeReferencedItems` (or an
        equivalent read that returns the linked Team items) and reported Alice and Bob — and not Carol —
        as the project's team.
      - It did not mutate anything else (no new Team or Projects items, no field changes).

      Fail if the agent:
      - wrote the member IDs into `team` through a plain insert, PUT update, or bulk insert/update and
        reported success without a read-back showing the links exist (the API returns 200 and drops
        those values), OR
      - reported success with no evidence from a tool call that the links exist, OR
      - only explained how to do it without making the change, OR
      - linked the wrong people or left one of the two out.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: >
      Rate the tool-call path 0-10 by arithmetic, then return the number. Start at 10.
      Subtract 3 for each of these mistakes, which the skill exists to prevent: a non-2xx error even
      if recovered; a guessed request shape corrected afterwards (for example `dataItems` where
      `dataItemReferences` or `patches` was needed); an invented endpoint; writing the member IDs
      into the `team` field through insert, bulk insert or PUT and reporting success without a
      read-back; a wrong or missing final read-back with includeReferencedItems.
      Subtract 1 for each of these inefficiencies, up to 3 points in total: a second read of the
      same collection schema; a docs or search call beyond the first skill read; an extra
      verification or lookup query beyond one read-back; listing a whole collection where a filter
      by name would do.
      Reading the skill once, reading each collection's schema once, one lookup query per named
      item, the write calls, and one read-back are the expected path and cost nothing.
      LIST every deduction. A correct outcome reached with only inefficiencies scores 7 or higher.
      Return ONLY {"score":<0-10>,"reason":"<deductions, or 'clean path'>"}.
