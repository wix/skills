name: cms/cms-schema-unique-display-name
description: Verifies collection identity resolution and safe mutation targeting.
triggerPrompt: Add a number field called Price to my Archived Books CMS collection. Go ahead and add it.
tags:
- cms
maxTokens: 400000
siteSetup:
  mode: template
  templateId: blank-editor
  bootstrap:
    steps:
    - label: Install CMS
      method: post
      url: https://www.wixapis.com/apps-installer-service/v1/app-instance/install
      body:
        tenant:
          id: '{{siteId}}'
          tenantType: SITE
        appInstance:
          appDefId: e593b0bd-b783-45b8-97c2-873d42aacaf4
    - label: Create BookArchive
      method: post
      url: https://www.wixapis.com/wix-data/v2/collections
      body:
        collection:
          id: BookArchive
          displayName: Archived Books
          fields:
          - key: title
            displayName: Title
            type: TEXT
          - key: amount
            displayName: Amount
            type: NUMBER
          permissions:
            insert: ADMIN
            update: ADMIN
            remove: ADMIN
            read: ANYONE
assertions:
- tool: ReadFullDocsArticle
  params:
    articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/cms/skills/cms-schema-management
- type: llm_judge
  minScore: 7
  maxTokens: 2048
  prompt: Pass only if the agent resolves the unique exact displayName Archived Books to ID BookArchive,
    checks the schema and successfully adds field key price with displayName Price and type NUMBER to
    BookArchive. Require a successful field-creation response; explaining a future action is insufficient.
    Fail if it sends Archived Books as dataCollectionId, changes existing fields, or invents an ID.
- type: llm_judge
  minScore: 7
  maxTokens: 2048
  prompt: Rate the tool-call path 0-10 (10 = direct). Penalize and list avoidable collection-name retries,
    ignoring an exact collection ID, normalization/fuzzy matching, guessed request shapes, redundant schema
    reads, and non-2xx errors even if recovered. Necessary schema/plugin reads, a complete paginated display-name
    lookup, and a clarification for an ambiguous target are appropriate. Identify the likely docs gap
    for each friction. Return ONLY {"score":<0-10>,"reason":"<frictions and suspected gap, or clean path>"}.
