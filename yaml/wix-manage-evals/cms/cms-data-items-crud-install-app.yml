name: cms/cms-data-items-crud-install-app
description: >-
  Verifies the agent reads the cms-data-items-crud skill and correctly handles a WDE0110
  error with executable written installation-and-retry instructions, without making live calls.
triggerPrompt: >-
  I'm inserting a data item into my Wix CMS collection through the REST API, but the call
  fails with error code WDE0110. What does this mean and how do I get the insert to succeed?
  I only need written REST instructions for now; do not make a live API call or ask me to select
  a site.
tags: [cms]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/cms/skills/cms-data-items-crud
  - type: llm_judge
    scoringMode: boolean
    maxTokens: 2048
    prompt: |
      The user hit error WDE0110 while inserting a data item into a Wix CMS collection
      and wants written REST instructions to fix it and complete the insert, explicitly without
      live API calls or site selection. Evaluate both the final response and the tool-call trace.
      Intent: recognize WDE0110 as "Wix CMS (Wix Data) app not installed" and handle the
      prerequisite before retrying the insert.

      Pass only if all of the following hold:
      - The answer explains that WDE0110 means the Wix CMS / Wix Data application is not installed.
      - It gives POST https://www.wixapis.com/apps-installer-service/v1/app-instance/install
        with a minimal body containing tenant.tenantType = SITE, tenant.id = a site-ID placeholder,
        and appInstance.appDefId = e593b0bd-b783-45b8-97c2-873d42aacaf4. A curl example or an
        endpoint plus JSON body is acceptable; merely saying "install CMS" is insufficient.
      - It says to retry the original data-item insert after installation succeeds.
      - No live Wix API call was made, no site selection was requested, and no installation or
        successful insert is claimed to have happened.

      Fail if the response:
      - misidentifies WDE0110 (e.g. treats it as a validation, permissions, or wrong-field error), OR
      - tells the user to enable or check Velo, dev mode or the code editor anywhere in the answer,
        including fallback or "if it still fails" checklists, or to call a Velo provision endpoint
        (that flow was removed; installing the CMS app is the whole fix). Quoting the error's own
        "Wix Code not enabled" text while giving the CMS install as the fix is not a failure, OR
      - invents a different appDefId for Wix CMS, OR
      - omits the installation endpoint or required request-body fields, OR
      - does not address retrying the original insert after the prerequisite is handled, OR
      - makes a live API call, asks for site selection, or claims to have performed the installation.
  - type: llm_judge
    minScore: 7
    maxTokens: 1024
    prompt: >
      Rate the tool-call path 0-10. A direct path reads the skills index and CRUD skill and gives
      executable written instructions. Relevant official API/schema reads to verify the install
      contract are acceptable. Score 9-10 for a direct path, 7-8 for a correct answer with modest
      extra discovery, and 0-6 for a live Wix API call despite the user's prohibition, an invented
      endpoint/app ID, a Velo/code-editor detour, repeated failed probing, or missing
      installation-and-retry instructions. Do not count errors merely quoted by the user or docs
      as failed calls. LIST any friction and the likely skill/MCP/docs gap.
      Return ONLY {"score":<0-10>,"reason":"<frictions and suspected gaps, or 'clean path'>"}.
