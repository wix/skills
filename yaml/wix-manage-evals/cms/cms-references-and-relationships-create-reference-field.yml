name: cms/cms-references-and-relationships-create-reference-field
description: >-
  Verifies that a request to add a reference field between two CMS collections routes to the
  cms-references-and-relationships skill, and that the returned create-field body carries the
  target collection at field.typeMetadata.reference.referencedCollectionId rather than on the
  field object itself.
triggerPrompt: >-
  I want to add a reference field called Author to my Books CMS collection so each book links to
  one item in my Authors collection. Give me the exact REST call — endpoint, method and the full
  JSON request body.
tags: [cms]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/cms/skills/cms-references-and-relationships
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user asked for the exact REST call that adds a single-reference field ("Author") to a
      CMS collection ("Books") pointing at another collection ("Authors").
      Intent: a create-field request body the Wix Data Collections API accepts on the first attempt.

      Pass if the response:
      - names the endpoint `POST https://www.wixapis.com/wix-data/v2/collections/create-field`
        (the path `/wix-data/v2/collections/create-field` is enough), AND
      - shows a request body with `dataCollectionId` and a `field` object whose `type` is
        `REFERENCE`, AND
      - places the referenced collection inside the field's metadata as
        `field.typeMetadata.reference.referencedCollectionId` — nested under `typeMetadata`, then
        `reference`, using exactly the key name `referencedCollectionId`.

      Fail if the response:
      - puts the referenced collection directly on the `field` object (for example
        `field.referencedCollection` or `field.referencedCollectionId`) instead of inside
        `typeMetadata.reference`, OR
      - uses `typeMetadata.reference.referencedCollection` (missing the `Id` suffix), OR
      - nests the metadata under a different key such as `metadata` or `referenceMetadata`, OR
      - uses `MULTI_REFERENCE` / `typeMetadata.multiReference` for this single-reference request,
        OR
      - omits the request body, or gives only prose with no endpoint and no JSON.
