name: stores/create-product-physical-inventory-image-sku
description: Regression coverage for a single physical V3 product with an uploaded image, exact stock quantity, SKU, and price.
triggerPrompt: >-
  Add a physical product named "Dog" priced at $12,000. Set inventory to exactly 13 and preserve the SKU exactly as #123.
  Attach this image: https://images.unsplash.com/photo-1552053831-71594a27632d?w=800.
tags: [stores, media]
maxTokens: 25000
siteSetup:
  mode: template
  templateId: stores-v3-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/stores/skills/create-product-catalog-v3
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      This is the reported regression: a single physical product with one public image, exact inventory 13, exact SKU "#123", and price 12000.
      Recipe loading is preferred but not required for this judge; authoritative Wix docs are acceptable. Pass if the agent detects V3, uploads the supplied image once through the Wix image-upload capability (or documented Media Manager fallback), waits for READY when needed, uses that ready wixstatic.com URL in media.itemsInfo.items, and creates exactly one product through either /stores/v3/products-with-inventory or /stores/v3/bulk/products-with-inventory/create. The only variant must contain actualPrice.amount "12000" or "12000.00", sku "#123", inventoryItem.quantity 13, and physicalProperties. The product must be PHYSICAL with product-level physicalProperties. The agent must inspect the product result and inventoryResults before claiming inventory success. If the exact asset reaches FAILED despite a reasonable same-asset retry, it should make no product-create call and report the product as blocked.
      Fail if it routes through setup-online-store, performs speculative schema searches despite the loaded recipe containing the exact shape, calls a no-inventory endpoint, substitutes another image, uses the original external URL or any PENDING/FAILED file URL or thumbnail in the product, drops or changes the # in the SKU, omits inventoryItem, claims inventory success from productId alone, or claims the image is attached without READY evidence. After a successful mutation, fail unnecessary inventory/product queries, searches, PATCH calls, or more than the one allowed projected-media Get Product verification. The inventory-aware bulk endpoint with exactly this one product is valid if both product and inventory results are checked.
  - type: llm_judge
    minScore: 7
    maxTokens: 1024
    prompt: |
      Rate the execution path from 0-10. Prefer the unified recipe, but do not score below 7 solely because authoritative Wix docs were used instead. A 10 uses either source directly, existing V3 context or one version check, one image upload, the correct inventory endpoint, one mutation, and documented response validation. Penalize redundant docs, speculative probes, wrong inventory mode, recovered errors, repeated uploads, or unnecessary post-mutation probes. Return ONLY {"score":<0-10>,"reason":"<terse frictions and likely recipe/docs/MCP gap, or clean path>"}.
