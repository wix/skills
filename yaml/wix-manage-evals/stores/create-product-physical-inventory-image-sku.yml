name: stores/create-product-physical-inventory-image-sku
description: Regression coverage for a single physical V3 product with an uploaded image, exact stock quantity, SKU, and price.
triggerPrompt: >-
  Add a physical product named "Dog" priced at $12,000. Set inventory to exactly 13 and preserve the SKU exactly as #123.
  Attach this image: https://images.unsplash.com/photo-1552053831-71594a27632d?w=800. Create it now.
tags: [stores, media]
maxTokens: 25000
siteSetup:
  mode: template
  templateId: stores-v3-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/stores/skills/create-product-catalog-v3
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      This is the reported regression: a single physical product with one public image, exact inventory 13, exact SKU "#123", and price 12000.
      Pass if the agent loads the unified create-product skill, detects V3, uploads the supplied image once through the Wix image-upload capability (or documented Media Manager fallback), waits for READY when needed, uses that ready wixstatic.com URL in media.itemsInfo.items, and creates exactly one product through either /stores/v3/products-with-inventory or /stores/v3/bulk/products-with-inventory/create. The only variant must contain actualPrice.amount "12000" or "12000.00", sku "#123", inventoryItem.quantity 13, and physicalProperties. The product must be PHYSICAL with product-level physicalProperties. The agent must inspect the product result and inventoryResults before claiming inventory success. If the exact asset reaches FAILED despite a reasonable same-asset retry, it should make no product-create call and report the product as blocked.
      Fail if it routes through setup-online-store, performs speculative schema searches despite the loaded recipe containing the exact shape, calls a no-inventory endpoint, substitutes another image, uses the original external URL or any PENDING/FAILED file URL or thumbnail in the product, drops or changes the # in the SKU, omits inventoryItem, claims inventory success from productId alone, or claims the image is attached without READY evidence. The inventory-aware bulk endpoint with exactly this one product is valid if both product and inventory results are checked.
  - type: llm_judge
    minScore: 7
    maxTokens: 1024
    prompt: |
      Rate the execution path from 0-10. A 10 is direct: load the unified Create Product recipe, use existing V3 site context or one version check, batch-upload supplied images once when supported, choose an inventory-compatible V3 create endpoint immediately, make one product mutation, and validate the documented response. Both single and bulk endpoints are valid for one product; multiple products should use bulk. Penalize and list redundant or tangential recipe reads, speculative schema probes, guessed type names, wrong inventory mode, recovered non-2xx errors, per-image uploads when batch upload is available, repeated single creates for a multi-product request, or unnecessary post-mutation probes. Return ONLY {"score":<0-10>,"reason":"<terse frictions and likely recipe/docs/MCP gap, or clean path>"}.
