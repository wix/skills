name: stores/create-product-physical-inventory-image-sku
description: Regression coverage for a single physical V3 product with an uploaded image, exact stock quantity, SKU, and price.
triggerPrompt: >-
  Add a physical product named "Dog" priced at $12,000. Set inventory to exactly 13 and preserve the SKU exactly as #123.
  Attach this image: https://images.unsplash.com/photo-1552053831-71594a27632d?w=800.
tags: [stores, media]
maxTokens: 25000
siteSetup:
  mode: template
  templateId: stores-v3-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/stores/skills/create-product-catalog-v3
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      This is the reported regression: a single physical product with one public image, exact inventory 13, exact SKU "#123", and price 12000.
      Recipe loading is preferred but not required for this judge; authoritative Wix docs are acceptable. Pass if the agent detects V3, uploads the supplied image once through the Wix image-upload capability (or documented Media Manager fallback), uses the matching returned wixstatic.com URL in media.itemsInfo.items, and creates exactly one product through either /stores/v3/products-with-inventory or /stores/v3/bulk/products-with-inventory/create. A successful upload URL may be used while asynchronous processing is PENDING; READY polling is not mandatory. The only variant must contain actualPrice.amount "12000" or "12000.00", sku "#123", inventoryItem.quantity 13, and physicalProperties. The product must be PHYSICAL with product-level physicalProperties. The returned product and inventory results must support the reported success. If the exact asset reaches FAILED despite a reasonable same-asset retry, it should make no product-create call and report the product as blocked.
      Fail if it routes through setup-online-store, calls a no-inventory endpoint, substitutes another image, uses the original external URL, a URL from a FAILED upload, or a thumbnail in the product, drops or changes the # in the SKU, omits inventoryItem, claims inventory success from productId alone, or claims asynchronous media processing is READY without evidence. Do not fail the correctness outcome merely because the agent recovered from an earlier request error, consulted a schema, or performed a read-only verification after creation; those are path-quality concerns for the next judge. Do not fail merely because a successful upload was PENDING when its returned URL was submitted. The inventory-aware bulk endpoint with exactly this one product is valid if its returned product and inventory results support success.
  - type: llm_judge
    minScore: 7
    prompt: |
      Rate the execution path from 0-10. Prefer the unified recipe, but do not score below 7 solely because authoritative Wix docs were used instead. A 10 uses either source directly, existing V3 context or one version check, one image upload, the correct inventory endpoint, one mutation, and documented response validation. One targeted inventory read is acceptable only when the create response succeeded but omitted the requested quantity and the agent needs independent verification; it should use the returned product ID directly and must not fetch the product first. Penalize wrong upload fields, redundant docs, speculative probes, a body on GET/HEAD, wrong inventory mode, recovered errors, repeated uploads, redundant product/inventory reads, or unnecessary post-mutation probes. Return ONLY {"score":<0-10>,"reason":"<terse frictions and likely recipe/docs/MCP gap, or clean path>"}.
