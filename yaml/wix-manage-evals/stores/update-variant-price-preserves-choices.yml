name: stores/update-variant-price-preserves-choices
description: >
  A store owner asks to change the price of one variant of a Catalog V3 product that has
  product options. Verifies the agent loads the Update Product with Options (Catalog V3)
  recipe and carries every variant's existing `choices` plus the product's `options` array
  in the Update Product PATCH. `variantsInfo.variants` is a full-array overwrite, so sending
  a variant rebuilt from only its `id` and `price` — the recipe's price-only example when a
  product has no options — is rejected with `428 MISSING_OPTIONS_ON_UPDATE_VARIANTS: "Missing
  product options. Options must be provided for variants."` on a product that has options.
triggerPrompt: >
  Change the price of the Large size of my Eval Gate Hat to $22.
tags: [stores]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/stores/skills/update-product-with-options-catalog-v3
  - type: llm_judge          # correctness — the user's outcome
    minScore: 7
    maxTokens: 2048
    prompt: >
      The user's request (verbatim): "Change the price of the Large size of my Eval Gate Hat
      to $22."

      The site is a Catalog V3 store seeded with a physical product "Eval Gate Hat" that has
      one option, Size, with two choices: Small (price $18.00) and Large (price $20.00). Each
      size is a separate variant. The template also ships other demo products; those are
      irrelevant and must not affect the score.

      Score 9-10: after a successful (2xx) Update Product PATCH, the Large variant's price is
      22.00, AND the product still has both variants, AND the Small variant is untouched
      (still $18.00 with its Size/Small choice intact), AND the Large variant kept its Size
      choice. The agent confirmed the new price.

      Score 7-8: the same end state, but the confirmation to the user is vague or omits the
      new price.

      Score 4-6: the price is set on the Large variant but the product lost state in the
      process — the Small variant is missing, either variant lost its `choices` (became an
      unoptioned default variant), or a variant carries a new id.

      Score 1-3: the price was set on the wrong variant or to a different value; OR a NEW
      product was created instead of updating the existing one; OR the final update call
      errored (non-2xx); OR the agent only described how to do it without doing it.

      Judge the end state, not the number of attempts — a run that was rejected and then
      recovered to the correct end state still scores here on correctness.

      Do not deduct for merely reading or listing the other demo products.

      Return ONLY {"score":<0-10>,"reason":"<one sentence>"}.
  - type: llm_judge          # quality — the tool-call path (gates, per docs/eval-scenarios.md)
    minScore: 7
    maxTokens: 2048
    prompt: >
      Rate how smoothly the Wix MCP let the agent fulfill the request. Examine the tool-call
      trace, including the request bodies and any error bodies.

      Score 9-10: a direct path — the product was located, re-read with Get Product, and
      updated in one successful PATCH that carried BOTH variants with their existing
      `choices`, alongside the product's `options` array, changing only the Large variant's
      price. No non-2xx responses, no retried request bodies.

      Score 4-6: the outcome was reached, but the path cost an avoidable round trip — for
      example a probing or repeated API-spec/schema lookup to discover the request shape, or
      a redundant read.

      Score 1-3: any Update Product call was REJECTED and then retried. Score here in
      particular when the rejection came from a variant sent without its `choices` or from
      the product's `options` array being omitted — `428 MISSING_OPTIONS_ON_UPDATE_VARIANTS:
      "Missing product options. Options must be provided for variants."` — or from only the
      changed variant being sent so the other one was dropped, even though a later call
      succeeded. Also score here for a wrong endpoint or wrong catalog version tried first.

      Do not deduct for reading the seeded store's other demo products.

      For each issue found, name the likely MCP/docs gap.

      Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + suspected MCP/docs gap, or 'clean path' if none>"}.
siteSetup:
  mode: template
  templateId: stores-v3-editor
  bootstrap:
    steps:
      - label: seed hat product with two size variants
        method: post
        url: https://www.wixapis.com/stores/v3/products
        body:
          product:
            name: Eval Gate Hat
            productType: PHYSICAL
            physicalProperties: {}
            options:
              - name: Size
                optionRenderType: TEXT_CHOICES
                choicesSettings:
                  choices:
                    - choiceType: CHOICE_TEXT
                      name: Small
                    - choiceType: CHOICE_TEXT
                      name: Large
            variantsInfo:
              variants:
                - choices:
                    - optionChoiceNames:
                        optionName: Size
                        choiceName: Small
                        renderType: TEXT_CHOICES
                  price: { actualPrice: { amount: "18.00" } }
                  physicalProperties: {}
                  visible: true
                - choices:
                    - optionChoiceNames:
                        optionName: Size
                        choiceName: Large
                        renderType: TEXT_CHOICES
                  price: { actualPrice: { amount: "20.00" } }
                  physicalProperties: {}
                  visible: true
