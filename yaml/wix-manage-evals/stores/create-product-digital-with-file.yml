name: stores/create-product-digital-with-file
description: Verifies that a digital V3 product is created sellable — the variant carrying both the uploaded digital file and stock — rather than file-less and silently unbuyable.
triggerPrompt: >-
  Sell this PDF on my store as a digital download named "Focus Planner" for $9.99:
  https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf
tags: [stores, media]
maxTokens: 25000
siteSetup:
  mode: template
  templateId: stores-v3-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/stores/skills/create-product-catalog-v3
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Recipe loading is preferred but not required for this judge; a direct, correct execution grounded in authoritative Wix API docs must pass. Pass if the agent gets the PDF into Wix Media (either generate-upload-url + PUT, or import-file) and creates exactly one product whose single variant carries ALL of: productType DIGITAL, price actualPrice.amount "9.99", digitalProperties.digitalFile.id set to the id the media call returned, and inventoryItem.inStock true — created through /stores/v3/products-with-inventory (or its bulk twin with exactly one product, whose result it then validates). Product- and variant-level physicalProperties must be absent, and visibleInPos must not be true.
      Fail if it creates the product with no digitalProperties.digitalFile, omits inventory or uses the no-inventory /stores/v3/products endpoint, puts digitalProperties on the product instead of the variant, invents a file id, tells the user to attach the file in the dashboard, or reports the product as ready to sell when the variant is missing either the file or stock.
  - type: llm_judge
    minScore: 7
    prompt: |
      Rate the execution path from 0-10. Prefer the unified Create Product recipe, but do not score below 7 solely because it was not loaded when authoritative Wix API docs supported a correct direct execution. A 10 gets the file into Media once, makes one product mutation on the with-inventory endpoint carrying the file and stock in the same call, and validates the response. Penalize a file-less create later repaired by an update, a no-inventory create later repaired by an inventory call, redundant or tangential docs, speculative probes, recovered non-2xx errors, or unnecessary post-mutation probes. Return ONLY {"score":<0-10>,"reason":"<terse frictions and likely recipe/docs/MCP gap, or clean path>"}.
