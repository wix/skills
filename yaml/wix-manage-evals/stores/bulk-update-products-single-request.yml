name: stores/bulk-update-products-single-request
description: >
  A store owner asks to hide several known Catalog V3 products. Verifies the agent loads the
  unified Update Product (Catalog V3) recipe and uses one Bulk Update Products request instead
  of issuing one Update Product PATCH per product.
triggerPrompt: >
  Hide all four products whose names start with "Eval Bulk" so they no longer appear in my
  storefront. Do not change any other products.
tags: [stores]
maxTokens: 650000
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/stores/skills/update-product-catalog-v3
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: >
      The user's request is to hide exactly the four products whose names start with "Eval Bulk"
      and leave every other product unchanged.

      Score 9-10: all four target products ended with product-level `visible: false`, no unrelated
      product was changed, and the write was one successful POST to
      `/stores/v3/bulk/products/update` whose `products` array contained all four targets, each
      nested under `product` with its current `id` and `revision`. The agent confirmed the result.

      Score 7-8: the same correct end state and single bulk write, but the confirmation was vague.

      Score 4-6: the end state is correct but the agent used multiple per-product PATCH writes, or
      used a bulk request that also changed an unrelated product.

      Score 1-3: any target remained visible, an unrelated product was changed, a product was
      deleted, the final write failed, or the agent only described the operation.

      Return ONLY {"score":<0-10>,"reason":"<one sentence>"}.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: >
      Rate the tool-call path. Score 9-10 only when the agent identified the four exact targets,
      obtained their current revisions, and issued one successful POST to
      `/stores/v3/bulk/products/update` with all four entries. There must be no per-product Update
      Product PATCH, no rejected write, no guessed request shape, and no redundant reads. Score
      4-6 if the result was eventually correct but the agent performed sequential product writes,
      probed schemas repeatedly, or retried an avoidable rejected request. Score 1-3 for a wrong
      catalog version, wrong endpoint, or unrecovered error. Name the likely MCP/docs gap for each
      friction. Return ONLY {"score":<0-10>,"reason":"<terse friction list or 'clean path'>"}.
siteSetup:
  mode: template
  templateId: stores-v3-editor
  bootstrap:
    steps:
      - label: seed first bulk target
        method: post
        url: https://www.wixapis.com/stores/v3/products
        body:
          product:
            name: Eval Bulk Alpha
            productType: PHYSICAL
            physicalProperties: {}
            visible: true
            variantsInfo:
              variants:
                - price: { actualPrice: { amount: "10.00" } }
                  physicalProperties: {}
                  visible: true
      - label: seed second bulk target
        method: post
        url: https://www.wixapis.com/stores/v3/products
        body:
          product:
            name: Eval Bulk Beta
            productType: PHYSICAL
            physicalProperties: {}
            visible: true
            variantsInfo:
              variants:
                - price: { actualPrice: { amount: "10.00" } }
                  physicalProperties: {}
                  visible: true
      - label: seed third bulk target
        method: post
        url: https://www.wixapis.com/stores/v3/products
        body:
          product:
            name: Eval Bulk Gamma
            productType: PHYSICAL
            physicalProperties: {}
            visible: true
            variantsInfo:
              variants:
                - price: { actualPrice: { amount: "10.00" } }
                  physicalProperties: {}
                  visible: true
      - label: seed fourth bulk target
        method: post
        url: https://www.wixapis.com/stores/v3/products
        body:
          product:
            name: Eval Bulk Delta
            productType: PHYSICAL
            physicalProperties: {}
            visible: true
            variantsInfo:
              variants:
                - price: { actualPrice: { amount: "10.00" } }
                  physicalProperties: {}
                  visible: true
