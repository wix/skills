name: stores/create-product-with-options
description: Verifies that the unified skill creates every V3 option combination while preserving per-variant prices, SKUs, and inventory in the inventory-aware endpoint.
triggerPrompt: >-
  Create a physical T-shirt named "Everyday Tee" with sizes S and M and colors Black and White, with no image.
  Use these exact variant values: S/Black $30 SKU TEE-S-BLK quantity 5; S/White $31 SKU TEE-S-WHT quantity 6;
  M/Black $32 SKU TEE-M-BLK quantity 7; M/White $33 SKU TEE-M-WHT quantity 8. All four should be visible.
  Generate a short description and create it now.
tags: [stores]
maxTokens: 25000
siteSetup:
  mode: template
  templateId: stores-v3-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/stores/skills/create-product-catalog-v3
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user fully specified a no-image physical product with 2 sizes, 2 colors, and variant-specific price, SKU, and stock.
      Pass if the agent loads the unified create-product skill, detects V3, skips image upload, and creates exactly one product through either /stores/v3/products-with-inventory or /stores/v3/bulk/products-with-inventory/create containing Size and Color options plus exactly four visible variants: S/Black ($30, TEE-S-BLK, 5), S/White ($31, TEE-S-WHT, 6), M/Black ($32, TEE-M-BLK, 7), and M/White ($33, TEE-M-WHT, 8). Each variant must keep its own values together and contain physicalProperties. The agent should inspect both product and inventory results.
      Fail if it calls a no-inventory endpoint, uploads or invents an image, omits an option/combination, loses or swaps any price/SKU/quantity, uses a non-Ricos V3 description, or reports success without checking inventory results. The inventory-aware bulk endpoint with exactly this one product is valid if both product and inventory results are checked.
  - type: llm_judge
    minScore: 7
    maxTokens: 1024
    prompt: |
      Rate the execution path from 0-10. A 10 is direct: load the unified Create Product recipe, use existing V3 site context or one version check, batch-upload supplied images once when supported, choose an inventory-compatible V3 create endpoint immediately, make one product mutation, and validate the documented response. Both single and bulk endpoints are valid for one product; multiple products should use bulk. Penalize and list redundant or tangential recipe reads, speculative schema probes, guessed type names, wrong inventory mode, recovered non-2xx errors, per-image uploads when batch upload is available, repeated single creates for a multi-product request, or unnecessary post-mutation probes. Return ONLY {"score":<0-10>,"reason":"<terse frictions and likely recipe/docs/MCP gap, or clean path>"}.
