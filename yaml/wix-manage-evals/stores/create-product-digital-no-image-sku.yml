name: stores/create-product-digital-no-image-sku
description: Verifies that a digital V3 product created without a download file retains price and SKU, omits physical properties, and is reported as not sellable until a file is attached.
triggerPrompt: >-
  Create a digital product named "Focus Planner PDF" for $9.99 with SKU PDF-FOCUS-01. It has no product image and I am not supplying a download file yet.
tags: [stores]
maxTokens: 20000
siteSetup:
  mode: template
  templateId: stores-v3-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/stores/skills/create-product-catalog-v3
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Recipe loading is preferred but not required for this judge; a direct, correct execution grounded in authoritative Wix API docs must pass. Pass if the agent detects V3, skips image upload, and creates exactly one DIGITAL product whose single variant contains actualPrice.amount "9.99" and sku "PDF-FOCUS-01", with product- and variant-level physicalProperties, media, and any invented digital file all absent. Either the with-inventory or the no-inventory endpoint is acceptable here, since without a file the product cannot be sold either way; if bulk is used it must contain exactly one product and the agent must validate its bulk result. The reply MUST tell the user the product is not sellable until a download file is attached to its variant, and how to attach one — a reply that presents the product as ready to sell fails.
      Fail if it treats the product as PHYSICAL, adds physicalProperties, invents a downloadable file or image, loses the SKU/price, or reports success without the not-sellable caveat. Directing the user to the Wix dashboard as the only way to attach the file also fails: the attach is an API call on the variant.
  - type: llm_judge
    minScore: 7
    prompt: |
      Rate the execution path from 0-10. Prefer the unified Create Product recipe, but do not score below 7 solely because it was not loaded when authoritative Wix API docs supported a correct direct execution. A 10 uses the recipe or the exact Create Product docs, existing V3 site context or one version check, one product mutation, and response validation. Penalize redundant or tangential docs, speculative probes, recovered non-2xx errors, or unnecessary post-mutation probes. Return ONLY {"score":<0-10>,"reason":"<terse frictions and likely recipe/docs/MCP gap, or clean path>"}.
