name: stores/create-products-multiple-no-inventory-with-images
description: Verifies bulk creation of multiple Catalog V3 products with images but without inventory, including exact asset identity, failure isolation, response paths, and image-to-product mapping.
triggerPrompt: >-
  Create two physical products with no inventory: "Black Mug" at $22 with SKU MUG-BLK using
  https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?w=800, and "Dog Print" at $35 with SKU PRINT-DOG using
  https://images.unsplash.com/photo-1552053831-71594a27632d?w=800. Create both now.
tags: [stores, media]
maxTokens: 30000
siteSetup:
  mode: template
  templateId: stores-v3-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/stores/skills/create-product-catalog-v3
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Pass if the agent loads the unified Catalog V3 create-product skill, uploads both supplied URLs together when batch upload is available (or uses the documented Media Manager fallback), preserves each exact asset's product mapping, and uses POST /stores/v3/bulk/products/create with returnEntity true for the products whose requested images are ready. When both exact assets are ready, one bulk call must create both products: Black Mug keeps price 22, SKU MUG-BLK, and its mug image; Dog Print keeps price 35, SKU PRINT-DOG, and its dog image. If an import fails, the agent may retry the same asset through another supported transfer method, but must never substitute unrelated content. If the exact asset remains unavailable, it should bulk-create only the ready product subset and report Dog Print as blocked rather than claim full success. All submitted products must be PHYSICAL with physicalProperties and media.itemsInfo.items, without media.main or inventoryItem. It must validate every results[].itemMetadata, read returned entities from results[].item rather than results[].product, and reconcile bulkActionMetadata. Request values absent from the response must be labeled submitted, not API-verified.
      Fail if it silently replaces the dog image with another image, lets one upload fallback return another product's URL, swaps product images, uses either original external URL or any PENDING/FAILED file URL or thumbnail in a product body, makes repeated product-create calls, calls a with-inventory endpoint, writes media.main, adds inventory, reads returned entities from results[].product, or claims both products and their fields were verified when the response did not prove that.
  - type: llm_judge
    minScore: 7
    maxTokens: 1024
    prompt: |
      Rate the execution path from 0-10. A 10 is direct: load the unified Create Product recipe, use existing V3 site context or one version check, batch-upload supplied images once when supported, preserve exact asset identity and mapping, bulk-create the ready products once, and validate results[].itemMetadata, results[].item, and bulkActionMetadata. Penalize and list redundant or tangential recipe reads, speculative schema probes, wrong inventory mode, recovered API errors, repeated product-create calls, an image substitution, a cross-product URL fallback, reading results[].product, or presenting submitted request values as response-verified. Return ONLY {"score":<0-10>,"reason":"<terse frictions and likely recipe/docs/MCP gap, or clean path>"}.
