name: stores/create-product-from-image
description: Verifies that the unified skill handles an image-assisted product without inventory, avoids unsupported inferred options, and uses ordinary Create Product.
triggerPrompt: >-
  Create a product from this photo of a single blue ceramic mug with no visible size or variant labels:
  https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?w=800. Name it "Blue Studio Mug", price it at $28,
  generate the description and SEO copy.
tags: [stores, media]
maxTokens: 25000
siteSetup:
  mode: template
  templateId: stores-v3-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/stores/skills/create-product-catalog-v3
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user supplied one photo, all mandatory fields, and permission to generate copy and create the product.
      Recipe loading is preferred but not required for this judge; a direct, correct execution grounded in authoritative Wix docs must pass. Pass if the agent uses the pictured blue mug as its source of truth, detects V3, uploads the image once through the Wix image-upload capability (or documented Media Manager fallback), and creates exactly one product through either /stores/v3/products or /stores/v3/bulk/products/create with the matching returned wixstatic.com URL in media.itemsInfo.items. A successful upload URL may be used while asynchronous processing is PENDING; do not require polling to READY or fail solely because creation followed a successful PENDING upload. The body should include plainDescription or a valid Ricos description, SEO data, and at least one variant priced at $28, while omitting inventoryItem because inventory was not requested. "Ceramic" is explicitly user-supplied in the trigger prompt and is allowed in generated copy; do not penalize it as an inferred material. Generated copy may also describe visible traits such as the blue glaze and mug shape, but must not claim a material the user did not name, capacity, dimensions, care instructions, or compatibility. If Ricos bullets are used, they must use BULLETED_LIST with bulletedListData. If bulk is used, it must contain exactly one product and the agent must validate its bulk result.
      Fail if it skips media upload, uses a URL from a FAILED upload or a thumbnail, uses the original URL in the product, substitutes another image, uses an inventory-aware endpoint, adds inventory, writes the read-only media.main field, invents unsupported product facts or variants—including dishwasher-safe, microwave-safe, or other care/compatibility claims not supplied by the user—sends invalid Ricos and recovers from a 400, mixes V1 and V3 endpoints, or omits the required V3 variant. While PENDING, the agent may call the image submitted or attached when the create response supports that, but must not claim asynchronous media processing is READY without evidence. A no-inventory bulk endpoint with exactly this one product is valid.
  - type: llm_judge
    minScore: 7
    prompt: |
      Rate the execution path from 0-10. Prefer the unified Create Product recipe, but do not score below 7 solely because it was not loaded when authoritative Wix docs supported a correct direct execution. A 10 uses the recipe or exact Wix docs, existing V3 site context or one version check, uploads the image once, chooses /stores/v3/products or /stores/v3/bulk/products/create, makes one mutation, and validates the response. An inventory-aware endpoint or inventoryItem is wrong. Penalize redundant or tangential docs, speculative probes, wrong inventory mode, recovered non-2xx errors, repeated uploads, or unnecessary post-mutation probes. Return ONLY {"score":<0-10>,"reason":"<terse frictions and likely recipe/docs/MCP gap, or clean path>"}.
