name: stores/create-product-from-image
description: Verifies that the unified skill handles an image-assisted product without inventory, avoids unsupported inferred options, and uses ordinary Create Product.
triggerPrompt: >-
  Create a product from this photo of a single blue ceramic mug with no visible size or variant labels:
  https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?w=800. Name it "Blue Studio Mug", price it at $28,
  generate the description and SEO copy, and create it now.
tags: [stores, media]
maxTokens: 25000
siteSetup:
  mode: template
  templateId: stores-v3-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/stores/skills/create-product-catalog-v3
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user supplied one photo, all mandatory fields, and permission to generate copy and create the product.
      Pass if the agent loads the unified create-product skill, uses the pictured blue mug as its source of truth, detects V3, uploads the image once through the Wix image-upload capability (or documented Media Manager fallback), waits for READY when the upload reports PENDING, and creates exactly one product through either /stores/v3/products or /stores/v3/bulk/products/create with the returned wixstatic.com URL in media.itemsInfo.items. The body should include plainDescription or a valid Ricos description, SEO data, and at least one variant priced at $28, while omitting inventoryItem because inventory was not requested. Generated copy may describe visible traits such as the blue glaze and mug shape, but must not claim an unverified material, capacity, dimensions, care instructions, or compatibility. If Ricos bullets are used, they must use BULLETED_LIST with bulletedListData. If bulk is used, it must contain exactly one product and the agent must validate its bulk result.
      Fail if it skips media upload, mutates while media is PENDING or FAILED, uses a PENDING/FAILED file URL or thumbnail, uses the original URL in the product, substitutes another image, uses an inventory-aware endpoint, adds inventory, writes the read-only media.main field, invents unsupported product facts or variants, sends invalid Ricos and recovers from a 400, mixes V1 and V3 endpoints, or omits the required V3 variant. A no-inventory bulk endpoint with exactly this one product is valid.
  - type: llm_judge
    minScore: 7
    maxTokens: 1024
    prompt: |
      Rate the execution path from 0-10. A 10 is direct: load the unified Create Product recipe, use existing V3 site context or one version check, batch-upload supplied images once when supported, choose an inventory-compatible V3 create endpoint immediately, make one product mutation, and validate the documented response. Both single and bulk endpoints are valid for one product; multiple products should use bulk. Penalize and list redundant or tangential recipe reads, speculative schema probes, guessed type names, wrong inventory mode, recovered non-2xx errors, per-image uploads when batch upload is available, repeated single creates for a multi-product request, or unnecessary post-mutation probes. Return ONLY {"score":<0-10>,"reason":"<terse frictions and likely recipe/docs/MCP gap, or clean path>"}.
