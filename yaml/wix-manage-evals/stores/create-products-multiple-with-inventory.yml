name: stores/create-products-multiple-with-inventory
description: Verifies that multiple Catalog V3 products with inventory use the inventory-aware bulk endpoint and validate both product and inventory results.
triggerPrompt: >-
  Create two physical products with no images: "Organic Green Tea" at $20, SKU TEA-001, quantity 50;
  and "Herbal Shampoo" at $15, SKU SHAMPOO-001, marked in stock. Create both now.
tags: [stores]
maxTokens: 25000
siteSetup:
  mode: template
  templateId: stores-v3-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/stores/skills/create-product-catalog-v3
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Pass if the agent loads the unified Catalog V3 create-product skill and makes one POST to /stores/v3/bulk/products-with-inventory/create with returnEntity true and exactly two PHYSICAL products. Organic Green Tea's only variant must keep price 20, SKU TEA-001, and inventoryItem.quantity 50 together. Herbal Shampoo's only variant must keep price 15, SKU SHAMPOO-001, and inventoryItem.inStock true together. Both products and variants need physicalProperties and neither product should have media. Before reporting success, the agent must inspect every top-level productResults.results[] and inventoryResults.results[] itemMetadata, reconcile both productResults.bulkActionMetadata and inventoryResults.bulkActionMetadata, and inspect inventoryResults.error.
      Fail if it makes repeated single calls, calls /bulk/products/create without inventory, uses the suppliers-hub API, drops or swaps price/SKU/inventory values, invents images, claims success after inspecting only product results, reads inventoryResults from productResults, omits top-level inventoryResults, or skips either bulkActionMetadata object.
  - type: llm_judge
    minScore: 7
    maxTokens: 1024
    prompt: |
      Rate the execution path from 0-10. A 10 is direct: load the unified Create Product recipe, use existing V3 site context or one version check, choose /stores/v3/bulk/products-with-inventory/create immediately, make one product mutation, then inspect productResults.results, productResults.bulkActionMetadata, the separate top-level inventoryResults.results, inventoryResults.bulkActionMetadata, and inventoryResults.error before reporting success. Score below 7 if inventoryResults is read as a child of productResults, if either results collection or metadata object is skipped, or if HTTP 200/product success is treated as proof of inventory success. Also penalize redundant recipe reads, speculative probes, wrong inventory mode, recovered non-2xx errors, repeated single creates, or unnecessary post-mutation calls. Return ONLY {"score":<0-10>,"reason":"<terse frictions and likely recipe/docs/MCP gap, or clean path>"}.
