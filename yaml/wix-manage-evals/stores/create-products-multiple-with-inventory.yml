name: stores/create-products-multiple-with-inventory
description: Verifies that multiple Catalog V3 products with inventory use the inventory-aware bulk endpoint and validate both product and inventory results.
triggerPrompt: >-
  Create two physical products with no images: "Organic Green Tea" at $20, SKU TEA-001, quantity 50;
  and "Herbal Shampoo" at $15, SKU SHAMPOO-001, marked in stock.
tags: [stores]
maxTokens: 25000
siteSetup:
  mode: template
  templateId: stores-v3-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/stores/skills/create-product-catalog-v3
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Recipe loading is preferred but not required for this judge; authoritative Wix docs are acceptable. Pass if the agent makes one POST to /stores/v3/bulk/products-with-inventory/create with returnEntity true and exactly two PHYSICAL products. Organic Green Tea's only variant must keep price 20, SKU TEA-001, and inventoryItem.quantity 50 together. Herbal Shampoo's only variant must keep price 15, SKU SHAMPOO-001, and inventoryItem.inStock true together. Both products and variants need physicalProperties and neither product should have media. Before reporting success, the agent must inspect every top-level productResults.results[] and inventoryResults.results[] itemMetadata, reconcile both productResults.bulkActionMetadata and inventoryResults.bulkActionMetadata, and inspect inventoryResults.error.
      Fail if it makes repeated single calls, calls /bulk/products/create without inventory, uses the suppliers-hub API, drops or swaps price/SKU/inventory values, invents images, claims success after inspecting only product results, reads inventoryResults from productResults, omits top-level inventoryResults, skips either bulkActionMetadata object, or never explicitly reads inventoryResults.error even when the field is absent/null.
  - type: llm_judge
    minScore: 7
    maxTokens: 1024
    prompt: |
      Rate the execution path from 0-10. Prefer the unified recipe, but do not score below 7 solely because authoritative Wix docs were used instead. A 10 uses either source directly, existing V3 context or one version check, one inventory-aware bulk mutation, and inspects both result collections, both metadata objects, and inventoryResults.error. Score below 7 for wrong response paths, skipped result/metadata checks, or treating HTTP 200/product success as inventory proof. Also penalize redundant docs, speculative probes, recovered errors, repeated single creates, or unnecessary calls. Return ONLY {"score":<0-10>,"reason":"<terse frictions and likely recipe/docs/MCP gap, or clean path>"}.
