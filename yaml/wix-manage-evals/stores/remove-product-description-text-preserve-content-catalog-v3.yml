name: stores/remove-product-description-text-preserve-content-catalog-v3
description: Verifies that removing part of a decorated text run preserves the remaining Rich Content text, decorations, sibling nodes, and button.
triggerPrompt: >
  Remove only "read " from "read the guide" in the description of my "Eval Gate Ricos Mug" product.
  Keep "the guide" and every other existing element exactly as they are, including formatting and links.
tags: [stores]
maxTokens: 450000
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/stores/skills/update-product-with-options-catalog-v3
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user asks to remove only "read " from the bold linked text "read the guide" in the
      existing "Eval Gate Ricos Mug" product description, preserving all other elements.
      The seeded Catalog V3 product has a paragraph containing "Existing care details: "
      and a bold linked TEXT run "read the guide", followed by a LINK button "Read care guide".
      Both the text link and button link target https://example.com/product-care with target BLANK.

      Score 9-10: one successful (2xx) Update Product PATCH leaves the description as Rich Content.
      The targeted run reads exactly "the guide" and retains its BOLD decoration with
      fontWeightValue 700 and its original LINK decoration, URL, and target. The prefix text,
      paragraph structure, LINK button type, button label, button link, container properties,
      and document metadata remain unchanged. The agent confirms the completed removal.
      Score 7-8: the same preserved Rich Content state, but the confirmation is vague.
      Score 4-6: the requested removal happened but an unrelated element, decoration, or document
      property changed, or the agent removed more than the requested substring.
      Score 1-3: the targeted run or its remaining text was lost; plainDescription replaced the
      document; the wrong product was updated; a new product was created; the final update failed;
      or the agent only explained how to perform the update.
      Return ONLY {"score":<0-10>,"reason":"<one sentence>"}.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Rate how smoothly the Wix MCP let the agent fulfill the removal request. Examine the
      tool-call trace, query parameters, and request bodies.
      Required discovery is part of the direct path: one WixREADME call and one
      ReadFullDocsArticle call for the recipe asserted above are expected and must not
      lower the score. WixREADME supplies mandatory site/API guidance; ReadFullDocsArticle
      supplies the recipe this scenario requires. Neither is a schema probe.
      A schema probe is an actual SearchWixAPISpec or ReadFullDocsMethodSchema tool call.
      A URL listed in ExecuteWixAPI.sourceDocUrls is a source citation, not a tool call.
      Evaluate REST requests inside ExecuteWixAPI separately from these documentation calls.
      For each deduction, cite the observed tool call or REST request and explain the
      avoidable friction. Do not infer extra calls from source citations or invent a
      docs gap when the trace contains only the required reads and a clean mutation path.

      Score 9-10: a direct path — locate the exact product, Get Product with DESCRIPTION,
      trim only "read " from the matching textData.text while preserving its decorations,
      then one successful PATCH with the current revision and the full edited Rich Content
      document. No non-2xx responses, retries, or unnecessary schema probes.
      Score 4-6: the correct state was reached with avoidable friction, such as a redundant
      read or a schema lookup that the recipe should have avoided.
      Score 1-3: Get Product omitted DESCRIPTION before the edit; any PATCH used plainDescription;
      any update was rejected and retried; or the first request used the wrong endpoint or catalog version.
      Do not deduct for reading the seeded store's other demo products. Name the MCP/docs gap supported by the trace
      behind each issue, or state that its cause is unknown. Return ONLY {"score":<0-10>,"reason":"<terse list of frictions +
      supported MCP/docs gap or unknown cause, or 'clean path' if none>"}.
siteSetup:
  mode: template
  templateId: stores-v3-editor
  bootstrap:
    steps:
      - label: seed product with rich description
        method: post
        url: https://www.wixapis.com/stores/v3/products
        body:
          product:
            name: Eval Gate Ricos Mug
            productType: PHYSICAL
            physicalProperties: {}
            description:
              nodes:
                - type: PARAGRAPH
                  nodes:
                    - type: TEXT
                      textData:
                        text: "Existing care details: "
                        decorations: []
                    - type: TEXT
                      textData:
                        text: "read the guide"
                        decorations:
                          - type: BOLD
                            fontWeightValue: 700
                          - type: LINK
                            linkData:
                              link:
                                url: https://example.com/product-care
                                target: BLANK
                  paragraphData:
                    textStyle:
                      textAlignment: AUTO
                - type: BUTTON
                  buttonData:
                    type: LINK
                    text: Read care guide
                    link:
                      url: https://example.com/product-care
                      target: BLANK
                    containerData:
                      alignment: CENTER
                      width:
                        size: ORIGINAL
                      textWrap: true
              metadata:
                version: 1
            variantsInfo:
              variants:
                - price:
                    actualPrice:
                      amount: "19.50"
                  physicalProperties: {}
                  visible: true
