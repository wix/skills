name: stores/update-product-attach-digital-file
description: Verifies that an existing digital product rejected at add-to-cart is repaired by attaching a digital file to its variant, rather than re-created or blamed on a stale id.
triggerPrompt: >-
  My digital product "Focus Planner" is in the catalog and in stock, but adding it to the cart fails with
  ITEM_NOT_FOUND_IN_CATALOG. The download is this file:
  https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf — please fix it.
tags: [stores, media]
siteSetup:
  mode: template
  templateId: stores-v3-editor
  bootstrap:
    steps:
      - label: seed digital product in stock without a download file
        method: post
        url: https://www.wixapis.com/stores/v3/products-with-inventory
        body:
          product:
            name: Focus Planner
            productType: DIGITAL
            variantsInfo:
              variants:
                - price: { actualPrice: { amount: "9.99" } }
                  digitalProperties: {}
                  visible: true
                  inventoryItem: { inStock: true }
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/stores/skills/update-product-with-options-catalog-v3
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The site is seeded with an existing DIGITAL product named "Focus Planner", priced
      at $9.99, with one existing variant in stock and no digitalProperties.digitalFile.
      The user asks to repair that existing product using the supplied external PDF URL.
      Score 9-10: the agent finds the seeded product, imports the PDF into Wix Media, and
      repairs it with one successful PATCH /stores/v3/products/{id}, carrying the current
      revision, options: [], and the existing variant with its retained id and price and
      digitalProperties.digitalFile.id set to the imported file.id. It confirms from the
      PATCH response that the file is attached. The existing product, variant and stock remain.
      Score 7-8: the same repaired state, but the final confirmation is vague.
      Score 4-6: a file is attached, but the agent cannot confirm the resulting state or loses
      unrelated existing variant data.
      Score 1-3: no repair was completed; the seeded product was not found; a replacement
      product or variant was created; the final PATCH failed; digitalProperties was sent on
      the product rather than the variant; price or revision was omitted; or only dashboard
      instructions were given. Do not award success for reporting an absent fixture product.
      Return ONLY {"score":<0-10>,"reason":"<one sentence>"}.
  - type: llm_judge
    minScore: 7
    prompt: |
      Rate the execution path from 0-10 using observed tool calls and REST requests.
      One WixREADME, one read of the asserted product recipe, and one read of Upload Media
      to Wix are expected discovery, not schema probes. sourceDocUrls entries are citations,
      not calls. Status reads for the same imported file while it is PENDING are necessary.
      Score 9-10: find the existing product, Get Product once for revision and variant, import
      the supplied URL once, wait for that file to be READY if needed, then one successful
      PATCH carrying its existing variant and options. Verify from the mutation response.
      Score 4-6: successful repair with genuinely redundant docs/schema calls, duplicate
      reads, duplicate imports or an unnecessary post-mutation product read.
      Score 1-3: a mutation was rejected and retried; the product was recreated; a wrong
      endpoint or catalog version was attempted; or no repair was completed.
      For each deduction cite the observed call/request and a supported MCP/docs gap, or
      state that the cause is unknown. Return ONLY {"score":<0-10>,"reason":"<observed
      frictions and supported gap or unknown cause, or clean path>"}.
