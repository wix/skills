name: stores/update-product-attach-digital-file
description: Verifies that a file-less digital product is repaired without losing its variant data and can then be added to a cart.
triggerPrompt: >-
  My digital product "Focus Planner" is in the catalog and in stock, but adding it to the cart fails with
  ITEM_NOT_FOUND_IN_CATALOG. The download is this file:
  https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf — please fix it.
tags: [stores, media]
siteSetup:
  mode: template
  templateId: stores-v3-editor
  bootstrap:
    steps:
      - label: seed file-less digital product
        method: post
        url: https://www.wixapis.com/stores/v3/products-with-inventory
        body:
          product:
            name: Focus Planner
            productType: DIGITAL
            variantsInfo:
              variants:
                - sku: PDF-FOCUS-01
                  price: { actualPrice: { amount: "9.99" } }
                  visible: true
                  inventoryItem: { inStock: true }
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/stores/skills/update-product-with-options-catalog-v3
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The site contains an in-stock digital product named "Focus Planner" with one variant (SKU PDF-FOCUS-01, price 9.99) and no digital file. Recipe loading is preferred but not required; a correct execution grounded in authoritative Wix API docs must pass. Pass if the agent identifies the missing digital file as the cause of ITEM_NOT_FOUND_IN_CATALOG, gets the PDF into Wix Media, and repairs the seeded product with one revision-based PATCH. The existing variant must retain its id, SKU, and price and gain digitalProperties.digitalFile.id. Confirm the attached file from the PATCH response, then create a cart containing that product and variant. The cart response must contain the same catalog reference with a confirmed quantity of at least one. That checks the reported add-to-cart failure and stock together; do not infer either from a successful PATCH alone.
      Fail if it attributes the error to a stale or wrong product/variant id, deletes or re-creates the product, reports that the product is missing, puts digitalProperties on the product instead of the variant, drops the existing SKU or price, omits the revision, claims the cart issue is fixed without a successful cart response, or tells the user to attach the file in the dashboard.
  - type: llm_judge
    minScore: 7
    prompt: |
      Rate the execution path from 0-10. A 10 locates the seeded product, reads it once for its revision and variant, gets the file into Media once, repairs with one PATCH, confirms the file from that response, and checks the original symptom with one successful cart creation containing the same variant. The cart check is necessary validation, not an unnecessary probe; a separate post-PATCH Get Product is not required when the PATCH response already proves the file attachment. Penalize claiming the product is missing, hunting for a stale id, re-creating the product, repeated reads of the same product, redundant or tangential docs, recovered non-2xx errors (a revision mismatch above all), or other unnecessary post-mutation probes. Return ONLY {"score":<0-10>,"reason":"<terse frictions and likely recipe/docs/MCP gap, or clean path>"}.
