name: stores/create-product-opening-and-start-path
description: When the user wants to create a product but hasn't named one, the skill should open by asking what product to create and offer a starting path — from an uploaded image or from a text description.
triggerPrompt: For my Wix store, I'd like to add a new product.
tags: [stores]
siteSetup:
  mode: template
  templateId: stores-v3-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/stores/skills/create-product-catalog-v3
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Context: the user wants to create a product but has not named a specific product or provided any details.
      Pass if the response (a) loads the unified create-product skill, (b) asks what product the user would like to create instead of fabricating one, (c) offers BOTH starting paths in the same response: upload up to 3 product images so the agent can generate product information, OR describe the product in text, and (d) stops there.
      Fail if the response invents product details, calls a product API, omits either the image or text path, or asks for a structured list of fields such as name, price, product type, options, SEO, inventory, or similar details. A form, checklist, or questionnaire fails even if it also asks what product to create.
      The exact wording is not required, but both paths must be explicit and no structured-field intake may be added in this turn.
  - type: llm_judge
    minScore: 7
    maxTokens: 1024
    prompt: |
      Rate the interaction path from 0-10. A 10 loads the unified Create Product recipe, resolves any missing context needed for the requested site, then gives one concise response asking what product to create and offering both supported starting paths: upload up to 3 images for generated product information, or describe the product in text.
      Penalize unrelated or redundant documentation and API calls, asking for structured fields, presenting a form/checklist/questionnaire, or omitting either starting path. Do not penalize a relevant read-only call needed to resolve missing site context. Return ONLY {"score":<0-10>,"reason":"<terse friction or clean path>"}.
