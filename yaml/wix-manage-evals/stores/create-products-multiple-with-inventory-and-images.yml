name: stores/create-products-multiple-with-inventory-and-images
description: Verifies inventory-aware bulk creation with multiple images, exact per-product stock, SKUs, prices, and complete product/inventory result validation.
triggerPrompt: >-
  Create two physical products with images and inventory: "Blue Mug" at $24, SKU MUG-BLUE, quantity 8, using
  https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?w=800; and "Dog Poster" at $40, SKU POSTER-DOG, quantity 3, using
  https://images.unsplash.com/photo-1552053831-71594a27632d?w=800. Create both now.
tags: [stores, media]
maxTokens: 30000
siteSetup:
  mode: template
  templateId: stores-v3-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/stores/skills/create-product-catalog-v3
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Pass only if the tool trace contains exactly one product-create mutation: one POST to /stores/v3/bulk/products-with-inventory/create with returnEntity true and both products in the same request. The agent must load the unified Catalog V3 create-product skill and upload both supplied URLs together in one Wix image-upload call when that capability is available (or use the documented Media Manager fallback). Blue Mug must keep price 24, SKU MUG-BLUE, quantity 8, and its uploaded mug wixstatic.com URL together; Dog Poster must keep price 40, SKU POSTER-DOG, quantity 3, and its uploaded dog wixstatic.com URL together. Both products and variants need physicalProperties, and media must use itemsInfo.items without writing media.main. The agent must inspect every productResults and inventoryResults entry, both bulk metadata objects, and any inventory error before reporting success.
      Hard fail if the trace lacks that bulk call or contains any call to a single-product create endpoint, including two sequential single-product creates, even if both products succeed. Also fail if it uses the no-inventory bulk endpoint, uploads images one at a time when batch upload is available, swaps or substitutes either image, uses original external URLs or PENDING/FAILED file URLs or thumbnails in product bodies, omits inventoryItem, or claims success after checking only product results.
  - type: llm_judge
    minScore: 7
    maxTokens: 1024
    prompt: |
      Rate the execution path from 0-10. A 10 is direct: load the unified Create Product recipe, use existing V3 site context or one version check, batch-upload supplied images once when supported, make exactly one POST to /stores/v3/bulk/products-with-inventory/create containing both products, and validate the documented response. Score below 7 if the trace contains any single-product create call or more than one product-create mutation, even if the final products are correct. Also penalize and list redundant or tangential recipe reads, speculative schema probes, guessed type names, wrong inventory mode, recovered non-2xx errors, per-image uploads when batch upload is available, or unnecessary post-mutation probes. Return ONLY {"score":<0-10>,"reason":"<terse frictions and likely recipe/docs/MCP gap, or clean path>"}.
