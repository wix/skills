name: stores/create-products-multiple-no-inventory
description: Verifies that multiple Catalog V3 products without inventory use the no-inventory bulk endpoint and preserve each product's type, price, and SKU.
triggerPrompt: >-
  Create these two products with no inventory and no images: a physical "Canvas Tote" at $18.50 with SKU 000-TOTE,
  and a digital "Focus Planner PDF" at $9.99 with SKU PDF-FOCUS-01. Create both now.
tags: [stores]
maxTokens: 25000
siteSetup:
  mode: template
  templateId: stores-v3-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/stores/skills/create-product-catalog-v3
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Pass if the agent loads the unified Catalog V3 create-product skill and makes one POST to /stores/v3/bulk/products/create with returnEntity true and exactly two products. Canvas Tote must be PHYSICAL with product and variant physicalProperties, price 18.50, and SKU "000-TOTE" preserved. Focus Planner PDF must be DIGITAL with price 9.99 and SKU "PDF-FOCUS-01", without physicalProperties. No product may contain inventoryItem or media. The agent must inspect every result's itemMetadata and bulkActionMetadata before reporting success.
      Fail if it makes repeated single-product calls, calls either inventory endpoint, uses the suppliers-hub API, adds inventory/images, loses a SKU/price/type, adds physicalProperties to the digital product, or claims full success without inspecting all bulk results.
  - type: llm_judge
    minScore: 7
    maxTokens: 1024
    prompt: |
      Rate the execution path from 0-10. A 10 is direct: load the unified Create Product recipe, use existing V3 site context or one version check, batch-upload supplied images once when supported, choose an inventory-compatible V3 create endpoint immediately, make one product mutation, and validate the documented response. Both single and bulk endpoints are valid for one product; multiple products should use bulk. Penalize and list redundant or tangential recipe reads, speculative schema probes, guessed type names, wrong inventory mode, recovered non-2xx errors, per-image uploads when batch upload is available, repeated single creates for a multi-product request, or unnecessary post-mutation probes. Return ONLY {"score":<0-10>,"reason":"<terse frictions and likely recipe/docs/MCP gap, or clean path>"}.
