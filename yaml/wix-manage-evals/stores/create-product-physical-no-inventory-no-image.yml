name: stores/create-product-physical-no-inventory-no-image
description: Verifies that a simple physical V3 product without image or inventory uses ordinary Create Product and preserves its SKU.
triggerPrompt: >-
  Create a physical product named "Canvas Tote" for $18.50 with SKU 000-TOTE. Do not add an image and do not track inventory.
  Create it now.
tags: [stores]
maxTokens: 20000
siteSetup:
  mode: template
  templateId: stores-v3-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/stores/skills/create-product-catalog-v3
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Pass if the agent loads the unified create-product skill, detects V3, skips all image-upload work, and creates exactly one product through either /stores/v3/products or /stores/v3/bulk/products/create. The PHYSICAL product must contain product-level physicalProperties and one variant with actualPrice.amount "18.50", sku "000-TOTE" preserved with its leading zeroes, and variant physicalProperties. It must omit inventoryItem. If bulk is used, it must contain exactly one product and the agent must validate its bulk result.
      Fail if it uploads or invents media, creates inventory, uses an inventory-aware endpoint, changes the SKU, or omits required physicalProperties. The no-inventory bulk endpoint with exactly this one product is valid.
  - type: llm_judge
    minScore: 7
    maxTokens: 1024
    prompt: |
      Rate the execution path from 0-10. A 10 is direct: load the unified Create Product recipe, use existing V3 site context or one version check, batch-upload supplied images once when supported, choose an inventory-compatible V3 create endpoint immediately, make one product mutation, and validate the documented response. Both single and bulk endpoints are valid for one product; multiple products should use bulk. Penalize and list redundant or tangential recipe reads, speculative schema probes, guessed type names, wrong inventory mode, recovered non-2xx errors, per-image uploads when batch upload is available, repeated single creates for a multi-product request, or unnecessary post-mutation probes. Return ONLY {"score":<0-10>,"reason":"<terse frictions and likely recipe/docs/MCP gap, or clean path>"}.
