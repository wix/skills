{
  "name": "automations/inspect-active-status",
  "description": "Read back a seeded active automation's current status by exact name and returned ID, without writes or test runs.",
  "triggerPrompt": "Is Contact Follow-up currently turned on?",
  "tags": [
    "automations"
  ],
  "assertions": [
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/build-simple-wix-automations"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-activation-status"
      }
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 10 only when the agent locates Contact Follow-up by its exact name and successfully Gets its returned ID. The response must report ACTIVE from configuration.status of that Get response, name the automation and its returned ID, and say that it is eligible for new trigger events. An unresolvable fixture, a status inferred from the name, an unsupported claim about past runs, or any write/activation/deactivation/test fails with 0. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10 for the tool trace. Require a bounded Query Automations by name and a Get of the returned ID, through public tools, with no guessed IDs. Penalize inferring status from the name, checking unrelated automations, catalog discovery, Validate, any write, status toggle or test run, and redundant confirmation for a read-only inspection. Return only a JSON object with score and reason."
    }
  ],
  "siteSetup": {
    "templateId": "blank-editor",
    "bootstrap": {
      "steps": [
        {
          "label": "Seed active automation to inspect",
          "method": "post",
          "url": "https://www.wixapis.com/automations-service/v2/automations",
          "body": {
            "automation": {
              "name": "Contact Follow-up",
              "origin": "USER",
              "configuration": {
                "status": "ACTIVE",
                "trigger": {
                  "appId": "74bff718-5977-47f2-9e5f-a9fd0047fd1f",
                  "triggerKey": "contacts-new_contact_was_created",
                  "filters": []
                },
                "rootActionIds": [
                  "650c6d61-0000-4000-8000-000000000001"
                ],
                "actions": {
                  "650c6d61-0000-4000-8000-000000000001": {
                    "id": "650c6d61-0000-4000-8000-000000000001",
                    "type": "APP_DEFINED",
                    "namespace": "createTask-1",
                    "displayName": "Create follow-up task",
                    "appDefinedInfo": {
                      "appId": "146c0d71-352e-4464-9a03-2e868aabe7b9",
                      "actionKey": "createTask",
                      "inputMapping": {
                        "contactId": "{{var(\"contactId\")}}",
                        "title": "Welcome {{if(or(isEmpty(var(\"contact.name.first\"));isEmptyString(var(\"contact.name.first\")));\"new%20friend\";var(\"contact.name.first\"))}}"
                      },
                      "postActionIds": []
                    }
                  }
                }
              }
            }
          }
        }
      ]
    }
  }
}
