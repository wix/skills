{
  "name": "automations/update-rename-preserve-branches",
  "description": "A rename preserves a seeded condition tree, branch delays, mappings and server settings.",
  "triggerPrompt": "Rename Branched welcome fixture to Branched welcome renamed. Do not change its flow or any other setting. Go ahead and save the rename.",
  "tags": [
    "automations"
  ],
  "assertions": [
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/build-and-manage-wix-automations"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-validation-and-persistence"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-graph-and-data-model"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-conditions"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-delays-variables-and-branches"
      }
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Require lookup and Get of the seeded automation, then rename the same ID and Get again. Final name is Branched welcome renamed. Compare the Update request with the configuration, origin and settings the first Get returned (when that body is not shown, with the seeded configuration described here): identical trigger, five action IDs, condition expression/group, true/false edges, 1-hour and 3-hour branch delays, Inbox note mappings, namespaces and display names. Only top-level name and server-managed revision/timestamps may change. No Create, Delete, pruning, join, linearization or status change. Missing seed or an unchanged name does not pass. Tool response bodies may be abbreviated or missing in what you see: judge from the requests the agent sent, and when a response body is shown it must agree; do not fail a run only because a body is absent. All named requirements are mandatory: score 0 for a semantic mismatch even if the automation saved successfully. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Inspect the actual tool trace. Require a direct path with bounded discovery, real catalog IDs, no guessed endpoints, no private tools and no unrequested side effects. Penalize recovered wrong-shaped requests, redundant confirmation after explicit authorization, repeated failed calls and claims unsupported by read-back. Penalize rebuilding branches or remapping actions for a rename, and extra writes to restore fields accidentally dropped from the original configuration. Reading the skill's documentation articles is expected and is not friction. Tool response bodies may be abbreviated in the trace: do not penalize a read-back only because its body is not shown. Identify each friction and the likely docs or API gap. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 10 only when the tool trace shows the save request (Create, or Update for an existing automation) carrying the requested configuration and returning without an error, followed by a Get Automation call for the returned ID. Tool response bodies may be abbreviated or missing in what you see: when a body is not shown, judge from the requests, the absence of errors and the final answer, and do not fail a run only because a body is missing; when a body is shown, it must match the request. The saved automation must be INACTIVE unless the user asked to turn it on. A failed or never-sent save, no Get after it, or a success claim the trace contradicts scores 0. No activation, test execution, deletion, or unrelated writes are allowed unless the user explicitly requested them. A correct blocker explanation is honest but does not pass this successful-persistence scenario. Return only a JSON object with score and reason."
    }
  ],
  "siteSetup": {
    "templateId": "blank-editor",
    "bootstrap": {
      "steps": [
        {
          "label": "Seed inactive automation to update",
          "method": "post",
          "url": "https://www.wixapis.com/automations-service/v2/automations",
          "body": {
            "automation": {
              "name": "Branched welcome fixture",
              "origin": "USER",
              "configuration": {
                "status": "INACTIVE",
                "trigger": {
                  "appId": "74bff718-5977-47f2-9e5f-a9fd0047fd1f",
                  "triggerKey": "contacts-new_contact_was_created",
                  "filters": []
                },
                "rootActionIds": [
                  "650c6d61-0000-4000-8000-000000000010"
                ],
                "actions": {
                  "650c6d61-0000-4000-8000-000000000010": {
                    "id": "650c6d61-0000-4000-8000-000000000010",
                    "type": "CONDITION",
                    "namespace": "CONDITION-10",
                    "displayName": "Check first name",
                    "conditionInfo": {
                      "orExpressionGroups": [
                        {
                          "operator": "AND",
                          "booleanExpressions": [
                            "{{isEmpty(var(\"contact.name.first\"))}}"
                          ]
                        }
                      ],
                      "truePostActionIds": [
                        "650c6d61-0000-4000-8000-000000000011"
                      ],
                      "falsePostActionIds": [
                        "650c6d61-0000-4000-8000-000000000013"
                      ]
                    }
                  },
                  "650c6d61-0000-4000-8000-000000000011": {
                    "id": "650c6d61-0000-4000-8000-000000000011",
                    "type": "DELAY",
                    "namespace": "DELAY-11",
                    "displayName": "Wait before follow-up",
                    "delayInfo": {
                      "offsetExpression": "{{1}}",
                      "offsetTimeUnit": "HOURS",
                      "postActionIds": [
                        "650c6d61-0000-4000-8000-000000000012"
                      ]
                    }
                  },
                  "650c6d61-0000-4000-8000-000000000012": {
                    "id": "650c6d61-0000-4000-8000-000000000012",
                    "type": "APP_DEFINED",
                    "namespace": "inbox-send-message-12",
                    "displayName": "Show follow-up in Inbox",
                    "appDefinedInfo": {
                      "appId": "141fbfae-511e-6817-c9f0-48993a7547d1",
                      "actionKey": "inbox-send-message",
                      "inputMapping": {
                        "silent": false,
                        "formMessage": {
                          "title": "Welcome new friend",
                          "fields": [
                            {
                              "label": "First name",
                              "value": "{{var(\"contact.name.first\")}}"
                            }
                          ]
                        },
                        "direction": "PARTICIPANT_TO_BUSINESS",
                        "messageType": "FORM",
                        "contactId": "{{var(\"contactId\")}}"
                      },
                      "postActionIds": []
                    }
                  },
                  "650c6d61-0000-4000-8000-000000000013": {
                    "id": "650c6d61-0000-4000-8000-000000000013",
                    "type": "DELAY",
                    "namespace": "DELAY-13",
                    "displayName": "Wait before follow-up",
                    "delayInfo": {
                      "offsetExpression": "{{3}}",
                      "offsetTimeUnit": "HOURS",
                      "postActionIds": [
                        "650c6d61-0000-4000-8000-000000000014"
                      ]
                    }
                  },
                  "650c6d61-0000-4000-8000-000000000014": {
                    "id": "650c6d61-0000-4000-8000-000000000014",
                    "type": "APP_DEFINED",
                    "namespace": "inbox-send-message-14",
                    "displayName": "Show follow-up in Inbox",
                    "appDefinedInfo": {
                      "appId": "141fbfae-511e-6817-c9f0-48993a7547d1",
                      "actionKey": "inbox-send-message",
                      "inputMapping": {
                        "silent": false,
                        "formMessage": {
                          "title": "Welcome {{var(\"contact.name.first\")}}",
                          "fields": [
                            {
                              "label": "First name",
                              "value": "{{var(\"contact.name.first\")}}"
                            }
                          ]
                        },
                        "direction": "PARTICIPANT_TO_BUSINESS",
                        "messageType": "FORM",
                        "contactId": "{{var(\"contactId\")}}"
                      },
                      "postActionIds": []
                    }
                  }
                }
              }
            }
          }
        }
      ]
    }
  }
}
