{
  "name": "automations/update-rename-preserve-branches",
  "description": "A rename preserves a seeded condition tree, branch delays, mappings and server settings.",
  "triggerPrompt": "Rename Branched welcome fixture to Branched welcome renamed. Do not change its flow or any other setting. I approve saving the rename; leave it off.",
  "tags": [
    "automations"
  ],
  "assertions": [
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/build-and-manage-wix-automations"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-validation-and-persistence"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-graph-and-data-model"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-conditions"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-delays-variables-and-branches"
      }
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Require lookup and Get of the seeded automation, then rename the same ID and Get again. Final name is Branched welcome renamed. Compare the complete configuration, origin and settings before/after: identical trigger, five action IDs, condition expression/group, true/false edges, 1-hour and 3-hour branch delays, task mappings, namespaces and display names. Only top-level name and server-managed revision/timestamps may change. No Create, Delete, pruning, join, linearization or status change. Missing seed or an unchanged name does not pass. All named requirements are mandatory: score 0 for a semantic mismatch even if the automation saved successfully. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Inspect the actual tool trace. Require a direct path with bounded discovery, real catalog IDs, no guessed endpoints, no private tools and no unrequested side effects. Penalize recovered wrong-shaped requests, redundant confirmation after explicit authorization, repeated failed calls and claims unsupported by read-back. Identify each friction and the likely docs or API gap. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 10 only when successful API responses in the tool trace prove the requested automation was persisted and a subsequent Get read-back of its returned ID contains the requested final configuration and INACTIVE status. Inspect response bodies, not just the agent's summary or submitted request. Missing read-back, a failed save, schema-stripped required node info, or unverified success scores 0. No activation, test execution, deletion, or unrelated writes are allowed unless the user explicitly requested them. A correct blocker explanation is honest but does not pass this successful-persistence scenario. Return only a JSON object with score and reason."
    }
  ],
  "siteSetup": {
    "templateId": "blank-editor",
    "bootstrap": {
      "steps": [
        {
          "label": "Seed inactive automation to update",
          "method": "post",
          "url": "https://www.wixapis.com/automations-service/v2/automations",
          "body": {
            "automation": {
              "name": "Branched welcome fixture",
              "origin": "USER",
              "configuration": {
                "status": "INACTIVE",
                "trigger": {
                  "appId": "74bff718-5977-47f2-9e5f-a9fd0047fd1f",
                  "triggerKey": "contacts-new_contact_was_created",
                  "filters": []
                },
                "rootActionIds": [
                  "650c6d61-0000-4000-8000-000000000010"
                ],
                "actions": {
                  "650c6d61-0000-4000-8000-000000000010": {
                    "id": "650c6d61-0000-4000-8000-000000000010",
                    "type": "CONDITION",
                    "namespace": "CONDITION-10",
                    "displayName": "Check first name",
                    "conditionInfo": {
                      "orExpressionGroups": [
                        {
                          "operator": "AND",
                          "booleanExpressions": [
                            "{{isEmpty(var(\"contact.name.first\"))}}"
                          ]
                        }
                      ],
                      "truePostActionIds": [
                        "650c6d61-0000-4000-8000-000000000011"
                      ],
                      "falsePostActionIds": [
                        "650c6d61-0000-4000-8000-000000000013"
                      ]
                    }
                  },
                  "650c6d61-0000-4000-8000-000000000011": {
                    "id": "650c6d61-0000-4000-8000-000000000011",
                    "type": "DELAY",
                    "namespace": "DELAY-11",
                    "displayName": "Wait before follow-up",
                    "delayInfo": {
                      "offsetExpression": "{{1}}",
                      "offsetTimeUnit": "HOURS",
                      "postActionIds": [
                        "650c6d61-0000-4000-8000-000000000012"
                      ]
                    }
                  },
                  "650c6d61-0000-4000-8000-000000000012": {
                    "id": "650c6d61-0000-4000-8000-000000000012",
                    "type": "APP_DEFINED",
                    "namespace": "createTask-12",
                    "displayName": "Create follow-up task",
                    "appDefinedInfo": {
                      "appId": "146c0d71-352e-4464-9a03-2e868aabe7b9",
                      "actionKey": "createTask",
                      "inputMapping": {
                        "contactId": "{{var(\"contactId\")}}",
                        "title": "Welcome new friend"
                      },
                      "skipConditionOrExpressionGroups": [],
                      "postActionIds": []
                    }
                  },
                  "650c6d61-0000-4000-8000-000000000013": {
                    "id": "650c6d61-0000-4000-8000-000000000013",
                    "type": "DELAY",
                    "namespace": "DELAY-13",
                    "displayName": "Wait before follow-up",
                    "delayInfo": {
                      "offsetExpression": "{{3}}",
                      "offsetTimeUnit": "HOURS",
                      "postActionIds": [
                        "650c6d61-0000-4000-8000-000000000014"
                      ]
                    }
                  },
                  "650c6d61-0000-4000-8000-000000000014": {
                    "id": "650c6d61-0000-4000-8000-000000000014",
                    "type": "APP_DEFINED",
                    "namespace": "createTask-14",
                    "displayName": "Create follow-up task",
                    "appDefinedInfo": {
                      "appId": "146c0d71-352e-4464-9a03-2e868aabe7b9",
                      "actionKey": "createTask",
                      "inputMapping": {
                        "contactId": "{{var(\"contactId\")}}",
                        "title": "Welcome {{var(\"contact.name.first\")}}"
                      },
                      "skipConditionOrExpressionGroups": [],
                      "postActionIds": []
                    }
                  }
                }
              }
            }
          }
        }
      ]
    }
  }
}
