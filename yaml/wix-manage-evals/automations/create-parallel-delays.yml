{
  "name": "automations/create-parallel-delays",
  "description": "Parallel branches retain independent timing and never become serial.",
  "triggerPrompt": "Create an automation named Parallel contact follow-up. When a new contact is created, start two independent paths: one waits 1 hour then adds a note about the contact to my Wix Inbox titled Quick follow-up; the other waits 3 hours then adds an Inbox note titled Later follow-up. Both paths should run for every contact. Go ahead and save this automation.",
  "tags": [
    "automations"
  ],
  "assertions": [
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/build-and-manage-wix-automations"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-delays-variables-and-branches"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-graph-and-data-model"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-action-configuration"
      }
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Require a persisted SPLIT with two unique path IDs, each leading to its own DELAY and Inbox note (Show in Inbox, `inbox-send-message`, linked to the trigger's contact). Delays are 1 and 3 HOURS from the same trigger, not serial waits adding up to 4 hours, and not a condition choosing one path. No shared descendants or dangling edges. The Create request must carry splitInfo with both paths, followed by a Get of the returned ID; when that Get body is shown it must still contain splitInfo, and a stripped alpha field fails. Tool response bodies may be abbreviated or missing in what you see: judge from the requests the agent sent, and when a response body is shown it must agree; do not fail a run only because a body is absent. All named requirements are mandatory: score 0 for a semantic mismatch even if the automation saved successfully. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Inspect the actual tool trace. Require a direct path with bounded discovery, real catalog IDs, no guessed endpoints, no private tools and no unrequested side effects. Penalize recovered wrong-shaped requests, redundant confirmation after explicit authorization, repeated failed calls and claims unsupported by read-back. Penalize first building serial delays or exclusive conditions and later rebuilding them as parallel paths, or repeatedly saving after splitInfo is stripped without diagnosing that loss. Action IDs and namespaces are chosen by the caller, so a generated one is not a guessed ID. Reading the skill's documentation articles is expected and is not friction. URI-encoded string literals (such as %20), as the expression reference requires, and functions from its list are documented syntax, not guesses; wrong arity, wrong argument types, or an encoded date-time literal in a formula field still count as errors. Tool response bodies may be abbreviated in the trace: do not penalize a read-back only because its body is not shown. Identify each friction and the likely docs or API gap. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 10 only when the tool trace shows the save request (Create, or Update for an existing automation) carrying the requested configuration and returning without an error, followed by a Get Automation call for the returned ID. Tool response bodies may be abbreviated or missing in what you see: when a body is not shown, judge from the requests, the absence of errors and the final answer, and do not fail a run only because a body is missing; when a body is shown, it must match the request. The saved automation must be INACTIVE unless the user asked to turn it on. A failed or never-sent save, no Get after it, or a success claim the trace contradicts scores 0. No activation, test execution, deletion, or unrelated writes are allowed unless the user explicitly requested them. A correct blocker explanation is honest but does not pass this successful-persistence scenario. Return only a JSON object with score and reason."
    }
  ],
  "siteSetup": {
    "templateId": "blank-editor"
  }
}
