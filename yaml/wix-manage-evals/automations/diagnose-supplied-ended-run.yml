{
  "name": "automations/diagnose-supplied-ended-run",
  "description": "The response distinguishes completion of run processing from successful actions, identifies the email action failure exactly as supplied, and says revision 7 is the relevant historical configuration rather than current revision 9.",
  "triggerPrompt": "Can you help me understand why this automation failed? Here are excerpts from the logs I exported.\n\nRun:\n```json\n{\n  \"status\": \"ENDED\",\n  \"endedInfo\": {\n    \"withFailedActions\": true\n  },\n  \"automationRevision\": 7\n}\n```\n\nAction:\n```json\n{\n  \"activationStatus\": \"FAILED\",\n  \"failedInfo\": {\n    \"errorCode\": \"CONTENT_NOT_CONFIGURED\"\n  },\n  \"errorDescription\": \"Email content is not configured\"\n}\n```\n\nI edited the automation afterward, and it is now revision 9. Explain what these logs tell us and what I should inspect next. Please use only what I pasted; do not access my site, change anything, or rerun it.",
  "tags": [
    "automations"
  ],
  "assertions": [
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/build-and-manage-wix-automations"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-run-diagnosis"
      }
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. The response distinguishes completion of run processing from successful actions, identifies the email action failure exactly as supplied, and says revision 7 is the relevant historical configuration rather than current revision 9. It does not infer delivery, fabricate an action ID or claim to have fetched logs. It explains the next read-only investigation using the actual run/action IDs and historical revision and respects the explicit no-site-access/no-rerun constraint. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Judge the explanation and any tool trace against the supplied logs; no catalog discovery, site calls or persistence read-back are needed or authorized. Penalize fetching live site data despite the supplied-log-only request, or reasoning from current revision 9 before recognizing that the failed run used revision 7. Penalize treating ENDED as proof of action success or claiming unobserved delivery. Return only a JSON object with score and reason."
    }
  ]
