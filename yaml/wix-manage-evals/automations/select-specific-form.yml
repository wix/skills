{
  "name": "automations/select-specific-form",
  "description": "A selected form scopes the trigger and drives the subsequent dynamic schema.",
  "triggerPrompt": "On the provided test site, create an inactive automation named Consultation follow-up. Only when Consultation request is submitted, wait 1 day and create a task titled Review consultation. Do not run for Newsletter signup or any other form. I approve saving it.",
  "tags": [
    "automations"
  ],
  "assertions": [
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/build-and-manage-wix-automations"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-item-selection"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-entity-and-provider-configuration"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-trigger-configuration"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-delays-variables-and-branches"
      }
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Resolve Consultation request to its actual form ID with wix.form_app.form namespace constraint, configure the correct form trigger/filter, and fetch dynamic schema AFTER choosing the form. Saved filter selects only that ID, not its name, Newsletter signup or an unfiltered all-forms event. Map task to actual schema contact identity; delay1 day. Resolve items with the public Item Selection binding when available OR the owning vertical public API. Both are valid. If using Item Selection, derive provider key/tag from actual metadata, use installed providers for tags, query.filter with parent constraints and correct pagination, and persist returned items[].id unchanged. A vertical response uses its documented ID/key. No guessed dashboard/private endpoint or generated slug. Failed lookups are unknown, not empty. Score 0 for any missing mandatory result or unsupported success claim. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Inspect the actual tool trace. Require a direct path with bounded discovery, real catalog IDs, no guessed endpoints, no private tools and no unrequested side effects. Penalize recovered wrong-shaped requests, redundant confirmation after explicit authorization, repeated failed calls and claims unsupported by read-back. Identify each friction and the likely docs or API gap. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 10 only when successful API responses in the tool trace prove the requested automation was persisted and a subsequent Get read-back of its returned ID contains the requested final configuration and INACTIVE status. Inspect response bodies, not just the agent's summary or submitted request. Missing read-back, a failed save, schema-stripped required node info, or unverified success scores 0. No activation, test execution, deletion, or unrelated writes are allowed unless the user explicitly requested them. A correct blocker explanation is honest but does not pass this successful-persistence scenario. Return only a JSON object with score and reason."
    }
  ],
  "siteSetup": {
    "mode": "template",
    "templateId": "blank-editor",
    "bootstrap": {
      "steps": [
        {
          "label": "Install Wix Forms (New) — a blank site has no forms app, and the create 400s without it",
          "method": "post",
          "url": "https://www.wixapis.com/apps-installer-service/v1/app-instance/install",
          "body": {
            "tenant": {
              "id": "{{siteId}}",
              "tenantType": "SITE"
            },
            "appInstance": {
              "appDefId": "225dd912-7dea-4738-8688-4b8c6955ffc2"
            }
          }
        },
        {
          "label": "seed an enabled contact form",
          "method": "post",
          "url": "https://www.wixapis.com/form-schema-service/v4/forms",
          "body": {
            "form": {
              "name": "Consultation request",
              "namespace": "wix.form_app.form",
              "formFields": [
                {
                  "id": "192371c5-f45d-45f5-880f-e7571a3cf3d0",
                  "identifier": "CONTACTS_EMAIL",
                  "fieldType": "INPUT",
                  "inputOptions": {
                    "target": "email_1923",
                    "pii": true,
                    "required": true,
                    "contactMapping": {
                      "contactField": "EMAIL",
                      "emailInfo": {
                        "tag": "UNTAGGED"
                      }
                    },
                    "inputType": "STRING",
                    "stringOptions": {
                      "validation": {
                        "format": "EMAIL"
                      },
                      "componentType": "TEXT_INPUT",
                      "textInputOptions": {
                        "label": "Email",
                        "showLabel": true
                      }
                    }
                  }
                },
                {
                  "id": "2acef7ec-f3ec-4207-8f2e-6bf4c7ecaf7f",
                  "identifier": "SUBMIT_BUTTON",
                  "fieldType": "DISPLAY",
                  "displayOptions": {
                    "displayFieldType": "PAGE_NAVIGATION",
                    "pageNavigationOptions": {
                      "submitText": "Send"
                    }
                  }
                }
              ],
              "steps": [
                {
                  "id": "3194a1be-3053-4fa2-b1a5-9c14baf627b1",
                  "name": "Page 1",
                  "layout": {
                    "large": {
                      "items": [
                        {
                          "fieldId": "192371c5-f45d-45f5-880f-e7571a3cf3d0",
                          "row": 0,
                          "column": 0,
                          "width": 12,
                          "height": 1
                        },
                        {
                          "fieldId": "2acef7ec-f3ec-4207-8f2e-6bf4c7ecaf7f",
                          "row": 1,
                          "column": 6,
                          "width": 6,
                          "height": 1
                        }
                      ]
                    }
                  }
                }
              ]
            }
          }
        },
        {
          "label": "seed a second form, disabled — invisible to a default listing",
          "method": "post",
          "url": "https://www.wixapis.com/form-schema-service/v4/forms",
          "body": {
            "form": {
              "name": "Newsletter signup",
              "namespace": "wix.form_app.form",
              "enabled": true,
              "formFields": [
                {
                  "id": "c4668719-180a-4ffe-8c60-3dbc11a9843d",
                  "identifier": "CONTACTS_EMAIL",
                  "fieldType": "INPUT",
                  "inputOptions": {
                    "target": "email_c466",
                    "pii": true,
                    "required": true,
                    "contactMapping": {
                      "contactField": "EMAIL",
                      "emailInfo": {
                        "tag": "UNTAGGED"
                      }
                    },
                    "inputType": "STRING",
                    "stringOptions": {
                      "validation": {
                        "format": "EMAIL"
                      },
                      "componentType": "TEXT_INPUT",
                      "textInputOptions": {
                        "label": "Email",
                        "showLabel": true
                      }
                    }
                  }
                }
              ],
              "steps": [
                {
                  "id": "fb159d38-591e-432e-9b27-6bd6d7c493bb",
                  "name": "Page 1",
                  "layout": {
                    "large": {
                      "items": [
                        {
                          "fieldId": "c4668719-180a-4ffe-8c60-3dbc11a9843d",
                          "row": 0,
                          "column": 0,
                          "width": 12,
                          "height": 1
                        }
                      ]
                    }
                  }
                }
              ]
            }
          }
        }
      ]
    }
  }
}
