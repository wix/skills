{
  "name": "automations/create-numeric-input-mapping",
  "description": "Nested arithmetic and string composition use numeric conversion and live payload values.",
  "triggerPrompt": "Create an automation named Order reserve estimate. For every order placed, create a task titled Reserve estimate for order followed by the order number and a colon, followed by 10 percent of the order total. This is just a numeric estimate; do not format it as money or round it. Go ahead and save this automation.",
  "tags": [
    "automations"
  ],
  "assertions": [
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/build-simple-wix-automations"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-mapping-expressions"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-action-configuration"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-trigger-configuration"
      }
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Require the title to use the actual order-number field and 0.1 times the actual order-total amount with numeric conversion if the schema uses strings. For order number 42 and total 125, the title conveys Reserve estimate for order 42: 12.5. Adding 10, using 10 times the total, concatenating a percent sign, hardcoding 12.5, or using subtotal fails. Inspect nested expression syntax and field types in the saved inputMapping. No unnecessary code-variable step. All named requirements are mandatory: score 0 for a semantic mismatch even if the automation saved successfully. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Inspect the actual tool trace. Require a direct path with bounded discovery, real catalog IDs, no guessed endpoints, no private tools and no unrequested side effects. Penalize recovered wrong-shaped requests, redundant confirmation after explicit authorization, repeated failed calls and claims unsupported by read-back. Penalize premature currency formatting or rounding followed by repairs, and guessing order amount/number paths rather than inspecting the trigger schema once. Identify each friction and the likely docs or API gap. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 10 only when successful API responses in the tool trace prove the requested automation was persisted and a subsequent Get read-back of its returned ID contains the requested final configuration and INACTIVE status. Inspect response bodies, not just the agent's summary or submitted request. Missing read-back, a failed save, schema-stripped required node info, or unverified success scores 0. No activation, test execution, deletion, or unrelated writes are allowed unless the user explicitly requested them. A correct blocker explanation is honest but does not pass this successful-persistence scenario. Return only a JSON object with score and reason."
    }
  ],
  "siteSetup": {
    "templateId": "stores-v3-editor"
  }
}
