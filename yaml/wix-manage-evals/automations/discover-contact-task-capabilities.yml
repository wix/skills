  "name": "automations/discover-contact-task-capabilities",
  "description": "Read-only site catalog discovery for a contact-created task workflow, whether or not a task action is installed.",
  "triggerPrompt": "Check whether my site supports creating a task when a contact is added. Show me the available trigger and action and what information I would need to configure them.",
  "assertions": [
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/inspect-wix-automations"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-api-catalog"
      }
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 10 only when successful site-scoped public catalog responses establish the contact-created trigger, and the answer reports the task-creation action exactly as the catalog shows it: if the catalog returns an installed task-creation action, use its returned identity and schema to explain the required configuration; if it returns none, say plainly that no task-creation action is installed on this site and what the user could do (for example install the app that provides it), without presenting a different action as a task action. Do not accept guessed IDs, invented actions, generic claims, or a blocker instead of a completed catalog lookup. No automation or other site data may be created, changed, activated or tested. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10 for the actual tool path. Paging through the full action catalog once is expected when establishing that no task-creation action is installed, and is not a detour. Penalize re-fetching the same catalog page or schema, unbounded or repeated broad searches after the answer is established, selecting a similarly named trigger or action without checking its schema, private calls, guessed endpoints or unnecessary mutation confirmation for this read-only request. Name each detour and its docs or API cause. Return only a JSON object with score and reason."
    }
  ]
}
