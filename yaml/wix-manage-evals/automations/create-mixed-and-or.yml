{
  "name": "automations/create-mixed-and-or",
  "description": "Mixed AND/OR, missing-value handling and distinct true/false outcomes.",
  "triggerPrompt": "Create an automation named Education or urgent review. When an order is placed, add a note about the buyer to my Wix Inbox titled Review priority order if the buyer email contains .edu and the buyer left a nonempty note, or if the note contains urgent (case-insensitive). Otherwise add an Inbox note titled Standard order. Go ahead and save this automation.",
  "tags": [
    "automations"
  ],
  "assertions": [
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/build-and-manage-wix-automations"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-conditions"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-graph-and-data-model"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-action-configuration"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-mapping-expressions"
      }
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Require ((email contains .edu AND nonempty note) OR note contains urgent), with case-insensitive urgent and missing email/note safely handled. Examples: .edu + ordinary note -> priority; .edu + empty note -> standard; other email + URGENT -> priority; other email + ordinary note -> standard. A CODE_CONDITION must declare every payload field it reads in dynamicVariableExpressions and return a boolean. Equivalent visual branches are acceptable only if each input produces exactly one correct Inbox note (Show in Inbox, `inbox-send-message`, linked to the trigger's contact); no multi-group CONDITION, shared child or MERGE. All named requirements are mandatory: score 0 for a semantic mismatch even if the automation saved successfully. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Inspect the actual tool trace. Require a direct path with bounded discovery, real catalog IDs, no guessed endpoints, no private tools and no unrequested side effects. Penalize recovered wrong-shaped requests, redundant confirmation after explicit authorization, repeated failed calls and claims unsupported by read-back. Penalize attempting unsupported multi-group visual conditions before choosing a supported representation, or repeatedly repairing undeclared code-condition inputs. Action IDs and namespaces are chosen by the caller, so a generated one is not a guessed ID. Reading the skill's documentation articles is expected and is not friction. URI-encoded string literals (such as %20), as the expression reference requires, and functions from its list are documented syntax, not guesses; wrong arity, wrong argument types, or an encoded date-time literal in a formula field still count as errors. Tool response bodies may be abbreviated in the trace: do not penalize a read-back only because its body is not shown. Identify each friction and the likely docs or API gap. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 10 only when the tool trace shows the save request (Create, or Update for an existing automation) carrying the requested configuration and returning without an error, followed by a Get Automation call for the returned ID. Tool response bodies may be abbreviated or missing in what you see: when a body is not shown, judge from the requests, the absence of errors and the final answer, and do not fail a run only because a body is missing; when a body is shown, it must match the request. The saved automation must be INACTIVE unless the user asked to turn it on. A failed or never-sent save, no Get after it, or a success claim the trace contradicts scores 0. No activation, test execution, deletion, or unrelated writes are allowed unless the user explicitly requested them. A correct blocker explanation is honest but does not pass this successful-persistence scenario. Return only a JSON object with score and reason."
    }
  ],
  "siteSetup": {
    "templateId": "stores-v3-editor"
  }
}
