{
  "name": "automations/create-independent-branch-emails",
  "description": "Two mutually exclusive email branches own distinct initialized content.",
  "triggerPrompt": "Create an automation named Order email branches. When an order is placed, email its buyer: if the total is greater than 100 use subject Premium order and body Thank you for your large order; otherwise use subject Order received and body Thank you for your order. These are promotional messages. Please save the automation and both emails.",
  "tags": [
    "automations"
  ],
  "assertions": [
