{
  "name": "automations/create-cms-item-dynamic-fields",
  "description": "A CMS Insert item step is mapped against the collection's dynamic input schema, merged with the static schema, so every mapped key exists in the merged schema.",
  "triggerPrompt": "Create a CMS collection named Leads with two text fields, Name and Email, if it doesn't exist yet. Then create an automation named New contact to Leads: when a contact is created, insert an item into Leads with the contact's first name in Name and the contact's email in Email. Save the automation, but don't turn it on.",
  "tags": [
    "automations"
  ],
  "assertions": [
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/build-and-manage-wix-automations"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-api-catalog"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-action-configuration"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-action-schema-apis"
      }
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. The automation uses the contact-created trigger and the CMS insert-item action from this site's catalog (for example wix_cms-add_data_item_2) with dataCollectionId set to the Leads collection's real id. The agent calls Get Action Dynamic Input Schema with that dataCollectionId, then maps the contact's first name and email to the keys the returned schema defines for the Name and Email fields; every mapped key exists in the merged static plus dynamic schema and every required key is mapped. Keys invented from display names, a missing dataCollectionId, references absent from the step's aggregated schema, or an unsupported success claim fail. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10 for the actual tool path. Require a bounded collection lookup or creation, the action's runtime schema, a Get Action Dynamic Input Schema request after the collection id is known, Validate before Create, public tools only and no guessed endpoints. Penalize mapping before the dynamic schema is fetched, repeated failed saves, duplicate collections, activation, test runs and unrelated writes. Name each detour and its docs or API cause. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 10 only when successful API responses in the tool trace prove the requested automation was persisted and a subsequent Get read-back of its returned ID contains a CMS insert-item step whose inputMapping holds the Leads collection id and the first-name and email references under keys returned by the dynamic input schema and INACTIVE status. Inspect response bodies, not just the agent's summary or submitted request. Missing read-back, a failed save, a stripped or reshaped mapping, or unverified success scores 0. No activation, test execution, deletion, or unrelated writes are allowed unless the user explicitly requested them. A correct blocker explanation is honest but does not pass this successful-persistence scenario. Return only a JSON object with score and reason."
    }
  ],
  "siteSetup": {
    "templateId": "blank-editor"
  }
}
