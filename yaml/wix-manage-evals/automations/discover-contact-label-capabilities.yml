  "assertions": [
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/build-and-manage-wix-automations"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-api-catalog"
      }
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 10 only when successful site-scoped public catalog responses establish the contact-created trigger and label action, using their returned identities and schemas to explain required configuration. Do not accept guessed IDs, generic claims, or a blocker instead of successful discovery. No automation or other site data may be created, changed, activated or tested. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10 for the actual tool path. Penalize broad repeated catalog requests, selecting a similarly named trigger without checking its schema, private calls, guessed endpoints or unnecessary mutation confirmation for this read-only request. Name each detour and its docs or API cause. Return only a JSON object with score and reason. Evaluate endpoint provenance against the retrieved public method schemas; a verified public Resolve URL is not a guessed or private endpoint merely because its path is short."
    }
  ]
