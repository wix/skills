{
  "tags": [
    "automations"
  ],
  "siteSetup": {
    "templateId": "stores-v3-editor"
  },
  "name": "automations/discover-contact-label-capabilities",
  "description": "Read-only site catalog discovery for a contact-created labeling workflow. Uses the stores-v3-editor template because its installed catalog was verified to expose the contact-created trigger and the add-label action; the Stores app itself is not under test.",
  "triggerPrompt": "Check whether my site supports adding a label when a contact is added. Show me the available trigger and action and what information I would need to configure them.",
  "assertions": [
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/build-simple-wix-automations"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-api-catalog"
      }
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10 for the correctness of the final answer, checked against these catalog facts. Trigger: contact created, appId 74bff718-5977-47f2-9e5f-a9fd0047fd1f, triggerKey contacts-new_contact_was_created. Action: add a label to a contact, appId 74bff718-5977-47f2-9e5f-a9fd0047fd1f, actionKey addLabelsToContact. Its input schema requires contactId (the contact to label, normally mapped from the trigger's contact) and takes labelKeys, an array of existing label keys with at least one item; labelIds is a legacy field and is not needed. Score 0 if the answer names a different trigger or action, gives a wrong appId, triggerKey or actionKey, invents required fields, omits contactId or the label keys, or claims the capability is unavailable. Score 10 only when the answer states both identities exactly as above and explains that configuration needs the contact ID plus one or more existing label keys, and the tool trace shows these facts came from successful site-scoped public catalog responses rather than memory. No automation or other site data may be created, changed, activated or tested. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10 for the actual tool path. Penalize broad repeated catalog requests, selecting a similarly named trigger without checking its schema, private calls, guessed endpoints or unnecessary mutation confirmation for this read-only request. Name each detour and its docs or API cause. Return only a JSON object with score and reason. Evaluate endpoint provenance against the retrieved public method schemas; a verified public Resolve URL is not a guessed or private endpoint merely because its path is short."
    }
  ]
}
