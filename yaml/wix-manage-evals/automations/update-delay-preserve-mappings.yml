{
  "name": "automations/update-delay-preserve-mappings",
  "description": "A seeded update changes only delay timing, retaining existing action mappings and graph IDs.",
  "triggerPrompt": "In the provided test site, change the wait in Welcome follow-up fixture from 24 hours to 2 days. Keep its name, trigger, task content, contact links, and everything else unchanged. I approve saving this edit. Keep it inactive and do not run it.",
  "tags": [
    "automations"
  ],
  "assertions": [
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/build-and-manage-wix-automations"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-validation-and-persistence"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-delays-variables-and-branches"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-action-configuration"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-mapping-expressions"
      }
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Locate the seeded automation by its exact name and read it before updating, requesting override schemas. Require one successful update of that existing returned ID, fresh revision, followed by Get. The only intentional differences are offsetExpression {{2}} and offsetTimeUnit DAYS on the existing delay. Ignore server-managed revision/timestamps only. Compare every task inputMapping (including the nested first-name fallback), action ID, namespace, edge, displayName, trigger, root IDs, origin, settings and INACTIVE status against the before response. No Create, Delete, replacement graph or omitted fields. Missing seed is a setup failure, never a passing no-op. All named requirements are mandatory: score 0 for a semantic mismatch even if the automation saved successfully. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Inspect the actual tool trace. Require a direct path with bounded discovery, real catalog IDs, no guessed endpoints, no private tools and no unrequested side effects. Penalize recovered wrong-shaped requests, redundant confirmation after explicit authorization, repeated failed calls and claims unsupported by read-back. Identify each friction and the likely docs or API gap. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 10 only when successful API responses in the tool trace prove the requested automation was persisted and a subsequent Get read-back of its returned ID contains the requested final configuration and INACTIVE status. Inspect response bodies, not just the agent's summary or submitted request. Missing read-back, a failed save, schema-stripped required node info, or unverified success scores 0. No activation, test execution, deletion, or unrelated writes are allowed unless the user explicitly requested them. A correct blocker explanation is honest but does not pass this successful-persistence scenario. Return only a JSON object with score and reason."
    }
  ],
  "siteSetup": {
    "templateId": "blank-editor",
    "bootstrap": {
      "steps": [
        {
          "label": "Seed inactive automation to update",
          "method": "post",
          "url": "https://www.wixapis.com/automations-service/v2/automations",
          "body": {
            "automation": {
              "name": "Welcome follow-up fixture",
              "origin": "USER",
              "configuration": {
                "status": "INACTIVE",
                "trigger": {
                  "appId": "74bff718-5977-47f2-9e5f-a9fd0047fd1f",
                  "triggerKey": "contacts-new_contact_was_created",
                  "filters": []
                },
                "rootActionIds": [
                  "650c6d61-0000-4000-8000-000000000001"
                ],
                "actions": {
                  "650c6d61-0000-4000-8000-000000000001": {
                    "id": "650c6d61-0000-4000-8000-000000000001",
                    "type": "APP_DEFINED",
                    "namespace": "createTask-1",
                    "displayName": "Create follow-up task",
                    "appDefinedInfo": {
                      "appId": "146c0d71-352e-4464-9a03-2e868aabe7b9",
                      "actionKey": "createTask",
                      "inputMapping": {
                        "contactId": "{{var(\"contactId\")}}",
                        "title": "Welcome {{if(or(isEmpty(var(\"contact.name.first\"));isEmptyString(var(\"contact.name.first\")));\"new%20friend\";var(\"contact.name.first\"))}}"
                      },
                      "skipConditionOrExpressionGroups": [],
                      "postActionIds": [
                        "650c6d61-0000-4000-8000-000000000002"
                      ]
                    }
                  },
                  "650c6d61-0000-4000-8000-000000000002": {
                    "id": "650c6d61-0000-4000-8000-000000000002",
                    "type": "DELAY",
                    "namespace": "DELAY-2",
                    "displayName": "Wait before follow-up",
                    "delayInfo": {
                      "offsetExpression": "{{24}}",
                      "offsetTimeUnit": "HOURS",
                      "postActionIds": [
                        "650c6d61-0000-4000-8000-000000000003"
                      ]
                    }
                  },
                  "650c6d61-0000-4000-8000-000000000003": {
                    "id": "650c6d61-0000-4000-8000-000000000003",
                    "type": "APP_DEFINED",
                    "namespace": "createTask-3",
                    "displayName": "Create follow-up task",
                    "appDefinedInfo": {
                      "appId": "146c0d71-352e-4464-9a03-2e868aabe7b9",
                      "actionKey": "createTask",
                      "inputMapping": {
                        "contactId": "{{var(\"contactId\")}}",
                        "title": "Follow up with {{var(\"contact.name.first\")}}"
                      },
                      "skipConditionOrExpressionGroups": [],
                      "postActionIds": []
                    }
                  }
                }
              }
            }
          }
        }
      ]
    }
  }
}
