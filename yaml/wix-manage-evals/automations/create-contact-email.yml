{
  "name": "automations/create-contact-email",
  "description": "New trigger-contact email uses the actual schema identity rather than owner defaults.",
  "triggerPrompt": "Create an automation named Contact welcome. Whenever a contact is created, send that contact a promotional email with subject Welcome and body Thanks for joining us. Please create its content and save it.",
  "tags": [
    "automations"
  ],
  "assertions": [
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/build-and-manage-wix-automations"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-email-actions"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-action-configuration"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-trigger-configuration"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-validation-and-persistence"
      }
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Exactly one initializer with the actual trigger contact identity path as plain text (not var syntax or an address). PROMOTIONAL type, no invented topic/sender ID. Read-back proves trigger contact is recipient rather than site owner. Subject Welcome and body Thanks for joining us. Use Generate Action Input Mapping (not Generate Input Mapping From Intent), pass each returned appId/actionKey/inputMapping unchanged to its new node, persist before addressing Get/Set Email Content by returned automation ID and action ID, verify content and automation by successful read-backs. One generated mapping per action only; every additional new email needs its own call. Never fabricate provider IDs or initialize an existing email just to edit it. No sends, previews, mapping-copy calls or activation. Missing rollout/permission support is blocked execution, not a passing successful creation. Score 0 for any missing mandatory result or unsupported success claim. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Inspect the actual tool trace. Require a direct path with bounded discovery, real catalog IDs, no guessed endpoints, no private tools and no unrequested side effects. Penalize recovered wrong-shaped requests, redundant confirmation after explicit authorization, repeated failed calls and claims unsupported by read-back. Penalize generating content for a guessed contact path before schema discovery, or hand-editing the opaque initializer mapping and then regenerating it to repair failures. Identify each friction and the likely docs or API gap. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 10 only when successful API responses in the tool trace prove the requested automation was persisted and a subsequent Get read-back of its returned ID contains the requested final configuration and INACTIVE status. Inspect response bodies, not just the agent's summary or submitted request. Missing read-back, a failed save, schema-stripped required node info, or unverified success scores 0. No activation, test execution, deletion, or unrelated writes are allowed unless the user explicitly requested them. A correct blocker explanation is honest but does not pass this successful-persistence scenario. Return only a JSON object with score and reason."
    }
  ],
  "siteSetup": {
    "templateId": "blank-editor"
  }
}
