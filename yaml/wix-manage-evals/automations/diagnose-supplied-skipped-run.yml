{
  "name": "automations/diagnose-supplied-skipped-run",
  "description": "A status question for an automation name that does not exist on the site is answered as not found, without guessing an ID or a status (name retained from an earlier draft so the eval gate replaces it).",
  "triggerPrompt": "Is my Birthday Coupon automation turned on?",
  "tags": [
    "automations"
  ],
  "assertions": [
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/inspect-wix-automations"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-activation-status"
      }
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 10 only when the agent queries the site's automations by the name Birthday Coupon, finds no match, says plainly that no automation with that name was found, and asks the user to check the name or the site. It must not guess or invent an automation ID, report any ACTIVE or INACTIVE status, substitute a different automation, or create, activate or test anything. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10 for the tool trace. Require a bounded Query Automations through public tools. Penalize guessed IDs or Get calls on invented IDs, unbounded listing of unrelated automations, catalog discovery, any write, status toggle or test run, and repeated identical queries. Return only a JSON object with score and reason."
    }
  ],
  "siteSetup": {
    "templateId": "blank-editor"
  }
}
