{
  "name": "automations/diagnose-supplied-skipped-run",
  "description": "Interpret a supplied SKIPPED run from its exact skip reason without inventing a cause or touching the site.",
  "triggerPrompt": "My automation didn't do anything for a new contact yesterday. The activity view shows this for the run (copied from the logs I exported):\n\n```json\n{\n  \"status\": \"SKIPPED\",\n  \"skippedInfo\": {\n    \"reason\": \"FILTERS_NOT_PASSED\"\n  },\n  \"automationRevision\": 4\n}\n```\n\nWhy didn't it run, and what should I check? Feel free to look things up in the public docs, but please don't touch my site or rerun anything.",
  "tags": [
    "automations"
  ],
  "assertions": [
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/build-and-manage-wix-automations"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-run-diagnosis"
      }
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Score 10 only when the response explains that a SKIPPED run means no actions ran, reports the supplied skip reason FILTERS_NOT_PASSED exactly, explains it as the trigger's filters not passing for that event, and points the user to the trigger filters of the configuration that ran (revision 4) as the next thing to check. It must not call the run a failure, invent a different or additional cause, claim to have fetched logs or site data, or offer an undocumented log or revision lookup. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Judge the explanation and any tool trace against the supplied log; public documentation reads are explicitly allowed and must not be penalized. Penalize any site call, catalog discovery, automation read or write, or rerun/test despite the supplied-log-only request. Return only a JSON object with score and reason."
    }
  ]
}
