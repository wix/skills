name: livetest/confirm-fail-check
description: >-
  Scratch scenario used to smoke-test confirm-on-fail's confirmed-failure
  path end-to-end. Designed to fail its llm_judge deterministically on
  every attempt. Not a real skill eval — safe to delete, part of a
  throwaway PR.
triggerPrompt: >-
  List the top 3 Wix site template categories that would suit a small
  bakery business.
tags:
  - livetest
maxTokens: 30000
assertions:
  - tool: SearchSiteTemplates
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/site-templates/skills/search-templates
  - type: llm_judge
    minScore: 7
    prompt: >-
      Pass only if the agent's final response contains the exact string
      "LIVETEST-CONFIRM-FAIL-9f31". Fail otherwise. This is a synthetic QA
      scenario — a normal, correct response for this task will never
      contain that string, so failing here is the expected, correct
      outcome on every attempt.
  - type: llm_judge
    minScore: 7
    prompt: >-
      Rate the tool-call path taken. Fail (score below 7) if the agent
      made wasted calls, retried errors, or asked unnecessary clarifying
      questions.
