name: calendar/site-opening-hours-routing
description: Route general site opening hours to Site Properties without changing booking availability.
triggerPrompt: Set my website's general opening hours to Monday through Friday, 9am to 5pm, closed on weekends.
tags:
  - calendar
  - bookings
siteSetup:
  mode: template
  templateId: blank-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: >-
        https://dev.wix.com/docs/api-reference/business-management/calendar/skills/configure-default-business-hours
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: >-
      The agent updates the Site Properties business schedule to Monday-Friday 09:00-17:00 with
      weekends closed, and confirms completion from successful API results. Fail if it mutates
      Calendar WORKING_HOURS, installs Bookings, changes booking availability, merely explains the
      task without doing it. Return ONLY {"score":<0-10>,"reason":"<evidence-based assessment>"}.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: >-
      Score 0-10 for the tool-call path. A direct path reads the current site schedule, updates the
      requested weekly periods through Site Properties, and verifies the result. Score below 7 if it
      probes Calendar schedules, installs Bookings, mutates either the wrong schedule or holiday
      exceptions, or recovers from a guessed request shape. Necessary read-before-write and
      verification calls are not friction. List errors and avoidable detours. Return ONLY
      {"score":<0-10>,"reason":"<frictions or clean path>"}.
