name: calendar/site-opening-hours-routing
description: Route general site opening hours to Site Properties without changing booking availability.
triggerPrompt: Set my website's general opening hours to Monday through Friday, 9am to 5pm, closed on weekends.
tags:
  - calendar
  - bookings
siteSetup:
  mode: template
  templateId: blank-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: >-
        https://dev.wix.com/docs/api-reference/business-management/calendar/skills/configure-default-business-hours
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: >-
      The agent updates the Site Properties business schedule to Monday-Friday 09:00-17:00 with
      weekends closed, and confirms completion from successful API results. Fail if it mutates
      Calendar WORKING_HOURS, installs Bookings, changes booking availability, merely explains the
      task without doing it. Return ONLY {"score":<0-10>,"reason":"<evidence-based assessment>"}.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: >-
      Score 0-10 for the tool-call path. Read the actual tool arguments and executed API
      requests, not just documentation titles or URL categories. Loading the required
      configure-default-business-hours recipe is valid routing, even though its URL contains
      /calendar/; it is NOT a Calendar API probe. Relevant Site Properties documentation reads
      and required schema checks are allowed.
      A clean path reads the current Site Properties business schedule, updates the requested
      weekly periods, then reads the persisted schedule back and checks it before reporting
      success. These requests may be batched inside one tool execution; count the API requests
      in that execution, not the number of tool calls. Echoing the submitted body is not readback.
      Score below 7 for an actual Calendar schedule/event API call, Bookings installation,
      unauthorized changes to holiday exceptions, a failed guessed request shape, or missing
      post-update readback verification. Penalize avoidable repeated discovery; do not penalize
      the required recipe read or necessary read-before-write and verification requests.
      Cite the actual API operation or missing verification behind each penalty.
      Return ONLY {"score":<0-10>,"reason":"<frictions or clean path>"}.
