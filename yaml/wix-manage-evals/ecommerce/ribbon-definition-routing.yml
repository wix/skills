name: ecommerce/ribbon-definition-routing
description: Create a visual ribbon through Catalog V3 without creating a promotion.
triggerPrompt: Create a ribbon named Bestseller for my store.
tags:
  - ecommerce
  - stores
siteSetup:
  mode: template
  templateId: stores-v3-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: >-
        https://dev.wix.com/docs/api-reference/business-solutions/e-commerce/skills/pricing-promotions
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: >-
      Pass if the agent creates or reuses a Catalog V3 ribbon named Bestseller, obtains its ID and
      reports success from an API result. Fail if it creates a coupon or discount rule, changes a
      product or price, assigns the ribbon, or only gives instructions. Return ONLY
      {"score":<0-10>,"reason":"<evidence-based assessment>"}.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: >-
      Score 0-10 for the tool-call path. Reading the required pricing-promotions dispatcher
      is part of the correct route: it contains the ribbon instructions and example. Do not
      penalize that read as unrelated promotion discovery based on the page title or URL.
      README, then that dispatcher, then a successful Get or Create Ribbon request is a
      clean path deserving 10. A relevant ribbon API reference read is also acceptable.
      Score below 7 if the agent follows the dispatcher into the separate
      pricing-create-discount-rule recipe or discount-rule schema discovery for this
      ribbon-only task, attempts a coupon/discount mutation, retries duplicate ribbon creation
      instead of using get-or-create, or performs unrelated promotion-strategy/context discovery.
      Evaluate the actual calls and cite the specific detour; the dispatcher itself is not
      discount-rule creation guidance. Return ONLY {"score":<0-10>,"reason":"<frictions or clean path>"}.
