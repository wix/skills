name: ecommerce/ribbon-definition-routing
description: Create a visual ribbon through Catalog V3 without creating a promotion.
triggerPrompt: Create a ribbon named Bestseller for my store.
tags:
  - ecommerce
  - stores
siteSetup:
  mode: template
  templateId: stores-v3-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: >-
        https://dev.wix.com/docs/api-reference/business-solutions/e-commerce/skills/pricing-promotions
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: >-
      Pass if the agent creates or reuses a Catalog V3 ribbon named Bestseller, obtains its ID and
      reports success from an API result. Fail if it creates a coupon or discount rule, changes a
      product or price, assigns the ribbon, or only gives instructions. Return ONLY
      {"score":<0-10>,"reason":"<evidence-based assessment>"}.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: >-
      Score 0-10 for the tool-call path. A direct path routes to Get or Create Ribbon and performs
      the name-based ribbon operation. Score below 7 if it loads discount-rule creation guidance for
      this ribbon-only task, attempts a discount mutation, retries duplicate ribbon creation instead
      of using get-or-create, or performs promotion-strategy/context discovery unrelated to the
      request. List errors and avoidable detours. Return ONLY {"score":<0-10>,"reason":"<frictions
      or clean path>"}.
