name: ecommerce/recommend-strategy-conversion-boundary
description: Positive boundary control — a conversion request that mentions visitors/traffic ("lots of visitors but few buy") must STILL load the recommend-e-commerce-strategy orchestrator, so the traffic-acquisition exclusion does not over-block genuine sales-improvement intents.
triggerPrompt: For my site Gracia (331d0c05-2ab0-4edb-91a6-4078c7e500b9) I get plenty of visitors but hardly any of them buy anything. What should I do to turn more of them into orders? Give me concrete actions I can approve.
tags: [ecommerce]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/e-commerce/skills/recommend-e-commerce-strategy
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The merchant mentions traffic ("plenty of visitors") but the actual ask is converting that existing traffic into orders — exactly what the "Recommend: eCommerce Strategy" orchestrator covers via discounts and shipping. This IS in scope; only acquisition (getting MORE visitors) is out of scope.
      Pass if the agent loads the orchestrator and produces concrete, approvable recommendations grounded in live site data (citing values such as AOV, order count, visitor count, country, or currency from API responses).
      Fail if the agent declines or routes away on the grounds that the request mentions traffic, answers with acquisition advice (SEO, ads, social) instead of conversion recommendations, produces generic advice with no API-grounded data, or asks clarifying questions instead of executing.
      Topic-completeness across all discount goals and shipping is NOT required to pass — judge that the orchestrator was correctly triggered and produced grounded, approvable recommendations.
