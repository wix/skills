name: ecommerce/gift-cards/goal-sell-gift-cards
description: A gift-card prompt should reach the strategy orchestrator, activate its GIFT_CARDS domain, load the gift-cards goal, size denominations from the site's own data, and persist the recommendation via tracking.
triggerPrompt: For my site Gracia (331d0c05-2ab0-4edb-91a6-4078c7e500b9) should I sell gift cards? If it's worth it, tell me exactly which amounts to offer.
tags: [ecommerce]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/e-commerce/skills/recommend-e-commerce-strategy
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/e-commerce/skills/goal-sell-gift-cards
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Pass if the response (a) routes through the recommend-ecommerce-strategy orchestrator and activates its GIFT_CARDS domain rather than treating gift cards as a standalone entry point, (b) checks whether the site already sells gift cards via Query Gift Card Products before recommending anything — a site supports only one gift card product, (c) proposes 3-5 preset denominations AND a custom amount range visibly derived from this site's own data (AOV and/or catalog price distribution) in the site's own currency, not a generic 25/50/100 ladder, (d) defaults to no expiration with a reason, or if it proposes one, at least 60 months flagged as needing a compliance check, and (e) loads or references api-recommendation-tracking and persists the recommendation via BatchCreate with domain "gift_cards" before presenting it, echoing the returned id/revision.
      Fail if the response invents denominations with no data call, skips the existing-gift-card-product check, skips the tracking lifecycle, calls Create Gift Card Product before the merchant approves, hard-codes a currency symbol that isn't the site's, or marks urgency CRITICAL.
      Topic-completeness beyond the gift-card recommendation is NOT required — other domains may also appear in the orchestrator's set.
