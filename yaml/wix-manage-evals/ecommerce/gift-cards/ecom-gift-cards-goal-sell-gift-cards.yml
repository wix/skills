name: ecommerce/gift-cards/goal-sell-gift-cards
description: A gift-card prompt should reach the strategy orchestrator, activate its GIFT_CARDS domain, load the gift-cards goal, size denominations from the site's own data, and persist the recommendation via tracking.
triggerPrompt: For my site Gracia (331d0c05-2ab0-4edb-91a6-4078c7e500b9) should I sell gift cards? If it's worth it, tell me exactly which amounts to offer.
tags: [ecommerce]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/e-commerce/skills/recommend-e-commerce-strategy
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/e-commerce/skills/goal-sell-gift-cards
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      This scenario has two acceptable outcomes. Judge whichever one the site's data supports — do NOT require denominations if the agent established it had no data to size them from.

      Outcome 1 — a gift card recommendation. Pass if the response (a) loads the recommend-ecommerce-strategy orchestrator and treats gift cards as one of its domains rather than a standalone entry point, (b) checks whether the site already sells gift cards via Query Gift Card Products before recommending anything — a site supports only one gift card product, (c) proposes 3-5 preset denominations AND a custom amount range derived from this site's own data (AOV, or the catalog price distribution when AOV is unavailable) in the site's own currency, (d) states the expiration stance — no expiry by default with a reason, or at least 60 months flagged as needing a compliance check, and (e) persists the recommendation via BatchCreate with domain "gift_cards" before presenting it, echoing the returned id/revision.

      Outcome 2 — an honest no-data stop. If the site has neither an AOV nor usable catalog price data, pass if the response says it cannot size denominations yet, explains why, and offers a way forward (e.g. asking the merchant for a typical order value). Checking for an existing gift card product is still expected. Denominations, persistence, and expiry are NOT expected in this outcome, because there is nothing to persist.

      Fail if the response invents denominations, product names, or prices it did not get from an API response; proposes a generic 25/50/100 ladder while real AOV or catalog data was available; skips the existing-gift-card-product check; presents a real recommendation without persisting it via BatchCreate; calls Create Gift Card Product before the merchant approves; hard-codes a currency symbol that isn't the site's; or marks urgency CRITICAL.

      Topic-completeness beyond the gift-card outcome is NOT required — other domains may also appear in the orchestrator's set.
