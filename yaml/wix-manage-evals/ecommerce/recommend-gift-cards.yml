name: ecommerce/recommend-gift-cards
description: "Should I sell gift cards, and at what amounts — should load the gift-cards skill, check for an existing gift card product first, and size denominations from the site's own data without creating anything."
triggerPrompt: For my site Gracia (331d0c05-2ab0-4edb-91a6-4078c7e500b9) should I sell gift cards? If it's worth it, tell me exactly which amounts to offer.
tags: [ecommerce]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/e-commerce/skills/recommend-gift-cards
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Pass if the response (a) loads the `recommend-gift-cards` skill, (b) checks whether the site already sells gift cards via Query Gift Card Products before recommending anything — a site supports only one gift card product, (c) proposes 3-5 preset denominations AND a custom amount range visibly derived from this site's own data (AOV and/or catalog price distribution) in the site's own currency, not a generic 25/50/100 ladder, and (d) defaults to no expiration with a reason, or, if it proposes one, at least 60 months flagged as needing a compliance check.
      Fail if the response invents denominations with no data call, skips the existing-gift-card-product check, calls Create Gift Card Product without the merchant approving first, drifts into discounts/coupons/shipping recommendations, hard-codes a currency symbol that isn't the site's, or marks urgency CRITICAL.
      Tracking/persistence is NOT expected — this skill returns the recommendation inline. Topic-completeness beyond the single gift-card recommendation is NOT required.
