name: sites/create-headless-site
description: >-
  Verifies the agent reads the create-headless-site skill, follows it to the upload recipe, and
  creates the headless site with the Headless Business Setup provision API and origin "drop",
  instead of using the meta-site template API with a HEADLESS namespace.
triggerPrompt: >-
  Create a new Wix Headless site for my project called "Acme Studio", so I can put my own frontend
  on it. Explain which API call you would make and what the request body looks like.
tags: [sites]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/account-level/sites/skills/create-headless-site
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user wants a new Wix Headless site named "Acme Studio" for their own frontend, and asked
      which API call creates it and what the request body looks like.
      Intent: create the headless site with the Headless Business Setup provision API —
      POST https://www.wixapis.com/headless-business-setup/v1/headless-business/provision — as the
      upload recipe (Upload a Website or HTML Files) does, then put the frontend on it by uploading
      its files.

      Pass if the response:
      - creates the site with the provision endpoint (POST .../headless-business-setup/v1/headless-business/provision), AND
      - shows a request body with a newMetasite target carrying a naming strategy (e.g.
        metaSiteName "Acme Studio") and an origin of "drop".
      A response that additionally asks the user to confirm before creating, or explains how the
      frontend's files get uploaded afterwards, still PASSES.

      Fail if the response:
      - creates the site with the meta-site template API (msm/v1/meta-site/create-from-template),
        with or without a namespace: "HEADLESS" field, OR
      - omits the provision endpoint or the request body shape, OR
      - is generic with no specific endpoint, OR
      - sends no origin, or an origin other than "drop".
