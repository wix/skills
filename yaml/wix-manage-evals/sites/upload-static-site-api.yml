name: sites/upload-static-site-api
description: >-
  Verifies that, handed the finished HTML in the conversation, the agent publishes it itself and
  says so honestly. With the user's identity it publishes straight into their account (create the
  headless site, then one multipart drop) and returns the live URL and the dashboard link; with no
  identity it publishes anonymously (create, upload, release) and returns the live URL and the
  save link. Guards against invented endpoints, JSON uploads, template site creation, claiming a
  site is live without a URL, and handing the user the drop page when the agent could publish the
  page itself. The Wix MCP routes ready-made site files to the drop page before any docs read, so
  the scenario asserts on the outcome and on what was not called rather than on a
  ReadFullDocsArticle call.
triggerPrompt: >-
  The landing page is done and it's exactly right — here it is. Can you put it online for me? I
  don't have a Wix site yet and I'd rather not fiddle with uploading files myself. index.html:
  <!doctype html><html><head><title>Northwind Studio</title><style>body{font-family:sans-serif;
  margin:0;padding:4rem;background:#fafafa}h1{font-size:2.5rem}</style></head><body><h1>Northwind
  Studio</h1><p>Brand and web design for small teams.</p><p>hello@northwind.studio</p></body></html>
tags: [sites]
assertions:
  - tool: CreateSiteFromTemplate
    negate: true
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user pasted the finished landing page (a single index.html, text only) and asked the
      agent to put it online; they have no Wix site and would rather not upload files themselves.
      The page is in the conversation, so the agent can carry it: from a shell with curl -F, or
      as a string multipart body through the Wix MCP's ExecuteWixAPI tool (wix.request).
      Judge the tool-call trace and the final answer.

      Pass if the response does ONE of these:
      - Publish into the user's account (the agent holds the user's identity): POST
        https://www.wixapis.com/headless-business-setup/v1/headless-business/provision (no
        business solutions, "origin": "drop"), then POST
        https://www.wixapis.com/headless-business-setup/v1/headless-business/{metaSiteId}/drop as
        multipart/form-data with a `files` part named index.html; reports the `siteUrl` the drop
        returned, plus the dashboard link https://manage.wix.com/dashboard/{metaSiteId}.
      - Publish anonymously from a shell, optionally claimed afterwards: POST .../v1/headless-business/anonymous/{anonymousId}
        → POST .../anonymous/{anonymousId}/{metaSiteId}/upload as multipart with `files` →
        POST .../anonymous/{anonymousId}/{metaSiteId}/release with {"uploadId"}; reports the
        live siteUrl and the save link
        https://www.wix.com/live-headless-site/{projectId}?anonymousId={anonymousId}. If it then
        claims the site with the user's identity, it reads the new viewUrl via Query Sites
        (HEADLESS namespace) and reports that instead of the pre-claim URL.
      - A publish call failed in a way the agent could not fix, and it says so and hands over the
        drop URL https://www.wix.com/headless/drop keeping utm_campaign=mcp.

      Fail if the response:
      - claims the site is live without a URL returned by a drop or release call, OR
      - invents endpoints, paths, or field names that are not the ones above, OR
      - sends the page as a JSON body instead of multipart/form-data, OR
      - creates the site from a template, OR
      - hands over the drop page without attempting to publish, although the page was in the
        conversation, OR
      - routes to Site Import, or tells the user to paste the HTML into an existing Wix site or a
        site's media files, OR
      - after a claim, gives the user the pre-claim instant-… URL as the site's address.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Rate how directly the agent published the page. Examine the tool-call trace, not the final
      answer. Score 0-10, where 10 means a direct path: provision → drop with identity, or
      create → upload → release without, and nothing unrelated in between. Reading the
      upload-static-site skill article first is fine.
      Calibration: a clean run is 9-10; one or two redundant docs reads land at 7-8; a probing
      spiral or a wrong-API attempt scores lower.

      Penalize and LIST any of:
        - an anonymous publish followed by a claim when the page could go straight into the account
          (the Wix MCP connected, or a CLI token in the shell): a longer path with a URL change
        - a template site-creation call, or a provision call with business solutions
        - a provision call without "origin": "drop" in its body
        - a call to the site-import API or any crawl/migration tool
        - an upload attempted as JSON rather than multipart
        - calls made out of order, or release attempted without an uploadId
        - a claim made before the release
        - a second site created for the same page
        - probing unrelated docs articles or APIs before settling on the flow

      For each issue, name the likely skill or docs gap that caused the detour.

      Return ONLY {"score":<0-10>,"reason":"<terse list of detours and the
      gap behind each, or 'direct path'>"}
