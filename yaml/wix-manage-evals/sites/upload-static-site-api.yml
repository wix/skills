name: sites/upload-static-site-api
description: >-
  Verifies that, handed the finished HTML in the conversation, the agent publishes it the way its
  environment allows and says so honestly: Path B of the upload-static-site skill (create,
  multipart upload, release through the Headless instant-site API, returning the live URL and the
  save link) when it has a shell that can send files, or Path A (the drop page with the
  attribution parameter) when it reaches Wix only through API-call tools. Guards against invented
  endpoints, JSON or hand-rolled multipart uploads, the template/headless provisioning APIs, and
  claiming a site is live without a URL. The Wix MCP routes ready-made site files to the drop page
  before any docs read, so the scenario asserts on the outcome and on what was not called rather
  than on a ReadFullDocsArticle call.
triggerPrompt: >-
  The landing page is done and it's exactly right — here it is. Can you put it online for me? I
  don't have a Wix site yet and I'd rather not fiddle with uploading files myself. index.html:
  <!doctype html><html><head><title>Northwind Studio</title><style>body{font-family:sans-serif;
  margin:0;padding:4rem;background:#fafafa}h1{font-size:2.5rem}</style></head><body><h1>Northwind
  Studio</h1><p>Brand and web design for small teams.</p><p>hello@northwind.studio</p></body></html>
tags: [sites]
assertions:
  - tool: CreateSiteFromTemplate
    negate: true
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user pasted the finished landing page (a single index.html) and asked the agent to put
      it online; they have no Wix site and would rather not upload files themselves.

      The skill has two paths. Path B — publish through the Headless instant-site API — applies
      only when the agent can read the file bytes AND can send multipart/form-data from a shell
      (curl or a real HTTP client). An agent that reaches Wix only through API-call/execute tools
      cannot upload a file, and the skill tells it to take Path A — hand over the drop page.
      Either outcome is correct; judge whether the agent took the path its environment allows and
      described the result honestly.

      Pass if the response does ONE of these:
      - Path B: runs (or lays out, ready to run in a shell) the three calls in order against
        https://www.wixapis.com/headless-business-setup: POST
        /v1/headless-business/anonymous/{anonymousId} → POST
        /v1/headless-business/anonymous/{anonymousId}/{metaSiteId}/upload as
        multipart/form-data with `files` part(s) → POST
        /v1/headless-business/anonymous/{anonymousId}/{metaSiteId}/release with {"uploadId"};
        reports the live siteUrl from the release response; and tells the user the site is
        anonymous/temporary with the save link
        https://www.wix.com/live-headless-site/{projectId}?anonymousId={anonymousId} (or
        otherwise explains how to keep it). If it holds the user's identity it claims the site
        into their account and returns the final URL instead of stopping at a temporary site.
      - Path A: gives the drop URL https://www.wix.com/headless/drop keeping the utm_campaign=mcp
        parameter, so the user uploads the page there and gets a live site. Saying why it did not
        upload the file itself is a plus, not required; returning the HTML for the user to save is
        fine.

      Fail if the response:
      - claims the site is live, or that it uploaded the files, without a live URL returned by a
        release call, OR
      - invents endpoints, paths, or field names that are not the ones above, OR
      - sends the files as a JSON body instead of multipart/form-data, OR
      - hand-builds a multipart body as a string inside a Wix API-call/execute-API tool instead of
        using a direct multipart file client (curl -F / a real HTTP client), OR
      - creates the site with the meta-site template API or the headless-business provisioning
        API, OR
      - routes to Site Import, or tells the user to paste the HTML into an existing Wix site or a
        site's media files, OR
      - gives a drop URL without utm_campaign=mcp, or no URL at all.
      Mentioning the 1-hour window before the record expires, the 3 MB per file / 20 MB total
      limits, or the top-level-HTML requirement is a plus, not required.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Rate how directly the agent reached a published site or a clean hand-off. Examine the
      tool-call trace, not the final answer. Score 0-10, where 10 means a direct path: either
      create → upload → release with no exploratory or unrelated calls in between, or — with no
      shell to upload from — the drop URL handed over directly, with no site-creation or upload
      attempts. Reading the upload-static-site skill article first is fine; answering with no tool
      calls at all is fine too.
      Calibration: a clean run of either kind is 9-10; one or two redundant docs reads land at
      7-8; a probing spiral or a wrong-API attempt scores lower.

      Penalize and LIST any of:
        - a call to any site-creation API (meta-site templates, headless-business provisioning)
        - a call to the site-import API or any crawl/migration tool
        - an upload attempted as JSON rather than multipart
        - a multipart upload hand-rolled inside a Wix API-call/execute-API tool rather than a direct
          file client (curl -F / real HTTP client)
        - calls made out of order, or release attempted without an uploadId
        - a claim/transfer call made before the release, or against a site that was never released
        - probing unrelated docs articles or APIs before settling on the flow

      For each issue, name the likely skill or docs gap that caused the detour.

      Return ONLY {"score":<0-10>,"reason":"<terse list of detours and the
      gap behind each, or 'direct path'>"}
