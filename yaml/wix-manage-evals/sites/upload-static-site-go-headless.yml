name: sites/upload-static-site-go-headless
description: >-
  Verifies that when a user with a claimed static site (published through the drop flow) asks for
  a real backend feature (store, payments, bookings, CMS, members, forms), the agent reads the
  upload-static-site skill and moves the site to a Wix Headless project — downloading the project
  to disk with a direct HTTP client and following the headless guide, keeping the same site —
  rather than installing Wix Stores on the static site in place or downloading the project through
  the Wix API-call/execute tools (which return into the conversation, not to disk). Without a
  shell the agent lays the steps out for the user to run.
triggerPrompt: >-
  The static site you published to Wix for me through the drop flow is live and I've claimed it
  into my account. Next I want to actually sell products on it — a real store with checkout. Can
  you set that up? I'm in my terminal with the project folder handy.
tags: [sites]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/account-level/sites/skills/upload-a-website-or-html-files
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user has a published, claimed static instant site (from the drop flow) and now wants a
      real store with checkout. The correct move is to turn the static site into a Wix Headless
      project: download the project to the local filesystem and follow the headless guide
      (https://wix.com/headless/skill.md), keeping the same site. The drop flow is static-only, so
      a store cannot be added to it in place. The agent may have no shell of its own; then it lays
      the steps out for the user to run in their terminal, which is fine.

      Pass if the response:
      - explains that a real store/backend means moving the static site to a Wix Headless project
        (a solution chosen because a backend is now needed), keeping the same site, AND
      - gives (or runs) the download to disk with a direct, redirect-following HTTP client in the
        shell — e.g. `curl -sSL -o project.zip
        https://www.wix.com/_api/wixstro-deployments/v1/instant-sites/{metaSiteId}/download.zip`
        — a placeholder for the metaSiteId, or asking which site, is fine — then points to the
        headless guide to wire up the store, AND
      - does not try to add Stores to the static drop site in place (there is no backend there).

      Fail if the response:
      - installs, or tries to install, Wix Stores or any app on the static site in place, OR
      - claims it added a working store to the static site without the headless project, OR
      - attempts to download the project through a Wix API-call or execute-API tool (a tool that
        runs the request through the Wix API and returns the result into the conversation)
        instead of the shell / a direct client, OR
      - re-uploads files through the drop API expecting that to add store functionality, OR
      - invents an "add store" endpoint on the drop/instant-site API.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Examine the tool-call trace. Score 0-10 for how cleanly the agent moved toward a headless
      project for the backend need. 10 = read the skill and handed over (or ran) the download to
      disk with a direct client plus the headless guide, with no misuse. Having no shell and laying
      the commands out for the user is not a detour.

      Penalize and LIST any of:
        - an app-install or Stores call against the static site
        - downloading the project via a Wix API-call / execute-API tool rather than the shell / a
          direct HTTP client
        - re-uploading through the drop API to try to get backend features
        - inventing an endpoint
        - a probing spiral before settling on the headless path

      Return ONLY {"score":<0-10>,"reason":"<terse list, or 'clean headless handoff'>"}
