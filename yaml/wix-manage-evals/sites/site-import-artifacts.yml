name: sites/site-import-artifacts
description: >-
  Verifies the agent knows how Site Import review documents (artifacts) work: every poll advertises
  them as a manifest with an empty content field, the content is fetched by naming ids in the
  artifactIds parameter of the status poll, and the fetched document is read to the user instead of
  being relayed as a filename to open.
triggerPrompt: >-
  My Wix Site Import came back with status NEEDS_INPUT asking me to approve the mapping plan. The
  message mentions review documents, and the response has an artifacts entry with a title and
  contentBytes but its content field is an empty string. Using the Wix Site Import API, explain how I
  actually get that mapping plan document's content, and what an assistant relaying this to a
  non-technical shop owner should show them before asking for approval. Please reference the specific
  Site Import method, request parameter, and response fields; don't start, cancel, or modify any
  imports or site settings.
tags: [sites]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/account-level/sites/skills/site-import
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user's import is at NEEDS_INPUT with an artifacts entry whose content is empty, and they asked
      (a) how to get that review document's content and (b) what to show a non-technical user before
      asking for approval.
      Intent: explain the Site Import review-documents contract — artifacts are advertised as a manifest
      and their content is fetched on demand from the same status poll, then read to the user.

      Pass if the response:
      - explains that an empty `content` is expected: every poll returns the artifacts manifest
        (`id`, `title`, `format`, `contentBytes`) without content, AND
      - says the content is obtained by polling the import again — GET /v1/imports/{importId} — with the
        wanted artifact ids passed in the `artifactIds` request parameter (e.g.
        `?artifactIds=mapping-plan`), so only those documents come back inflated, AND
      - says the assistant should present that content to the user, summarized in plain language,
        before asking for approval — and must not hand the user a filename to open, since the document
        exists only in the API response.

      Fail if the response:
      - claims the content is already returned on every poll, or that the empty content is a bug/error
        in the import, OR
      - invents a different retrieval path — a separate artifact/download endpoint, a file path or URL
        on the import environment, Reply, or a debug method — instead of `artifactIds` on the status
        poll, OR
      - tells the user to open or find the file themselves (e.g. "see mapping-summary.md"), or says the
        document cannot be read, OR
      - is generic with no reference to the artifacts manifest or the artifactIds parameter.
