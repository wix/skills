name: sites/read-site-context-installed-apps
description: >-
  Verifies the agent reads the read-site-context skill and answers "what does this site have" with the
  one-call Dynamic Context read (installed apps by name, locale, currency), rather than several calls.
triggerPrompt: >-
  I'm about to build against my Wix site 6f1c0c2e-3b8a-4e1d-9a7f-2c5d8e4b1a90 and I want the lay of the
  land first: which Wix business apps are installed (and for Stores, which catalog version), the site's
  currency and language, and whether it's published. Fewest calls possible. What do you call?
tags: [sites]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/account-level/sites/skills/read-account-or-site-context
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user wants a site's installed business apps (with the Stores catalog version), currency, language
      and published status, in as few calls as possible.
      Intent: one Dynamic Context call for the site.

      Pass if the response:
      - calls POST https://www.wixapis.com/_api/dynamic-context/v1/dynamic-context/markdown or
        .../dynamic-context with {"siteId": "<the id>"} (or the equivalent GetSiteContext tool), AND
      - says the installed apps come back by display name with ids, including the Stores catalog version
        when Stores is installed, AND
      - reads currency, language and published status from the same response, without separate
        site-properties or installed-apps calls for them.

      Fail if the response:
      - lists installed apps with the Apps Installer or site-properties calls as the primary route when the
        single context call would do, OR
      - claims the context call needs a visitor token, OR
      - gives no concrete call.
