name: sites/site-import-existing-site-destination
description: >-
  Verifies the agent knows Site Import's destination (new site vs. an existing one) is decided by
  call scope, not a request-body field, and calls Start scoped to the user's existing site instead
  of defaulting to an account-level call that would silently create a second, unwanted site.
triggerPrompt: >-
  I already created a Wix site (site ID 5b1f7e2a-6c3d-4a2b-9f1e-3d7c8a9b0e11) to prepare for this —
  please import my old store at https://my-old-store.example.com into that exact site, not a new
  one.
tags: [sites]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/account-level/sites/skills/site-import
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user named an existing Wix site by id and asked Site Import to write into that exact
      site, not create a new one.

      Intent: apply the skill's destination rule — destination is decided by call scope
      (account-level always creates a new site; site-scoped, with the given siteId, writes into
      that existing site), not by any request-body field. There is no destination field to set in
      the body.

      Pass if the response:
      - calls (or clearly describes calling) Start scoped to the user's given site id — a
        site-scoped call, not an account-level one, AND
      - does not claim a `destinationSiteId`/similar body field controls this, AND
      - does not create, or offer to create, a second/new site for this request.

      Fail if the response:
      - makes an account-level Start call (or tells the user this will land in "a new Wix site")
        despite the user naming an existing site to target, OR
      - invents a request-body field (e.g. `destinationSiteId`, `siteId` in the body) as how to
        pick the destination, OR
      - never scopes the call to the given site at all.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Rate how directly the agent reached the right call shape. Examine the tool-call trace.
      Score 0-10 (10 = direct: one site-scoped Start call, no wasted steps). Penalize and LIST any
      of: an account-level Start call before/instead of a site-scoped one; probing other endpoints
      to "find" a destination field; asking the user redundant questions the prompt already
      answered (they already said which site and that it should not be a new one). Return ONLY
      {"score":<0-10>,"reason":"<terse list of frictions, or 'clean path' if none>"}.
