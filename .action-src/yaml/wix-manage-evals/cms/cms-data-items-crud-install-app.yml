name: cms/cms-data-items-crud-install-app
description: >-
  Verifies the agent reads the cms-data-items-crud skill and correctly handles a WDE0110
  error by recommending, or attempting, installation of the Wix CMS app before retrying.
triggerPrompt: >-
  I'm inserting a data item into my Wix CMS collection through the REST API, but the call
  fails with error code WDE0110. What does this mean and how do I get the insert to succeed?
  I only need written REST instructions for now; do not make a live API call or ask me to select
  a site.
tags: [cms]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/cms/skills/cms-data-items-crud
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-solutions/cms/skills/cms-schema-management
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user hit error WDE0110 while inserting a data item into a Wix CMS collection
      and wants to know how to fix it and complete the insert. Evaluate both the final response
      and any Wix API/tool calls made during the run.
      Intent: recognize WDE0110 as "Wix CMS (Wix Data) app not installed" and handle the
      prerequisite before retrying the insert.

      Pass if the agent does either of the following:
      - correctly explains that WDE0110 means the Wix CMS / Wix Data application is not installed,
        recommends installing it with appDefId `e593b0bd-b783-45b8-97c2-873d42aacaf4` via the Apps
        Installer install endpoint, and says to retry the original data-item insert afterward; OR
      - attempts to install the Wix CMS app through a Wix API/tool call and the install request uses
        appDefId `e593b0bd-b783-45b8-97c2-873d42aacaf4` (with a site tenant), then indicates that the
        original insert should be retried after installation.

      Fail if the response:
      - misidentifies WDE0110 (e.g. treats it as a validation, permissions, or wrong-field error), OR
      - tells the user to enable Velo / call a velo provision endpoint to fix it (that flow was removed), OR
      - invents a different appDefId for Wix CMS, OR
      - neither recommends the CMS installation nor makes a valid CMS installation attempt, OR
      - does not address retrying the original insert after the prerequisite is handled.
