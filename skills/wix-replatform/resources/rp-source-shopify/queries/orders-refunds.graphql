# scopes: read_orders
# Bulk query: refunds per order, joined to orders-core by order id.
# Connections: orders (1). A bulk query cannot hold a connection inside a list field, so each refund's
# refundLineItems and transactions are read per refund after the download (read-refund-items.graphql).
{
  orders(query: "created_at:<='{{SNAPSHOT_TIME}}'") {
    edges {
      node {
        id
        refunds {
          id
          createdAt
          processedAt
          updatedAt
          note
          totalRefundedSet { shopMoney { amount currencyCode } presentmentMoney { amount currencyCode } }
        }
      }
    }
  }
}
