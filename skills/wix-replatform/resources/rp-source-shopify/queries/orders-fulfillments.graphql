# scopes: read_orders, read_fulfillments
# Bulk query: fulfillments per order, joined to orders-core by order id.
# Connections: orders (1). A bulk query cannot hold a connection inside a list field, so each fulfillment's
# fulfillmentLineItems are read per fulfillment after the download (read-fulfillment-items.graphql).
{
  orders(query: "created_at:<='{{SNAPSHOT_TIME}}'") {
    edges {
      node {
        id
        fulfillments {
          id
          name
          status
          displayStatus
          createdAt
          updatedAt
          deliveredAt
          inTransitAt
          estimatedDeliveryAt
          totalQuantity
          trackingInfo { company number url }
          location { id }
        }
      }
    }
  }
}
